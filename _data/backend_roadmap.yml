# /roadmap/ 의 내용. 원본은 roadmap.sh/backend(2026-02-07 갱신본)의 세부 항목이고,
# 같은 항목을 _pages/Develop/backend-roadmap-2026.md 가 단계별 도식으로 그린다.
# tag: 추천 = 원본 작성자의 추천 / 대안 = 추천 항목 대신 골라도 된다 / 순서 무관 = 아무 때나
#      — 여기까지 원본 범례 그대로이고, tag 가 없으면 원본에도 표시가 없다
#      국내 추가 = 원본에 없고 국내 조사에서 더한 것 / 별도 로드맵 = 원본에서 링크로만 빠지는 것(url)
# rank: 다음에 집중할 순서 — 국내 공고·발표가 강조하는데 내 노트에 비어 있는 것
# group: 원본 그림의 소분류 라벨(NoSQL 의 문서·그래프 등). 한쪽 열 안에서 바뀔 때마다 라벨이 붙는다
# split: 왼쪽 열에 놓을 항목 수(기본은 절반) — 소분류가 좌우로 갈라지지 않게 맞춘다
# note·links: 원본 작성자의 안내 문장과 관련 로드맵 링크. 원본 그림에서 놓인 자리 옆 주제에 붙였다

