{%- comment -%}
  검색 인덱스를 페이지마다 인라인하던 것을 /assets/search-index.json 으로 분리했다.
  글이 101편인 지금 인라인 인덱스는 페이지당 약 45KB 였고, 검색을 쓰지 않아도
  매번 내려받아 파싱해야 했다 — 페이지 이동이 느리게 느껴지던 원인 중 하나다.

  이제 인덱스는 실제로 필요할 때만 받는다:
    - 검색: 버튼에 마우스를 올리거나 누를 때
    - 관련 글: 해당 영역이 화면에 들어올 때
  한 번 받으면 재사용하고, 브라우저 캐시에도 남는다.
{%- endcomment -%}
<script>
(function(){
    var INDEX_URL = "{{ '/assets/search-index.json' | prepend: site.baseurl }}";
    var cache = null, inflight = null;

    function loadIndex(){
        if (cache) return Promise.resolve(cache);
        if (inflight) return inflight;

        inflight = fetch(INDEX_URL)
            .then(function(r){
                if (!r.ok) throw new Error('search index ' + r.status);
                return r.json();
            })
            .then(function(data){
                cache = data;
                inflight = null;
                return data;
            })
            .catch(function(err){
                inflight = null;
                throw err;
            });

        return inflight;
    }

    // --- 검색 ---------------------------------------------------------------
    var wired = false;

    function initSearch(){
        if (wired) return;
        wired = true;

        loadIndex().then(function(posts){
            searchPost(posts);

            // 인덱스가 도착하기 전에 이미 입력한 글자가 있으면 즉시 반영한다
            var input = document.getElementById('search-input');
            if (input && input.value) {
                input.dispatchEvent(new Event('keyup'));
            }
        }).catch(function(){
            var results = document.getElementById('search-result');
            if (results) {
                results.style.display = 'block';
                results.innerHTML = '<li class="result-item">'
                    + '<span class="description">검색 목록을 불러오지 못했습니다.</span></li>';
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function(){
        document.querySelectorAll('#btn-search').forEach(function(btn){
            // 누르기 전에 미리 받아두면 첫 검색이 즉시 반응한다
            btn.addEventListener('mouseenter', loadIndex, { once:true });
            btn.addEventListener('focus', loadIndex, { once:true });
            btn.addEventListener('click', initSearch);
        });
    });

    {% if page_type == "post" %}
    // --- 관련 글: 화면에 들어올 때 채운다 ------------------------------------
    document.addEventListener('DOMContentLoaded', function(){
        var box = document.getElementById('related-box');
        if (!box) return;

        var fill = function(){
            loadIndex().then(function(posts){ searchRelated(posts); })
                       .catch(function(){ box.style.display = 'none'; });
        };

        if ('IntersectionObserver' in window) {
            var io = new IntersectionObserver(function(entries){
                if (entries[0].isIntersecting) { io.disconnect(); fill(); }
            }, { rootMargin: '400px' });
            io.observe(box);
        } else {
            fill();
        }
    });
    {% endif %}
})();
</script>
