<script>
// 검색 인덱스는 페이지마다 심지 않고 별도 JSON 으로 두고, 검색을 처음 열 때만
// 받는다. 인덱스를 HTML 에 넣어두면 모든 페이지가 그만큼(28KB) 무거워지는데
// 정작 검색을 쓰는 사람은 일부다.
(function () {
  var box = document.getElementById('search');
  var input = document.getElementById('search-input');
  var out = document.getElementById('search-results');
  var hint = document.getElementById('search-hint');
  var openBtn = document.getElementById('btn-search');
  if (!box || !input || !openBtn) return;

  var index = null, loading = null;

  function load() {
    if (loading) return loading;
    loading = fetch('{{ "/assets/search-index.json" | prepend: site.baseurl }}')
      .then(function (r) { return r.json(); })
      .then(function (d) { index = d; return d; })
      .catch(function () { loading = null; });
    return loading;
  }

  function open() {
    box.hidden = false;
    document.body.style.overflow = 'hidden';
    load().then(function () { input.focus(); });
    input.focus();
  }

  function close() {
    box.hidden = true;
    document.body.style.overflow = '';
    input.value = '';
    out.innerHTML = '';
    hint.textContent = '제목과 본문에서 찾습니다.';
  }

  // 버튼에 마우스만 올려도 미리 받아둔다 — 누를 때쯤이면 준비되어 있다.
  openBtn.addEventListener('mouseenter', load, { once: true });
  openBtn.addEventListener('click', open);
  box.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-search-close')) close();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !box.hidden) close();
    // cmd/ctrl + K
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); box.hidden ? open() : close(); }
  });

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var timer;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(run, 120);
  });

  // 맞은 자리 앞뒤를 잘라내고, 맞은 말만 강조한다.
  function excerpt(body, pos, len) {
    var start = Math.max(0, pos - 40);
    var head = (start > 0 ? '…' : '') + body.slice(start, pos);
    var tail = body.slice(pos + len, pos + len + 60);
    if (pos + len + 60 < body.length) tail += '…';
    return esc(head) + '<mark>' + esc(body.slice(pos, pos + len)) + '</mark>' + esc(tail);
  }

  function run() {
    var q = input.value.trim().toLowerCase();
    if (!q) { out.innerHTML = ''; hint.textContent = '제목과 본문에서 찾습니다.'; return; }
    if (!index) { hint.textContent = '불러오는 중…'; load().then(run); return; }

    // 제목 > 태그 > 경로 > 본문 순으로 매긴다. 본문은 코드블록을 뺀 것이고,
    // 맞은 자리 앞뒤를 잘라 결과에 함께 보여준다.
    var hits = [];
    for (var i = 0; i < index.length && hits.length < 20; i++) {
      var it = index[i];
      if (it.type === 'category') continue;
      var pos = it.title.toLowerCase().indexOf(q);
      if (pos > -1) { hits.push({ it: it, rank: pos === 0 ? 0 : 1 }); continue; }
      if ((it.tags || '').toLowerCase().indexOf(q) > -1) { hits.push({ it: it, rank: 2 }); continue; }
      if ((it.path || '').toLowerCase().indexOf(q) > -1) { hits.push({ it: it, rank: 3 }); continue; }
      var bpos = (it.body || '').toLowerCase().indexOf(q);
      if (bpos > -1) hits.push({ it: it, rank: 4, snip: excerpt(it.body, bpos, q.length) });
    }
    hits.sort(function (a, b) { return a.rank - b.rank; });

    hint.textContent = hits.length ? hits.length + '건' : '결과가 없습니다.';
    out.innerHTML = hits.map(function (h) {
      return '<li><a href="' + h.it.url + '">' +
             '<span class="search__cat">' + esc(h.it.path || '') + '</span>' +
             '<span class="search__title">' + esc(h.it.title) + '</span>' +
             (h.snip ? '<span class="search__snip">' + h.snip + '</span>' : '') +
             '</a></li>';
    }).join('');
  }
})();
</script>
