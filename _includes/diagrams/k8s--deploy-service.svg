<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="디플로이먼트와 서비스가 각각 라벨을 보고 같은 파드 묶음을 찾아내는 구조">
  <marker id="k8sds-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
