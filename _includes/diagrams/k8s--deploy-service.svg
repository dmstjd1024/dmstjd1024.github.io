  <text class="dg-v" x="416" y="122">selector: app=nginx</text>

  <path class="dg-arw" d="M174 140 V166 H360 V186" marker-end="url(#k8sds-a)"/>
  <path class="dg-arw" d="M546 140 V166 H360 V186" marker-end="url(#k8sds-a)"/>

  <rect class="dg-lane" x="24" y="192" width="672" height="90" rx="10"/>
