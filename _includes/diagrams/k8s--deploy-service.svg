  </marker>

  <text class="dg-h" x="24" y="30">둘은 파드를 이름이 아니라 라벨로 찾는다</text>

  <rect class="dg-item" x="24" y="56" width="300" height="76" rx="8"/>
  <text class="dg-t" x="44" y="80">디플로이먼트</text>
  <text class="dg-s" x="44" y="102">개수를 맞춰 놓는다</text>
