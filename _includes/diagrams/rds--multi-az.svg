  <rect class="dg-zone" x="24" y="32" width="312" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="74" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">다중 가용 영역</text>
  <rect class="dg-item" x="76" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="124" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">원본</text>
  <text class="dg-s" x="124" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">가용영역 A</text>
  <rect class="dg-item" x="188" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">복제본</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">가용영역 B</text>
  <path class="dg-arw" d="M180,132 V170" marker-end="url(#rds--multi-az-arw-n)"/>

  <!-- 읽기 전용 복제본 -->
  <rect class="dg-zone" x="24" y="176" width="312" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="83" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">읽기 전용 복제본</text>
  <rect class="dg-item" x="76" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="124" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">원본</text>
  <text class="dg-s" x="124" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">읽기 · 쓰기</text>
  <rect class="dg-item" x="188" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="236" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">복제본</text>
  <text class="dg-s" x="236" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">읽기 전용</text>
</svg>
