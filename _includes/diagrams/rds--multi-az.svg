<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="rds--multi-az-title rds--multi-az-desc">
  <title id="rds--multi-az-title">다중 가용 영역 복제본과 읽기 전용 복제본의 목적 차이</title>
  <desc id="rds--multi-az-desc">다중 가용 영역 복제본과 읽기 전용 복제본의 목적 차이</desc>

  <defs>
    <marker id="rds--multi-az-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 다중 가용 영역 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="74" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">다중 가용 영역</text>
  <rect class="dg-item" x="256" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="304" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">원본</text>
  <text class="dg-s" x="304" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">가용영역 A</text>
  <rect class="dg-item" x="368" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="416" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">복제본</text>
  <text class="dg-s" x="416" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">가용영역 B</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#rds--multi-az-arw-w)"/>

  <!-- 읽기 전용 복제본 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="83" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">읽기 전용 복제본</text>
  <rect class="dg-item" x="256" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="304" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">원본</text>
  <text class="dg-s" x="304" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">읽기 · 쓰기</text>
  <rect class="dg-item" x="368" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="416" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">복제본</text>
  <text class="dg-s" x="416" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">읽기 전용</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" class="dg-narrow" viewBox="0 0 360 292" role="presentation" aria-hidden="true">

  <defs>
    <marker id="rds--multi-az-arw-n" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

