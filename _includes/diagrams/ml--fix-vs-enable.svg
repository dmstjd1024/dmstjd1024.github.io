<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="ml--fix-vs-enable-title ml--fix-vs-enable-desc">
  <title id="ml--fix-vs-enable-title">전달 경로를 고치는 것과 그 기능을 켤지 정하는 것을 별개 판단으로 나눈 과정</title>
  <desc id="ml--fix-vs-enable-desc">전달 경로를 고치는 것과 그 기능을 켤지 정하는 것을 별개 판단으로 나눈 과정</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 버그 수정 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">버그 수정</text>
  <rect class="dg-item" x="185" y="56" width="207" height="52" rx="6"/>
  <text class="dg-t" x="288" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">환경변수가 컨테이너까지 안 갔다</text>
  <rect class="dg-item" x="408" y="56" width="126" height="52" rx="6"/>
  <text class="dg-t" x="471" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">전달 경로를 복구</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 그래서 켤 것인가 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="83" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">그래서 켤 것인가</text>
  <rect class="dg-item" x="167" y="200" width="212" height="52" rx="6"/>
  <text class="dg-t" x="273" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">"ML 을 켜는 게 실제로 더 나은가"</text>
  <rect class="dg-item" x="395" y="200" width="158" height="52" rx="6"/>
  <text class="dg-t" x="474" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">기본값은 false 로 유지</text>
</svg>
