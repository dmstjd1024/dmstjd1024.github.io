<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="auth-filter--securitycontext-title auth-filter--securitycontext-desc">
  <title id="auth-filter--securitycontext-title">SecurityContext 가 ThreadLocal 기반이라 비동기 스레드로 전파되지 않는 문제</title>
