<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="auth-filter--securitycontext-title auth-filter--securitycontext-desc">
  <title id="auth-filter--securitycontext-title">SecurityContext 가 ThreadLocal 기반이라 비동기 스레드로 전파되지 않는 문제</title>
  <desc id="auth-filter--securitycontext-desc">SecurityContext 가 ThreadLocal 기반이라 비동기 스레드로 전파되지 않는 문제</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="129" y="56" width="221" height="52" rx="6"/>
  <text class="dg-t" x="239" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">전파 설정을 끼운다</text>
  <text class="dg-s" x="239" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DelegatingSecurityContext · AsyncTaskEx…</text>
  <rect class="dg-item" x="366" y="56" width="225" height="52" rx="6"/>
  <text class="dg-t" x="478" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">username 을 인자로 넘긴다  (채택…</text>
  <text class="dg-s" x="478" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">비동기 쪽은 SecurityContext 를 · 아예 안…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 요청 스레드 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="62" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">요청 스레드</text>
  <rect class="dg-item" x="286" y="200" width="148" height="52" rx="6"/>
  <text class="dg-t" x="360" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SecurityContext 있음</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- 비동기 스레드 -->
