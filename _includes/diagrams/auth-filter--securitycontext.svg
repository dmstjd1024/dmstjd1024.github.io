  <rect class="dg-item" x="286" y="344" width="148" height="52" rx="6"/>
  <text class="dg-t" x="360" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SecurityContext 없음</text>
