<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="모호한 행을 전부 실패시키거나 임의 선택하는 대신 되묻는 방식">
  <marker id="exab-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">수천 행 중 몇 십 행만 모호할 때</text>

  <rect class="dg-lane" x="24" y="48" width="216" height="150" rx="10"/>
  <text class="dg-t" x="44" y="74">전부 실패시키기</text>
  <rect class="dg-warn" x="44" y="88" width="176" height="30" rx="6"/>
  <text class="dg-k" x="60" y="108">업로드 거부</text>
  <text class="dg-v" x="44" y="140">안전하긴 하다</text>
  <text class="dg-s" x="44" y="164">멀쩡한 수천 행까지</text>
  <text class="dg-s" x="44" y="182">다시 올려야 한다</text>

  <rect class="dg-lane" x="252" y="48" width="216" height="150" rx="10"/>
  <text class="dg-t" x="272" y="74">알아서 하나 고르기</text>
  <rect class="dg-warn" x="272" y="88" width="176" height="30" rx="6"/>
  <text class="dg-k" x="288" y="108">첫 번째를 채택</text>
  <text class="dg-v" x="272" y="140">전부 성공한 것처럼 보인다</text>
  <text class="dg-s" x="272" y="164">틀린 조직에 배정돼도</text>
  <text class="dg-s" x="272" y="182">아무도 모른다</text>

  <rect class="dg-lane" x="480" y="48" width="216" height="150" rx="10"/>
  <text class="dg-t" x="500" y="74">되묻기</text>
  <rect class="dg-out" x="500" y="88" width="176" height="30" rx="6"/>
  <text class="dg-k" x="516" y="108">모호한 행만 표시</text>
  <text class="dg-v" x="500" y="140">확실한 행은 그대로 처리</text>
  <text class="dg-s" x="500" y="164">사용자가 몇 십 개만</text>
  <text class="dg-s" x="500" y="182">골라주면 끝난다</text>

  <path class="dg-arw" d="M240 120 H248" marker-end="url(#exab-a)"/>
  <path class="dg-arw" d="M468 120 H476" marker-end="url(#exab-a)"/>

  <text class="dg-v" x="24" y="244">"1지점" 이 셋이면 서버가 고를 수 없다 — 고를 수 있는 건 사용자뿐이다</text>
  <text class="dg-s" x="24" y="272">모른다는 사실을 감추지 않고 물어보는 것이, 안전과 편의를 동시에 잡는 길이었다</text>
</svg>
