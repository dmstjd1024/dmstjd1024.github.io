<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="뷰는 읽을 때마다 재계산하고 물질화 테이블은 쓸 때 한 번 계산한다">
  <marker id="mtcs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">계산 비용을 읽기에서 쓰기로 옮긴다</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="184" rx="10"/>
  <text class="dg-t" x="44" y="74">뷰 (@Subselect)</text>

  <rect class="dg-warn" x="44" y="88" width="288" height="26" rx="4"/>
  <text class="dg-v" x="60" y="106">조회 1 → CTE 5개 풀스캔</text>
  <rect class="dg-warn" x="44" y="120" width="288" height="26" rx="4"/>
  <text class="dg-v" x="60" y="138">조회 2 → 또 풀스캔</text>
  <rect class="dg-warn" x="44" y="152" width="288" height="26" rx="4"/>
  <text class="dg-v" x="60" y="170">조회 3 → 또 풀스캔</text>

  <rect class="dg-row" x="44" y="188" width="288" height="26" rx="4"/>
  <text class="dg-s" x="60" y="206">쓰기는 아무 일도 안 한다</text>

  <text class="dg-s" x="44" y="226">화면을 열 때마다 전체 재계산</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="184" rx="10"/>
  <text class="dg-t" x="388" y="74">물질화 테이블 (_mat)</text>

  <rect class="dg-out" x="388" y="88" width="288" height="26" rx="4"/>
  <text class="dg-v" x="404" y="106">조회 1 → 그냥 읽기</text>
  <rect class="dg-out" x="388" y="120" width="288" height="26" rx="4"/>
  <text class="dg-v" x="404" y="138">조회 2 → 그냥 읽기</text>
  <rect class="dg-out" x="388" y="152" width="288" height="26" rx="4"/>
  <text class="dg-v" x="404" y="170">조회 3 → 그냥 읽기</text>

  <rect class="dg-lead" x="388" y="188" width="288" height="26" rx="4"/>
  <text class="dg-k" x="404" y="206">쓰기 때 한 번 계산해 넣는다</text>

  <text class="dg-s" x="388" y="226">데이터 변경 시점에만 비용 발생</text>

  <text class="dg-v" x="24" y="266">쓰기가 드물고 읽기가 잦을 때만 이득이다 — 반대라면 손해다</text>
  <text class="dg-s" x="24" y="290">동기화는 도메인 이벤트 + AFTER_COMMIT 리스너로 붙였다</text>
</svg>
