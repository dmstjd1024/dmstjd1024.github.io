<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="commit-lie--trust-title commit-lie--trust-desc">
  <title id="commit-lie--trust-title">커밋 메시지의 가치는 개별 정확도가 아니라 믿고 읽어도 된다는 전제에서 나온다는 구조</title>
  <desc id="commit-lie--trust-desc">커밋 메시지의 가치는 개별 정확도가 아니라 믿고 읽어도 된다는 전제에서 나온다는 구조</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 믿을 수 있을 때 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="79" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">믿을 수 있을 때</text>
  <rect class="dg-item" x="281" y="56" width="158" height="52" rx="6"/>
  <text class="dg-t" x="360" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">메시지를 읽고 넘어간다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 거짓이 하나 나오면 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="91" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">거짓이 하나 나오면</text>
  <rect class="dg-item" x="270" y="200" width="180" height="52" rx="6"/>
  <text class="dg-t" x="360" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">매번 diff 를 열어봐야 한다</text>
</svg>
