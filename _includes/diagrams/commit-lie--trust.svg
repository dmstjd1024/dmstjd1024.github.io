<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="커밋 메시지의 가치는 개별 정확도가 아니라 믿고 읽어도 된다는 전제에서 나온다는 구조">
  <marker id="cmlt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">한 건의 거짓이 전체를 무너뜨린다</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="44" y="74">믿을 수 있을 때</text>

  <rect class="dg-out" x="44" y="88" width="288" height="30" rx="6"/>
  <text class="dg-k" x="60" y="108">메시지를 읽고 넘어간다</text>
  <text class="dg-v" x="44" y="144">코드는 "무엇을" 을 말하고</text>
  <text class="dg-v" x="44" y="166">메시지는 "왜" 를 말한다</text>
  <text class="dg-s" x="44" y="188">6개월 뒤의 나에게 남기는 유일한 기록</text>

  <path class="dg-arw" d="M360 120 H380" marker-end="url(#cmlt-a)"/>
  <text class="dg-s" x="352" y="110">한 건 발각</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="388" y="74">거짓이 하나 나오면</text>

  <rect class="dg-warn" x="388" y="88" width="288" height="30" rx="6"/>
  <text class="dg-k" x="404" y="108">매번 diff 를 열어봐야 한다</text>
  <text class="dg-v" x="388" y="144">나머지 메시지도 못 믿는다</text>
  <text class="dg-v" x="388" y="166">그러면 읽을 이유가 사라진다</text>
  <text class="dg-s" x="388" y="188">히스토리 전체의 신뢰도가 함께 떨어진다</text>

  <rect class="dg-lane" x="24" y="222" width="672" height="62" rx="8"/>
  <text class="dg-v" x="44" y="248">메시지의 가치는 개별 정확도가 아니라 "믿고 읽어도 된다" 는 전제에서 나온다</text>
  <text class="dg-s" x="44" y="270">git log --grep 이 못 찾거나, blame 으로 도달해도 다른 얘기를 하게 된다</text>
</svg>
