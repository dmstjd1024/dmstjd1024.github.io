  <text class="dg-s" x="117" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">코드를 쓰고 커밋한다</text>
  <rect class="dg-item" x="197" y="266" width="110" height="52" rx="6"/>
  <text class="dg-t" x="252" y="288" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">게이트 1 요청</text>
  <text class="dg-s" x="252" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">스스로 확인할 때</text>
