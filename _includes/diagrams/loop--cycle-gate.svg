<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="loop--cycle-gate-title loop--cycle-gate-desc">
  <title id="loop--cycle-gate-title">세션은 구현과 커밋만 하고, 태스크를 잡는 일과 done 을 찍는 일은 양쪽 끝에서 CLI 가 맡는다</title>
  <desc id="loop--cycle-gate-desc">세션은 구현과 커밋만 하고, 태스크를 잡는 일과 done 을 찍는 일은 양쪽 끝에서 CLI 가 맡는다</desc>

  <defs>
    <marker id="loop--cycle-gate-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- CLI 가 한다 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="62" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CLI 가 한다</text>
  <rect class="dg-item" x="148" y="56" width="177" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">next</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">태스크를 고르고 · 브랜치를 판다</text>
  <rect class="dg-item" x="341" y="56" width="230" height="52" rx="6"/>
  <text class="dg-t" x="456" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">complete</text>
  <text class="dg-s" x="456" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">게이트 재검증 · 머지 · git 에 물어 · done…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#loop--cycle-gate-arw-w)"/>

  <!-- 세션이 한다 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="62" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">세션이 한다</text>
  <rect class="dg-item" x="233" y="200" width="128" height="52" rx="6"/>
  <text class="dg-t" x="297" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">구현</text>
  <text class="dg-s" x="297" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">코드를 쓰고 커밋한다</text>
  <rect class="dg-item" x="377" y="200" width="110" height="52" rx="6"/>
  <text class="dg-t" x="432" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">게이트 1 요청</text>
  <text class="dg-s" x="432" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">스스로 확인할 때</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#loop--cycle-gate-arw-w)"/>

  <!-- 통과하지 못하면 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="79" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">통과하지 못하면</text>
  <rect class="dg-item" x="160" y="344" width="194" height="52" rx="6"/>
  <text class="dg-t" x="257" y="366" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">fail</text>
  <text class="dg-s" x="257" y="383" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">시도를 하나 태운다 · 세 번이면 보류</text>
  <rect class="dg-item" x="370" y="344" width="190" height="52" rx="6"/>
  <text class="dg-t" x="465" y="366" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">block</text>
  <text class="dg-s" x="465" y="383" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">시도를 안 태운다 · 사람에게 넘긴다</text>
</svg>
