  <rect class="dg-item" x="83" y="410" width="194" height="52" rx="6"/>
  <text class="dg-t" x="180" y="432" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">fail</text>
  <text class="dg-s" x="180" y="449" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">시도를 하나 태운다 · 세 번이면 보류</text>
  <rect class="dg-item" x="85" y="476" width="190" height="52" rx="6"/>
