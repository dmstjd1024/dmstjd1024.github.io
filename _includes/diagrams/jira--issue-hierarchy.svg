  <rect class="dg-item" x="63" y="56" width="110" height="52" rx="6"/>
  <text class="dg-t" x="118" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">에픽 (Epic)</text>
  <text class="dg-s" x="118" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">결제 시스템 구축</text>
  <rect class="dg-item" x="189" y="56" width="132" height="52" rx="6"/>
  <text class="dg-t" x="255" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">스토리 (Story)</text>
  <text class="dg-s" x="255" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">카드로 결제할 수 있다</text>
  <rect class="dg-item" x="337" y="56" width="155" height="52" rx="6"/>
