<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 148" role="img" aria-labelledby="jira--issue-hierarchy-title jira--issue-hierarchy-desc">
  <title id="jira--issue-hierarchy-title">에픽 아래 스토리, 스토리 아래 서브태스크로 내려가는 이슈 계층 구조</title>
  <desc id="jira--issue-hierarchy-desc">에픽 아래 스토리, 스토리 아래 서브태스크로 내려가는 이슈 계층 구조</desc>

  <defs>
