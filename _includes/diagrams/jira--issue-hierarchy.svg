  <text class="dg-s" x="414" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">버그 (Bug) · 태스크 (Task)</text>
  <rect class="dg-item" x="508" y="56" width="148" height="52" rx="6"/>
  <text class="dg-t" x="582" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">서브태스크 : PG 연동</text>
