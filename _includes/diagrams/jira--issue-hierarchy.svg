<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="에픽 아래 스토리, 스토리 아래 서브태스크로 내려가는 이슈 계층 구조">
  <marker id="jirah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">이슈는 아래로 갈수록 잘게 쪼개진다</text>

  <rect class="dg-lane" x="24" y="52" width="672" height="196" rx="10"/>

  <rect class="dg-lead" x="44" y="72" width="180" height="44" rx="6"/>
  <text class="dg-k" x="64" y="92">에픽 (Epic)</text>
  <text class="dg-s" x="64" y="109">결제 시스템 구축</text>

  <path class="dg-arw" d="M134 124 V140" marker-end="url(#jirah-a)"/>

  <rect class="dg-row" x="44" y="148" width="180" height="44" rx="6"/>
  <text class="dg-k" x="64" y="168">스토리 (Story)</text>
  <text class="dg-s" x="64" y="185">카드로 결제할 수 있다</text>

  <path class="dg-arw" d="M134 200 V216" marker-end="url(#jirah-a)"/>

  <rect class="dg-item" x="44" y="204" width="180" height="34" rx="6"/>
  <text class="dg-v" x="64" y="226">서브태스크 : PG 연동</text>

  <text class="dg-t" x="268" y="92">여러 스프린트에 걸친다</text>
  <text class="dg-s" x="268" y="112">한 번에 못 끝내는 큰 덩어리</text>

  <text class="dg-t" x="268" y="168">한 스프린트 안에 끝난다</text>
  <text class="dg-s" x="268" y="188">사용자 관점의 요구사항 하나</text>

  <text class="dg-t" x="268" y="222">하루 안에 끝난다</text>
  <text class="dg-s" x="268" y="240">실제로 손이 가는 작업</text>

  <rect class="dg-row" x="500" y="140" width="176" height="88" rx="8"/>
  <text class="dg-t" x="520" y="164">같은 층에 놓이는 것</text>
  <text class="dg-v" x="520" y="188">버그 (Bug)</text>
  <text class="dg-v" x="520" y="210">태스크 (Task)</text>

  <text class="dg-s" x="24" y="278">13 포인트가 넘어가면 스토리가 아니라 에픽이다 — 그때는 쪼갠다</text>
  <text class="dg-s" x="24" y="300">쪼개는 기준은 &quot;한 스프린트 안에 끝나는가&quot;</text>
</svg>
