<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="live-study--runtime-data-area-title live-study--runtime-data-area-desc">
  <title id="live-study--runtime-data-area-title">Runtime Data Area 네 영역과 쓰레드 공유 여부, GC 대상 여부</title>
  <desc id="live-study--runtime-data-area-desc">Runtime Data Area 네 영역과 쓰레드 공유 여부, GC 대상 여부</desc>

  <defs>
    <marker id="live-study--runtime-data-area-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 모든 쓰레드가 함께 쓴다 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="112" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">모든 쓰레드가 함께 쓴다</text>
  <rect class="dg-item" x="127" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="243" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Method Area</text>
  <text class="dg-s" x="243" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">클래스 · 인터페이스 · 메서드 · 필드 정보 · G…</text>
  <rect class="dg-item" x="375" y="56" width="217" height="52" rx="6"/>
  <text class="dg-t" x="483" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Heap</text>
  <text class="dg-s" x="483" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">new 로 만든 인스턴스가 사는 곳 · GC 대상</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#live-study--runtime-data-area-arw-w)"/>

  <!-- 쓰레드마다 따로 갖는다 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="108" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">쓰레드마다 따로 갖는다</text>
  <rect class="dg-item" x="120" y="200" width="232" height="52" rx="6"/>
  <text class="dg-t" x="236" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">JVM Stacks</text>
  <text class="dg-s" x="236" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">매개변수 · 지역변수 같은 임시 데이터 · 메서드…</text>
  <rect class="dg-item" x="368" y="200" width="232" height="52" rx="6"/>
  <text class="dg-t" x="484" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PC Registers</text>
  <text class="dg-s" x="484" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">현재 실행 중인 JVM 명령 주소 · 쓰레드가 생길…</text>
</svg>
