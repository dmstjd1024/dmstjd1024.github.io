<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 580" role="img" aria-labelledby="odata--crud-mapping-title odata--crud-mapping-desc">
  <title id="odata--crud-mapping-title">OData 모델의 create, read, update, remove 함수가 각각 어떤 HTTP 요청으로 나가는지</title>
  <desc id="odata--crud-mapping-desc">OData 모델의 create, read, update, remove 함수가 각각 어떤 HTTP 요청으로 나가는지</desc>

  <defs>
    <marker id="odata--crud-mapping-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- create() -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="49" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">create()</text>
  <rect class="dg-item" x="312" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">POST</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#odata--crud-mapping-arw-w)"/>

  <!-- read() -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="41" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">read()</text>
  <rect class="dg-item" x="312" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GET</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#odata--crud-mapping-arw-w)"/>

  <!-- update() -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="49" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">update()</text>
  <rect class="dg-item" x="310" y="344" width="99" height="52" rx="6"/>
  <text class="dg-t" x="359" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PUT / MERGE</text>
  <path class="dg-arw" d="M360,420 V458" marker-end="url(#odata--crud-mapping-arw-w)"/>

  <!-- remove() -->
  <rect class="dg-zone" x="24" y="464" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="458" width="49" height="12" rx="2"/>
  <text class="dg-s" x="44" y="467" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">remove()</text>
  <rect class="dg-item" x="312" y="488" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="519" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">DELETE</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" class="dg-narrow" viewBox="0 0 360 580" role="presentation" aria-hidden="true">

  <defs>
