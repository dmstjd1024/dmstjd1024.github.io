<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="useMemo 는 값을 useCallback 은 함수를 useRef 는 참조를 기억한다">

  <text class="dg-h" x="24" y="30">셋 다 '기억' 이지만 기억하는 것이 다르다</text>

  <rect class="dg-item" x="24" y="48" width="212" height="164" rx="10"/>
  <text class="dg-t" x="44" y="76">useMemo</text>
  <rect class="dg-lead" x="44" y="90" width="172" height="34" rx="6"/>
  <text class="dg-k" x="60" y="112">값을 기억</text>
  <text class="dg-v" x="44" y="146">계산이 무거울 때</text>
  <text class="dg-s" x="44" y="168">의존성이 그대로면</text>
  <text class="dg-s" x="44" y="186">다시 계산하지 않는다</text>

  <rect class="dg-item" x="252" y="48" width="212" height="164" rx="10"/>
  <text class="dg-t" x="272" y="76">useCallback</text>
  <rect class="dg-lead" x="272" y="90" width="172" height="34" rx="6"/>
  <text class="dg-k" x="288" y="112">함수를 기억</text>
  <text class="dg-v" x="272" y="146">함수를 넘길 때</text>
  <text class="dg-s" x="272" y="168">매번 새 함수가 되면</text>
  <text class="dg-s" x="272" y="186">받는 쪽이 또 렌더링된다</text>

  <rect class="dg-item" x="480" y="48" width="216" height="164" rx="10"/>
  <text class="dg-t" x="500" y="76">useRef</text>
  <rect class="dg-lead" x="500" y="90" width="176" height="34" rx="6"/>
  <text class="dg-k" x="516" y="112">참조를 기억</text>
  <text class="dg-v" x="500" y="146">DOM 을 직접 만질 때</text>
  <text class="dg-s" x="500" y="168">바뀌어도 재렌더링이</text>
  <text class="dg-s" x="500" y="186">일어나지 않는다</text>

  <rect class="dg-lane" x="24" y="228" width="672" height="40" rx="8"/>
  <text class="dg-v" x="44" y="254">useCallback(fn, deps) 는 useMemo(() =&gt; fn, deps) 와 같은 말이다</text>
</svg>
