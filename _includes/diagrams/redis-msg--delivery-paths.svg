  <text class="dg-t" x="180" y="153" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">구독자에게 즉시 밀어냄</text>
  <rect class="dg-item" x="109" y="188" width="142" height="52" rx="6"/>
  <text class="dg-t" x="180" y="219" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">서버에 남는 것 없음</text>
  <path class="dg-arw" d="M180,264 V302" marker-end="url(#redis-msg--delivery-paths-arw-n)"/>

  <!-- List -->
  <rect class="dg-zone" x="24" y="308" width="312" height="166" rx="8"/>
  <rect class="dg-mask" x="40" y="302" width="32" height="12" rx="2"/>
  <text class="dg-s" x="44" y="311" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">List</text>
  <rect class="dg-item" x="66" y="332" width="96" height="52" rx="6"/>
  <text class="dg-t" x="114" y="363" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">LPUSH</text>
  <rect class="dg-item" x="178" y="332" width="115" height="52" rx="6"/>
  <text class="dg-t" x="235" y="363" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">키에 쌓여 대기</text>
  <rect class="dg-item" x="111" y="398" width="137" height="52" rx="6"/>
  <text class="dg-t" x="179" y="429" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">RPOP 한 1건만 증발</text>
  <path class="dg-arw" d="M180,474 V512" marker-end="url(#redis-msg--delivery-paths-arw-n)"/>

  <!-- Streams -->
  <rect class="dg-zone" x="24" y="518" width="312" height="232" rx="8"/>
  <rect class="dg-mask" x="40" y="512" width="45" height="12" rx="2"/>
  <text class="dg-s" x="44" y="521" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">Streams</text>
  <rect class="dg-item" x="132" y="542" width="96" height="52" rx="6"/>
  <text class="dg-t" x="180" y="573" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">XADD</text>
  <rect class="dg-item" x="103" y="608" width="153" height="52" rx="6"/>
  <text class="dg-t" x="179" y="639" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">append 되고 안 지워짐</text>
  <rect class="dg-item" x="106" y="674" width="148" height="52" rx="6"/>
  <text class="dg-t" x="180" y="705" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PEL 에 미처리로 남음</text>
</svg>
