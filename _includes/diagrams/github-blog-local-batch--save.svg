<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 148" role="img" aria-labelledby="github-blog-local-batch--save-title github-blog-local-batch--save-desc">
  <title id="github-blog-local-batch--save-title">메모장에서 다른 이름으로 저장할 때 파일 이름과 형식을 지정하는 방법</title>
  <desc id="github-blog-local-batch--save-desc">메모장에서 다른 이름으로 저장할 때 파일 이름과 형식을 지정하는 방법</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 형식을 "모든 파일"로 바꾸지 않으면 blog.bat.txt 로 저장된다 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="263" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">형식을 "모든 파일"로 바꾸지 않으면 blog.bat.txt 로 저장된다</text>
  <rect class="dg-item" x="230" y="56" width="137" height="52" rx="6"/>
  <text class="dg-t" x="298" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">파일 이름</text>
  <text class="dg-s" x="298" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">blog.bat · 확장자 .bat</text>
  <rect class="dg-item" x="383" y="56" width="106" height="52" rx="6"/>
  <text class="dg-t" x="436" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">파일 형식</text>
  <text class="dg-s" x="436" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">모든 파일 (*.*)</text>
</svg>
