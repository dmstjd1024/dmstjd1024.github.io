<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="live-study7--singleton-title live-study7--singleton-desc">
  <title id="live-study7--singleton-title">생성자를 private 로 막고 static 메서드로만 인스턴스를 얻게 하는 싱글톤 구조</title>
  <desc id="live-study7--singleton-desc">생성자를 private 로 막고 static 메서드로만 인스턴스를 얻게 하는 싱글톤 구조</desc>

  <defs>
    <marker id="live-study7--singleton-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="170" y="56" width="199" height="52" rx="6"/>
  <text class="dg-t" x="269" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">new Singleton()</text>
  <text class="dg-s" x="269" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">외부에서 만들 수 없다 — 컴파일 에러</text>
  <rect class="dg-item" x="385" y="56" width="164" height="52" rx="6"/>
  <text class="dg-t" x="467" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Singleton.getInstance()</text>
  <text class="dg-s" x="467" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">이 통로로만 받을 수 있다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#live-study7--singleton-arw-w)"/>

  <!-- 클래스 안쪽 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="62" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">클래스 안쪽</text>
  <rect class="dg-item" x="158" y="200" width="202" height="52" rx="6"/>
  <text class="dg-t" x="259" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">private static Singleton s =…</text>
  <rect class="dg-item" x="376" y="200" width="185" height="52" rx="6"/>
  <text class="dg-t" x="468" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">public static getInstance()</text>
</svg>
