  <rect class="dg-item" x="387" y="200" width="185" height="52" rx="6"/>
  <text class="dg-t" x="479" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">가려져 있던 결함이 드러났다</text>
</svg>
