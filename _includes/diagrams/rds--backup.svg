<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="rds--backup-title rds--backup-desc">
  <title id="rds--backup-title">자동 백업과 스냅샷의 생성 주체와 인스턴스 삭제 시 차이</title>
  <desc id="rds--backup-desc">자동 백업과 스냅샷의 생성 주체와 인스턴스 삭제 시 차이</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-item" x="78" y="56" width="164" height="52" rx="6"/>
  <text class="dg-t" x="160" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">자동 백업 (Auto Backup)</text>
  <rect class="dg-item" x="258" y="56" width="131" height="52" rx="6"/>
  <text class="dg-t" x="323" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">스냅샷 (Snapshot)</text>
  <rect class="dg-item" x="405" y="56" width="106" height="52" rx="6"/>
  <text class="dg-t" x="458" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">생성</text>
  <text class="dg-s" x="458" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RDS 가 자동으로</text>
  <rect class="dg-item" x="527" y="56" width="115" height="52" rx="6"/>
  <text class="dg-t" x="584" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">생성</text>
  <text class="dg-s" x="584" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">개발자가 수동으로</text>
  <rect class="dg-item" x="90" y="122" width="101" height="52" rx="6"/>
  <text class="dg-t" x="140" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">보관 기간</text>
  <text class="dg-s" x="140" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0~35일 (0: 끔)</text>
  <rect class="dg-item" x="207" y="122" width="119" height="52" rx="6"/>
  <text class="dg-t" x="266" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">저장 위치</text>
  <text class="dg-s" x="266" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">S3 (크기만큼 과금)</text>
  <rect class="dg-item" x="342" y="122" width="146" height="52" rx="6"/>
  <text class="dg-t" x="415" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">인스턴스 삭제 시</text>
  <text class="dg-s" x="415" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">자동 백업 유지 여부 선택</text>
  <rect class="dg-item" x="504" y="122" width="126" height="52" rx="6"/>
