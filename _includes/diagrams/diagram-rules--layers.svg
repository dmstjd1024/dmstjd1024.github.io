  <text class="dg-s" x="180" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">.diagram 으로 감싼다</text>
  <rect class="dg-item" x="106" y="332" width="148" height="52" rx="6"/>
  <text class="dg-t" x="180" y="363" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">항목을 합치지 않는다</text>
  <rect class="dg-item" x="103" y="398" width="153" height="52" rx="6"/>
  <text class="dg-t" x="179" y="429" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">다수인 표시는 안 단다</text>
  <path class="dg-arw" d="M180,474 V512" marker-end="url(#diagram-rules--layers-arw-n)"/>

