  <rect class="dg-mask" x="40" y="512" width="129" height="12" rx="2"/>
  <text class="dg-s" x="44" y="521" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">3층 · 결정론적 계산 — 자동</text>
  <rect class="dg-item" x="131" y="542" width="97" height="52" rx="6"/>
