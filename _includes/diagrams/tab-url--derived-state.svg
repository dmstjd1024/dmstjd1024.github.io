  <text class="dg-t" x="124" y="297" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">URL</text>
  <rect class="dg-item" x="188" y="266" width="96" height="52" rx="6"/>
  <text class="dg-t" x="236" y="297" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">화면</text>
  <rect class="dg-item" x="101" y="332" width="158" height="52" rx="6"/>
