<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="tab-url--derived-state-title tab-url--derived-state-desc">
  <title id="tab-url--derived-state-title">상태를 URL 과 useState 양쪽에 두면 어긋나고 URL 하나에서 파생시키면 어긋날 수 없다</title>
  <desc id="tab-url--derived-state-desc">상태를 URL 과 useState 양쪽에 두면 어긋나고 URL 하나에서 파생시키면 어긋날 수 없다</desc>

  <defs>
    <marker id="tab-url--derived-state-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 양방향 동기화 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="70" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">양방향 동기화</text>
  <rect class="dg-item" x="150" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="198" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">URL</text>
  <rect class="dg-item" x="262" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="310" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">useState</text>
  <rect class="dg-item" x="374" y="56" width="196" height="52" rx="6"/>
  <text class="dg-t" x="472" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">URL 은 바뀌었는데 탭은 그대로</text>
  <text class="dg-s" x="472" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">새로고침해야 맞는 탭이 뜬다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#tab-url--derived-state-arw-w)"/>

  <!-- URL 에서 파생 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="70" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">URL 에서 파생</text>
  <rect class="dg-item" x="169" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="217" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">URL</text>
  <rect class="dg-item" x="281" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="329" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">화면</text>
  <rect class="dg-item" x="393" y="200" width="158" height="52" rx="6"/>
  <text class="dg-t" x="472" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">읽는 방향이 하나뿐이다</text>
  <text class="dg-s" x="472" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">어긋날 상태 자체가 없다</text>
</svg>
