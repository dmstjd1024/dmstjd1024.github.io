<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="logout--cache-leak-title logout--cache-leak-desc">
  <title id="logout--cache-leak-title">로그아웃이 인증 상태만 지우고 쿼리 캐시를 남겨 이전 사용자 데이터가 노출되는 구조</title>
  <desc id="logout--cache-leak-desc">로그아웃이 인증 상태만 지우고 쿼리 캐시를 남겨 이전 사용자 데이터가 노출되는 구조</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="121" y="56" width="229" height="52" rx="6"/>
  <text class="dg-t" x="235" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">캐시에 있던 A 의 응답을 먼저 그린…</text>
  <text class="dg-s" x="235" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stale-while-revalidate 의 정상 동작 · 새…</text>
  <rect class="dg-item" x="366" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="482" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">깜빡임이 아니라 정보 노출이다</text>
  <text class="dg-s" x="482" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">멀티테넌트에서는 남의 데이터가 · 다른 계정에…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- logout() 이 한 일 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="87" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">logout() 이 한 일</text>
  <rect class="dg-item" x="192" y="200" width="150" height="52" rx="6"/>
  <text class="dg-t" x="267" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Zustand — 인증 상태</text>
  <text class="dg-s" x="267" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">토큰 · 사용자 정보 초기화</text>
  <rect class="dg-item" x="358" y="200" width="169" height="52" rx="6"/>
  <text class="dg-t" x="442" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">QueryClient — 서버 상태</text>
  <text class="dg-s" x="442" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">그대로 남아 있다</text>
</svg>
