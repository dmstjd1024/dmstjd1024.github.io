<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="로그아웃이 인증 상태만 지우고 쿼리 캐시를 남겨 이전 사용자 데이터가 노출되는 구조">
  <marker id="lgcl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">토큰은 지웠는데 데이터가 남았다</text>

  <rect class="dg-lane" x="24" y="48" width="672" height="96" rx="10"/>
  <text class="dg-t" x="44" y="74">logout() 이 한 일</text>

  <rect class="dg-out" x="180" y="86" width="230" height="42" rx="6"/>
  <text class="dg-k" x="200" y="106">Zustand — 인증 상태</text>
  <text class="dg-s" x="200" y="122">토큰 · 사용자 정보 초기화</text>

  <rect class="dg-warn" x="440" y="86" width="236" height="42" rx="6"/>
  <text class="dg-k" x="460" y="106">QueryClient — 서버 상태</text>
  <text class="dg-s" x="460" y="122">그대로 남아 있다</text>

  <text class="dg-t" x="24" y="176">그래서 B 로 로그인하면</text>

  <rect class="dg-warn" x="24" y="188" width="328" height="74" rx="8"/>
  <text class="dg-v" x="44" y="212">캐시에 있던 A 의 응답을 먼저 그린다</text>
  <text class="dg-s" x="44" y="234">stale-while-revalidate 의 정상 동작</text>
  <text class="dg-s" x="44" y="252">새 응답이 오기 전까지 A 의 화면</text>

  <path class="dg-arw" d="M360 224 H388" marker-end="url(#lgcl-a)"/>

  <rect class="dg-warn" x="396" y="188" width="300" height="74" rx="8"/>
  <text class="dg-k" x="416" y="212">깜빡임이 아니라 정보 노출이다</text>
  <text class="dg-s" x="416" y="238">멀티테넌트에서는 남의 데이터가</text>
  <text class="dg-s" x="416" y="256">다른 계정에 보이는 것</text>

  <text class="dg-s" x="24" y="290">인증 상태와 서버 상태를 나눠 두면, 지울 때도 양쪽을 다 지워야 한다</text>
</svg>
