<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="graphql--rest-vs-graphql-title graphql--rest-vs-graphql-desc">
  <title id="graphql--rest-vs-graphql-title">REST 는 화면 하나를 그리려고 세 번 왕복하며 안 쓰는 필드까지 받는 반면 GraphQL 은 한 번 왕복으로 필요한 필드만 받는 구조</title>
  <desc id="graphql--rest-vs-graphql-desc">REST 는 화면 하나를 그리려고 세 번 왕복하며 안 쓰는 필드까지 받는 반면 GraphQL 은 한 번 왕복으로 필요한 필드만 받는 구조</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- REST — 왕복 3번 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="83" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">REST — 왕복 3번</text>
  <rect class="dg-item" x="66" y="56" width="208" height="52" rx="6"/>
  <text class="dg-t" x="170" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GET /users/1</text>
  <text class="dg-s" x="170" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">이름 외에 주소·전화·가입일도 함께 온다</text>
  <rect class="dg-item" x="290" y="56" width="194" height="52" rx="6"/>
  <text class="dg-t" x="387" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GET /users/1/posts</text>
  <text class="dg-s" x="387" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">첫 응답을 받아야 무엇을 부를지 안다</text>
  <rect class="dg-item" x="500" y="56" width="153" height="52" rx="6"/>
  <text class="dg-t" x="576" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GET /posts/9/comments</text>
  <text class="dg-s" x="576" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">글마다 또 불러야 한다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- GraphQL — 왕복 1번 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="95" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">GraphQL — 왕복 1번</text>
  <rect class="dg-item" x="249" y="200" width="221" height="52" rx="6"/>
  <text class="dg-t" x="359" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">POST /graphql</text>
  <text class="dg-s" x="359" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">query { · user(id: "1") { · name · post…</text>
</svg>
