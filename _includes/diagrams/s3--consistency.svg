<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="s3--consistency-title s3--consistency-desc">
  <title id="s3--consistency-title">S3 객체 작업의 강한 일관성과 버킷 설정 변경의 최종 일관성</title>
  <desc id="s3--consistency-desc">S3 객체 작업의 강한 일관성과 버킷 설정 변경의 최종 일관성</desc>

  <defs>
    <marker id="s3--consistency-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 객체 작업 (강한 일관성) -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="112" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">객체 작업 (강한 일관성)</text>
  <rect class="dg-item" x="254" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="302" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">객체 변경</text>
  <rect class="dg-item" x="366" y="56" width="99" height="52" rx="6"/>
  <text class="dg-t" x="415" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">바로 읽힌다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#s3--consistency-arw-w)"/>

  <!-- 버킷 설정 변경 (최종 일관성) -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="133" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">버킷 설정 변경 (최종 일관성)</text>
  <rect class="dg-item" x="227" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="275" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">설정 변경</text>
  <rect class="dg-item" x="339" y="200" width="153" height="52" rx="6"/>
  <text class="dg-t" x="415" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">반영이 지연될 수 있다</text>
</svg>
