<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="messaging--queue-vs-pubsub-title messaging--queue-vs-pubsub-desc">
  <title id="messaging--queue-vs-pubsub-title">큐는 메시지 하나를 여러 소비자 중 한 명만 받아 일을 나눠 갖는 반면 발행-구독은 같은 메시지를 구독하는 모두가 각자 받는 구조</title>
