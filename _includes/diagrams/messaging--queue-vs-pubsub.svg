<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="큐는 메시지 하나를 여러 소비자 중 한 명만 받아 일을 나눠 갖는 반면 발행-구독은 같은 메시지를 구독하는 모두가 각자 받는 구조">
  <marker id="msgqps-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z"/>
  </marker>

  <text class="dg-h" x="24" y="30">메시지 하나를 몇 명이 받는가</text>
  <text class="dg-s" x="24" y="50">같은 브로커라도 이 둘은 목적이 다르다</text>

  <rect class="dg-lane" x="24" y="68" width="330" height="212" rx="10"/>
  <text class="dg-k" x="44" y="94">큐 — 한 명만 받는다 (일 나누기)</text>

  <rect class="dg-lead" x="44" y="108" width="290" height="38" rx="6"/>
  <text class="dg-v" x="60" y="132">주문 메시지 1건</text>

  <path class="dg-arw" d="M120 150 L100 176" marker-end="url(#msgqps-a)"/>

  <rect class="dg-row" x="44" y="180" width="130" height="38" rx="6"/>
  <text class="dg-v" x="58" y="204">소비자 A</text>

  <rect class="dg-row" x="204" y="180" width="130" height="38" rx="6"/>
  <text class="dg-s" x="218" y="204">소비자 B — 못 받음</text>

  <text class="dg-s" x="44" y="244">소비자를 늘리면 처리량이 나뉜다</text>
  <text class="dg-s" x="44" y="266">주문 처리처럼 두 번 하면 안 되는 일</text>

  <rect class="dg-lane" x="374" y="68" width="322" height="212" rx="10"/>
  <text class="dg-k" x="394" y="94">발행-구독 — 모두가 받는다 (알리기)</text>

  <rect class="dg-lead" x="394" y="108" width="282" height="38" rx="6"/>
  <text class="dg-v" x="410" y="132">주문 완료 이벤트 1건</text>

  <path class="dg-arw" d="M470 150 L450 176" marker-end="url(#msgqps-a)"/>
  <path class="dg-arw" d="M600 150 L620 176" marker-end="url(#msgqps-a)"/>

  <rect class="dg-row" x="394" y="180" width="130" height="38" rx="6"/>
  <text class="dg-v" x="408" y="204">메일 구독자</text>

  <rect class="dg-row" x="546" y="180" width="130" height="38" rx="6"/>
  <text class="dg-v" x="560" y="204">통계 구독자</text>

  <text class="dg-s" x="394" y="244">구독자를 늘려도 서로 영향이 없다</text>
  <text class="dg-s" x="394" y="266">새 기능을 붙일 때 발행하는 쪽을 안 고친다</text>

  <rect class="dg-lane" x="24" y="296" width="672" height="66" rx="8"/>
  <text class="dg-v" x="44" y="320">카프카는 컨슈머 그룹으로 이 둘을 한 구조에서 만든다</text>
  <text class="dg-s" x="44" y="342">같은 그룹 안에서는 나눠 갖고(큐), 다른 그룹끼리는 각자 다 받는다(발행-구독)</text>
</svg>
