<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="live-study6--dynamic-dispatch-title live-study6--dynamic-dispatch-desc">
  <title id="live-study6--dynamic-dispatch-title">같은 코드가 실제로 담긴 객체에 따라 다른 메서드를 실행하는 동적 디스패치</title>
  <desc id="live-study6--dynamic-dispatch-desc">같은 코드가 실제로 담긴 객체에 따라 다른 메서드를 실행하는 동적 디스패치</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="264" y="56" width="191" height="52" rx="6"/>
  <text class="dg-t" x="359" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Player p = ... ;   p.play();</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- p 에 NBAPlayer 가 담겼다면 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="125" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">p 에 NBAPlayer 가 담겼다면</text>
  <rect class="dg-item" x="220" y="200" width="121" height="52" rx="6"/>
  <text class="dg-t" x="280" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">new NBAPlayer()</text>
  <rect class="dg-item" x="357" y="200" width="142" height="52" rx="6"/>
  <text class="dg-t" x="428" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">NBAPlayer 의 play()</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- SoccerPlayer 가 담겼다면 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="116" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SoccerPlayer 가 담겼다면</text>
  <rect class="dg-item" x="204" y="344" width="137" height="52" rx="6"/>
  <text class="dg-t" x="272" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">new SoccerPlayer()</text>
  <rect class="dg-item" x="357" y="344" width="158" height="52" rx="6"/>
  <text class="dg-t" x="436" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SoccerPlayer 의 play()</text>
</svg>
