<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-label="pull 은 파일 내용만 옮기고 심링크·플래그·등록 주기 같은 시스템 상태는 옮기지 않는다">
  <marker id="dfsv-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">git pull 이 옮기는 것과 옮기지 않는 것</text>

  <rect class="dg-row" x="24" y="52" width="150" height="92" rx="8"/>
  <text class="dg-t" x="44" y="78">원격 레포</text>
  <text class="dg-s" x="44" y="100">커밋된</text>
  <text class="dg-s" x="44" y="118">설정 파일들</text>

  <path class="dg-arw" d="M182 98 H222" marker-end="url(#dfsv-a)"/>
  <text class="dg-s" x="186" y="90">pull</text>

  <rect class="dg-out" x="230" y="52" width="212" height="92" rx="8"/>
  <text class="dg-t" x="250" y="78">파일 내용</text>
  <text class="dg-b" x="250" y="100">전파된다</text>
  <text class="dg-s" x="250" y="122">CLAUDE.md · .zshrc · config</text>

  <rect class="dg-warn" x="466" y="52" width="230" height="92" rx="8"/>
  <text class="dg-t" x="486" y="78">시스템 상태</text>
  <text class="dg-v" x="486" y="100">전파되지 않는다</text>
  <text class="dg-s" x="486" y="122">심링크 · skip-worktree · plist</text>

  <rect class="dg-lane" x="24" y="164" width="672" height="66" rx="8"/>
  <text class="dg-t" x="44" y="190">파일이 아닌 것은 파일 동기화로 따라오지 않는다</text>
  <text class="dg-s" x="44" y="214">심링크는 링크이지 내용이 아니고, 인덱스 플래그는 커밋되지 않으며, 등록 주기는 launchd 가 들고 있다</text>

  <rect class="dg-out" x="24" y="246" width="672" height="48" rx="8"/>
  <text class="dg-k" x="44" y="270">그래서 pull 성공 시 install.sh 를 자동 실행해 상태까지 맞춘다</text>
  <text class="dg-s" x="44" y="288">"최신 파일을 받았다" 와 "설정이 적용됐다" 는 다른 사건이다</text>
</svg>
