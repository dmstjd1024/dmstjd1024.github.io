<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="확인 시점과 사용 시점 사이의 틈에 다른 스레드가 끼어드는 TOCTOU 구조">
  <marker id="tcrw-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">확인과 실행 사이에 틈이 있다</text>
  <text class="dg-s" x="24" y="50">시간 →</text>

  <rect class="dg-lane" x="24" y="64" width="672" height="76" rx="8"/>
  <text class="dg-t" x="44" y="90">스레드 A</text>
  <rect class="dg-row" x="140" y="76" width="180" height="34" rx="6"/>
  <text class="dg-v" x="156" y="98">stat — 없네</text>
  <rect class="dg-warn" x="440" y="76" width="180" height="34" rx="6"/>
  <text class="dg-k" x="456" y="98">mkdir — 실패</text>
  <text class="dg-s" x="140" y="130">"없으니 만들자" 고 판단한 시점</text>

  <rect class="dg-lane" x="24" y="152" width="672" height="76" rx="8"/>
  <text class="dg-t" x="44" y="178">스레드 B</text>
  <rect class="dg-row" x="290" y="164" width="180" height="34" rx="6"/>
  <text class="dg-v" x="306" y="186">mkdir — 성공</text>
  <text class="dg-s" x="290" y="218">그 사이에 먼저 만들어 버렸다</text>

  <path class="dg-arw" d="M330 93 H432" marker-end="url(#tcrw-a)"/>
  <text class="dg-k" x="336" y="84">이 구간이 위험하다</text>

  <rect class="dg-out" x="24" y="244" width="672" height="48" rx="8"/>
  <text class="dg-k" x="44" y="268">mkdir -p 는 "없으면 만들고 있으면 성공" 을 커널이 한 번에 처리한다</text>
  <text class="dg-s" x="44" y="286">틈이 아예 없으므로 몇 개가 동시에 들어와도 race 가 생기지 않는다</text>
</svg>
