<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="toctou--race-window-title toctou--race-window-desc">
  <title id="toctou--race-window-title">확인 시점과 사용 시점 사이의 틈에 다른 스레드가 끼어드는 TOCTOU 구조</title>
  <desc id="toctou--race-window-desc">확인 시점과 사용 시점 사이의 틈에 다른 스레드가 끼어드는 TOCTOU 구조</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">mkdir -p 는 디렉토리 생성과 이미…</text>
  <text class="dg-s" x="360" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">경로 전체가 원자적인 것은 아니다. 직접 만든 s…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 스레드 A -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="49" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">스레드 A</text>
  <rect class="dg-item" x="245" y="200" width="104" height="52" rx="6"/>
  <text class="dg-t" x="297" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">stat — 없네</text>
  <rect class="dg-item" x="365" y="200" width="110" height="52" rx="6"/>
  <text class="dg-t" x="420" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">mkdir — 실패</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- 스레드 B -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="49" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">스레드 B</text>
  <rect class="dg-item" x="305" y="344" width="110" height="52" rx="6"/>
  <text class="dg-t" x="360" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">mkdir — 성공</text>
</svg>
