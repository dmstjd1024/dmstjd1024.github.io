    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">예외 계층 구조</text>

  <rect class="dg-row" x="284" y="48" width="152" height="36" rx="6"/>
  <text class="dg-k" x="304" y="72">Object</text>

  <path class="dg-arw" d="M360 92 V108" marker-end="url(#ls9h-a)"/>

