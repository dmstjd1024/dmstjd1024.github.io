<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="docker6--mount-shadow-title docker6--mount-shadow-desc">
  <title id="docker6--mount-shadow-title">디렉터리를 마운트하면 원래 있던 내용이 가려지지만 파일 하나만 마운트하면 나머지는 그대로 남는다</title>
  <desc id="docker6--mount-shadow-desc">디렉터리를 마운트하면 원래 있던 내용이 가려지지만 파일 하나만 마운트하면 나머지는 그대로 남는다</desc>

