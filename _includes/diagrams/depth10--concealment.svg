<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="깊이 제한이 순환 참조를 막는 게 아니라 조용히 잘라내 문제를 감추는 구조">
  <marker id="dp10-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">방어처럼 보이지만 은폐였다</text>

  <rect class="dg-code" x="24" y="48" width="392" height="36" rx="6"/>
  <text class="dg-key" x="44" y="72">while (currentId != null &amp;&amp; depth &lt; 10)</text>
  <text class="dg-s" x="436" y="72">의도 — 순환 참조 시 무한루프 방지</text>

  <rect class="dg-lane" x="24" y="104" width="328" height="140" rx="10"/>
  <text class="dg-t" x="44" y="130">조직이 정상일 때</text>
  <rect class="dg-out" x="44" y="144" width="288" height="30" rx="6"/>
  <text class="dg-k" x="60" y="164">조상 5개 수집 후 종료</text>
  <text class="dg-s" x="44" y="196">문제 없다</text>

  <rect class="dg-lane" x="368" y="104" width="328" height="140" rx="10"/>
  <text class="dg-t" x="388" y="130">깊이가 10을 넘거나 순환일 때</text>
  <rect class="dg-warn" x="388" y="144" width="288" height="30" rx="6"/>
  <text class="dg-k" x="404" y="164">10개까지 모으고 조용히 멈춤</text>
  <text class="dg-v" x="388" y="196">에러도 로그도 없다</text>
  <text class="dg-s" x="388" y="218">불완전한 결과가 정상처럼 반환된다</text>

  <path class="dg-arw" d="M360 160 H380" marker-end="url(#dp10-a)"/>

  <text class="dg-v" x="24" y="272">순환이 있어도 알 수 없고, 조직이 깊어져도 알 수 없다</text>
  <text class="dg-s" x="24" y="292">막아야 할 상황을 감지하는 대신, 그 상황에서도 아무 말 없이 지나가게 만들었다</text>
</svg>
