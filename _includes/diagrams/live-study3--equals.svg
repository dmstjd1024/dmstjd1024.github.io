<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="live-study3--equals-title live-study3--equals-desc">
  <title id="live-study3--equals-title">문자열 비교에서 == 는 주소를 보고 equals 는 내용을 본다는 차이</title>
  <desc id="live-study3--equals-desc">문자열 비교에서 == 는 주소를 보고 equals 는 내용을 본다는 차이</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-item" x="67" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="115" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">a</text>
  <text class="dg-s" x="115" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0x1A2B</text>
  <rect class="dg-item" x="179" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="227" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">"hello"</text>
  <rect class="dg-item" x="291" y="56" width="137" height="52" rx="6"/>
  <text class="dg-t" x="359" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">a == b</text>
  <text class="dg-s" x="359" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">false — 주소가 다르다</text>
  <rect class="dg-item" x="444" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="492" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">b</text>
  <text class="dg-s" x="492" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0x9F3C</text>
  <rect class="dg-item" x="556" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="604" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">"hello"</text>
  <rect class="dg-item" x="298" y="122" width="124" height="52" rx="6"/>
  <text class="dg-t" x="360" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">a.equals(b)</text>
  <text class="dg-s" x="360" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">true — 내용이 같다</text>
</svg>
