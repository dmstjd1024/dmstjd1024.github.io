<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="응답 후처리의 부가 기능이 실패하면 응답 전체가 실패하는 구조와 가드 추가">
  <marker id="ssrg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">부가 기능이 주 기능을 죽이지 않게</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="164" rx="10"/>
  <text class="dg-t" x="44" y="74">가드 없음</text>

  <rect class="dg-row" x="44" y="88" width="288" height="28" rx="6"/>
  <text class="dg-v" x="60" y="107">API 처리 성공</text>
  <path class="dg-arw" d="M188 120 V132" marker-end="url(#ssrg-a)"/>
  <rect class="dg-warn" x="44" y="138" width="288" height="28" rx="6"/>
  <text class="dg-k" x="60" y="157">Redis 다운 — 세션 갱신 예외</text>
  <path class="dg-arw" d="M188 170 V182" marker-end="url(#ssrg-a)"/>
  <rect class="dg-warn" x="44" y="180" width="288" height="24" rx="6"/>
  <text class="dg-k" x="60" y="198">모든 API 응답이 실패</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="164" rx="10"/>
  <text class="dg-t" x="388" y="74">가드 추가</text>

  <rect class="dg-row" x="388" y="88" width="288" height="28" rx="6"/>
  <text class="dg-v" x="404" y="107">API 처리 성공</text>
  <path class="dg-arw" d="M532 120 V132" marker-end="url(#ssrg-a)"/>
  <rect class="dg-row" x="388" y="138" width="288" height="28" rx="6"/>
  <text class="dg-v" x="404" y="157">세션 갱신 실패 — 잡아서 넘긴다</text>
  <path class="dg-arw" d="M532 170 V182" marker-end="url(#ssrg-a)"/>
  <rect class="dg-out" x="388" y="180" width="288" height="24" rx="6"/>
  <text class="dg-k" x="404" y="198">응답은 정상적으로 나간다</text>

  <text class="dg-v" x="24" y="248">응답 후처리에 무언가를 얹을 때는 그 실패가 응답 전체를 막는지 먼저 본다</text>
  <text class="dg-s" x="24" y="272">세션 갱신은 있으면 좋은 것이지, 없다고 요청을 실패시킬 일은 아니다</text>
</svg>
