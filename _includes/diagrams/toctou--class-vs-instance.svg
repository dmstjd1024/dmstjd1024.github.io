<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="toctou--class-vs-instance-title toctou--class-vs-instance-desc">
  <title id="toctou--class-vs-instance-title">직접 예외 처리를 겹치는 것과 도구에 디렉토리 생성을 맡기는 것의 차이</title>
  <desc id="toctou--class-vs-instance-desc">직접 예외 처리를 겹치는 것과 도구에 디렉토리 생성을 맡기는 것의 차이</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 예외를 한 겹 더 두른다 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="108" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">예외를 한 겹 더 두른다</text>
  <rect class="dg-item" x="174" y="56" width="99" height="52" rx="6"/>
  <text class="dg-t" x="223" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">try — stat</text>
  <rect class="dg-item" x="289" y="56" width="115" height="52" rx="6"/>
  <text class="dg-t" x="346" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">catch — mkdir</text>
  <rect class="dg-item" x="420" y="56" width="126" height="52" rx="6"/>
  <text class="dg-t" x="483" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">catch — 또 stat</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 디렉토리 생성을 위임한다 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="116" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">디렉토리 생성을 위임한다</text>
  <rect class="dg-item" x="265" y="200" width="190" height="52" rx="6"/>
  <text class="dg-t" x="360" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">mkdir -p</text>
  <text class="dg-s" x="360" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">이미 존재하는 디렉토리는 성공 처리</text>
</svg>
