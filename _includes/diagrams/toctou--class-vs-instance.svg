<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="직접 예외 처리를 겹치는 것과 도구에 디렉토리 생성을 맡기는 것의 차이">
  <marker id="tccvi-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">직접 만든 루프를 검증된 도구로 대체한다</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="44" y="74">예외를 한 겹 더 두른다</text>

  <rect class="dg-row" x="44" y="88" width="288" height="28" rx="6"/>
  <text class="dg-v" x="60" y="107">try — stat</text>
  <rect class="dg-row" x="44" y="122" width="288" height="28" rx="6"/>
  <text class="dg-v" x="60" y="141">catch — mkdir</text>
  <rect class="dg-warn" x="44" y="156" width="288" height="28" rx="6"/>
  <text class="dg-k" x="60" y="175">catch — 또 stat</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="388" y="74">디렉토리 생성을 위임한다</text>

  <rect class="dg-out" x="388" y="88" width="288" height="62" rx="6"/>
  <text class="dg-k" x="404" y="112">mkdir -p</text>
  <text class="dg-s" x="404" y="136">이미 존재하는 디렉토리는 성공 처리</text>

  <text class="dg-b" x="388" y="175">35줄 → 20줄, 지운 15줄이 핵심</text>

  <text class="dg-v" x="24" y="228">애플리케이션의 stat / mkdir 경쟁 처리를 도구에 맡긴다</text>
  <text class="dg-s" x="24" y="252">mkdir -p 도 경로 삭제·교체를 포함한 모든 경쟁을 막지는 않는다</text>
</svg>
