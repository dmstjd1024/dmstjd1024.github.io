<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="조회 경로에 쓰기가 섞여 들어가는 것을 애노테이션 대신 테스트로 잡는 방식">
  <marker id="rogr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">고치는 것과 다시 안 생기게 하는 것</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="146" rx="10"/>
  <text class="dg-t" x="44" y="74">readOnly = true 를 붙였더니</text>

  <rect class="dg-row" x="44" y="88" width="288" height="28" rx="6"/>
  <text class="dg-v" x="60" y="107">조회 메서드에 애노테이션 부착</text>
  <path class="dg-arw" d="M188 120 V132" marker-end="url(#rogr-a)"/>
  <rect class="dg-warn" x="44" y="138" width="288" height="46" rx="6"/>
  <text class="dg-k" x="60" y="160">내부에서 부르는 쓰기 메서드와 충돌</text>
  <text class="dg-s" x="60" y="178">붙였다 떼는 결과가 됐다</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="146" rx="10"/>
  <text class="dg-t" x="388" y="74">테스트로 잡기</text>

  <rect class="dg-row" x="388" y="88" width="288" height="28" rx="6"/>
  <text class="dg-v" x="404" y="107">조회 경로를 돌려보고</text>
  <path class="dg-arw" d="M532 120 V132" marker-end="url(#rogr-a)"/>
  <rect class="dg-out" x="388" y="138" width="288" height="46" rx="6"/>
  <text class="dg-k" x="404" y="160">쓰기가 일어나면 실패시킨다</text>
  <text class="dg-s" x="404" y="178">런타임 동작을 막지 않고 감시만 한다</text>

  <text class="dg-v" x="24" y="238">애노테이션은 실행을 막지만, 막힌 곳이 정작 고쳐야 할 곳이 아닐 수 있다</text>
  <text class="dg-s" x="24" y="264">가드레일은 동작을 바꾸지 않고 "다시 생기면 알려주는" 역할만 한다</text>
</svg>
