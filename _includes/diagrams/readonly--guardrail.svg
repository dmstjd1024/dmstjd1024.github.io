<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="readonly--guardrail-title readonly--guardrail-desc">
  <title id="readonly--guardrail-title">조회 경로에 쓰기가 섞여 들어가는 것을 애노테이션 대신 테스트로 잡는 방식</title>
  <desc id="readonly--guardrail-desc">조회 경로에 쓰기가 섞여 들어가는 것을 애노테이션 대신 테스트로 잡는 방식</desc>

  <defs>
    <marker id="readonly--guardrail-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- readOnly = true 를 붙였더니 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="129" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">readOnly = true 를 붙였더니</text>
  <rect class="dg-item" x="142" y="56" width="196" height="52" rx="6"/>
  <text class="dg-t" x="240" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">조회 메서드에 애노테이션 부착</text>
  <rect class="dg-item" x="354" y="56" width="223" height="52" rx="6"/>
  <text class="dg-t" x="465" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">내부에서 부르는 쓰기 메서드와 충돌</text>
  <text class="dg-s" x="465" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">붙였다 떼는 결과가 됐다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#readonly--guardrail-arw-w)"/>

  <!-- 테스트로 잡기 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="70" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">테스트로 잡기</text>
  <rect class="dg-item" x="188" y="200" width="148" height="52" rx="6"/>
  <text class="dg-t" x="262" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">조회 경로를 돌려보고</text>
  <rect class="dg-item" x="352" y="200" width="180" height="52" rx="6"/>
  <text class="dg-t" x="442" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">쓰기가 일어나면 실패시킨다</text>
  <text class="dg-s" x="442" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">테스트에서 실행 SQL 을 검사한다</text>
</svg>
