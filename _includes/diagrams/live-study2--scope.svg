  <text class="dg-s" x="360" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">필드</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#live-study2--scope-arw-w)"/>

