<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="같은 이름 name 이 클래스 스코프와 메서드 스코프에 따로 있어 this 가 필요한 이유">
  <marker id="ls2scope-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">this 가 필요한 이유</text>

  <rect class="dg-lane" x="24" y="48" width="672" height="152" rx="10"/>
  <text class="dg-t" x="44" y="76">클래스 스코프</text>
  <rect class="dg-lead" x="44" y="88" width="200" height="34" rx="6"/>
  <text class="dg-k" x="60" y="110">name</text>
  <text class="dg-s" x="130" y="110">필드</text>

  <rect class="dg-lane" x="260" y="88" width="416" height="96" rx="8"/>
  <text class="dg-t" x="280" y="112">메서드 스코프 (생성자)</text>
  <rect class="dg-row" x="280" y="124" width="200" height="34" rx="6"/>
  <text class="dg-k" x="296" y="146">name</text>
  <text class="dg-s" x="366" y="146">매개변수</text>
  <text class="dg-s" x="280" y="176">여기서 name 이라고 쓰면 가까운 쪽 — 매개변수를 가리킨다</text>

  <rect class="dg-warn" x="24" y="216" width="328" height="72" rx="8"/>
  <text class="dg-cm" x="44" y="240">name = name;</text>
  <text class="dg-s" x="44" y="262">매개변수에 매개변수를 넣는 꼴</text>
  <text class="dg-s" x="44" y="280">필드는 그대로 비어 있다</text>

  <rect class="dg-out" x="368" y="216" width="328" height="72" rx="8"/>
  <text class="dg-k" x="388" y="240">this.name = name;</text>
  <text class="dg-s" x="388" y="262">this 는 자기 자신 객체를 가리킨다</text>
  <text class="dg-s" x="388" y="280">그래서 필드 쪽을 콕 집어 넣을 수 있다</text>

  <path class="dg-arw" d="M244 105 H262" marker-end="url(#ls2scope-a)"/>

  <text class="dg-s" x="24" y="318">이름이 겹치면 안쪽(가까운) 스코프가 이긴다 — this 로 바깥을 명시해야 한다</text>
</svg>
