<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="live-study2--scope-title live-study2--scope-desc">
  <title id="live-study2--scope-title">같은 이름 name 이 클래스 스코프와 메서드 스코프에 따로 있어 this 가 필요한 이유</title>
  <desc id="live-study2--scope-desc">같은 이름 name 이 클래스 스코프와 메서드 스코프에 따로 있어 this 가 필요한 이유</desc>

  <defs>
    <marker id="live-study2--scope-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="120" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">name = name;</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">매개변수에 매개변수를 넣는 꼴 · 필드는 그대로…</text>
  <rect class="dg-item" x="368" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="484" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">this.name = name;</text>
  <text class="dg-s" x="484" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">this 는 자기 자신 객체를 가리킨다 · 그래서…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#live-study2--scope-arw-w)"/>

  <!-- 클래스 스코프 -->
