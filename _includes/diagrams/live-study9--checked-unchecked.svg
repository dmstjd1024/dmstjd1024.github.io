<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="live-study9--checked-unchecked-title live-study9--checked-unchecked-desc">
  <title id="live-study9--checked-unchecked-title">Checked 예외는 컴파일러가 처리를 강제하고 Unchecked 는 강제하지 않는다</title>
  <desc id="live-study9--checked-unchecked-desc">Checked 예외는 컴파일러가 처리를 강제하고 Unchecked 는 강제하지 않는다</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- Checked -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="45" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">Checked</text>
  <rect class="dg-item" x="166" y="56" width="180" height="52" rx="6"/>
  <text class="dg-t" x="256" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">IOException · SQLException</text>
  <rect class="dg-item" x="362" y="56" width="191" height="52" rx="6"/>
  <text class="dg-t" x="457" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">try-catch 하거나 throws 해야</text>
  <text class="dg-s" x="457" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">안 하면 컴파일이 안 된다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- Unchecked -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">Unchecked</text>
  <rect class="dg-item" x="180" y="200" width="164" height="52" rx="6"/>
  <text class="dg-t" x="262" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">NullPointerException 등</text>
  <rect class="dg-item" x="360" y="200" width="180" height="52" rx="6"/>
  <text class="dg-t" x="450" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">처리하지 않아도 컴파일된다</text>
  <text class="dg-s" x="450" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">막을지 말지는 개발자 선택</text>
</svg>
