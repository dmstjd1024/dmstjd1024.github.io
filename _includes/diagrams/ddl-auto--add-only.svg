<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="ddl-auto update 는 추가만 하고 기존 것을 바꾸거나 지우지 않는다">
  <marker id="ddlao-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">update 는 더하기만 한다</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="140" rx="10"/>
  <text class="dg-t" x="44" y="74">ddl-auto: update 가 하는 일</text>

  <rect class="dg-out" x="44" y="88" width="288" height="30" rx="6"/>
  <text class="dg-k" x="60" y="108">없던 테이블을 만든다</text>
  <rect class="dg-out" x="44" y="124" width="288" height="30" rx="6"/>
  <text class="dg-k" x="60" y="144">없던 컬럼을 붙인다</text>
  <text class="dg-s" x="44" y="176">엔티티에 새로 생긴 것만 따라온다</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="140" rx="10"/>
  <text class="dg-t" x="388" y="74">하지 않는 일</text>

  <rect class="dg-warn" x="388" y="88" width="288" height="30" rx="6"/>
  <text class="dg-k" x="404" y="108">이미 있는 것을 바꾸기</text>
  <rect class="dg-warn" x="388" y="124" width="288" height="30" rx="6"/>
  <text class="dg-k" x="404" y="144">있는 것을 지우기</text>
  <text class="dg-s" x="388" y="176">타입 변경 · DROP · 인덱스 교체 · 백필</text>

  <rect class="dg-lane" x="24" y="204" width="672" height="60" rx="8"/>
  <text class="dg-v" x="44" y="228">그래서 34개 manual SQL 을 전수 검토했는데 update 로 대체되는 건 하나도 없었다</text>
  <text class="dg-s" x="44" y="250">stg 는 validate 라 만들어주지도 않아, 담당자가 손으로 한 번씩 적용하고 있었다</text>
</svg>
