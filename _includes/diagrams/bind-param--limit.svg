<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="같은 65535 한도 아래에서도 행당 컬럼 수에 따라 넣을 수 있는 행 수가 달라진다">
  <marker id="bpl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">왜 "배치 1000" 같은 고정값이 안 되나</text>

  <rect class="dg-code" x="24" y="48" width="392" height="36" rx="6"/>
  <text class="dg-key" x="44" y="72">파라미터 총수 = 행 수 × 행당 파라미터 수</text>

  <path class="dg-arw" d="M424 66 H468" marker-end="url(#bpl-a)"/>

  <rect class="dg-warn" x="476" y="48" width="220" height="36" rx="6"/>
  <text class="dg-k" x="496" y="72">65,535 를 넘으면 터진다</text>

  <text class="dg-s" x="24" y="112">한도는 고정인데 행당 파라미터가 다르므로, 같은 행 수라도 결과가 갈린다</text>

  <rect class="dg-lane" x="24" y="128" width="328" height="120" rx="10"/>
  <text class="dg-t" x="44" y="154">컬럼이 적은 쿼리</text>
  <text class="dg-s" x="44" y="174">행당 파라미터 2개</text>
  <rect class="dg-out" x="44" y="186" width="288" height="34" rx="6"/>
  <text class="dg-k" x="60" y="208">20,000 행까지 한 번에</text>
  <text class="dg-s" x="44" y="238">1000 으로 끊으면 20배 손해</text>

  <rect class="dg-lane" x="368" y="128" width="328" height="120" rx="10"/>
  <text class="dg-t" x="388" y="154">컬럼이 많은 쿼리</text>
  <text class="dg-s" x="388" y="174">행당 파라미터 70개라면</text>
  <rect class="dg-warn" x="388" y="186" width="288" height="34" rx="6"/>
  <text class="dg-k" x="404" y="208">1,000 행도 이미 초과</text>
  <text class="dg-s" x="388" y="238">같은 설정인데 여기선 터진다</text>

  <text class="dg-v" x="24" y="276">그래서 쿼리마다 행당 파라미터를 세고 청크 크기를 역산했다</text>
  <text class="dg-s" x="24" y="294">딱 맞추지 않고 여유를 둔 건 나중에 컬럼이 하나 늘어도 안 터지게 하려는 것</text>
</svg>
