<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="mojibake--patch-growth-title mojibake--patch-growth-desc">
  <title id="mojibake--patch-growth-title">원인은 저장 시점에서 이미 고쳤는데, 조회 시점에 복구 단계를 네 번 덧댄 뒤 전부 삭제한 과정</title>
  <desc id="mojibake--patch-growth-desc">원인은 저장 시점에서 이미 고쳤는데, 조회 시점에 복구 단계를 네 번 덧댄 뒤 전부 삭제한 과정</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-item" x="138" y="56" width="155" height="52" rx="6"/>
  <text class="dg-t" x="215" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">저장 시점</text>
  <text class="dg-s" x="215" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">charset 명시 — 한 번에 끝</text>
  <rect class="dg-item" x="309" y="56" width="132" height="52" rx="6"/>
  <text class="dg-t" x="375" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">DB</text>
  <text class="dg-s" x="375" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">이미 깨진 과거 데이터</text>
  <rect class="dg-item" x="457" y="56" width="124" height="52" rx="6"/>
  <text class="dg-t" x="519" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">조회 시점</text>
  <text class="dg-s" x="519" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">여기를 네 번 고쳤다</text>
  <rect class="dg-item" x="121" y="122" width="232" height="52" rx="6"/>
