  <text class="dg-s" x="237" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">① latin1 재해석 후 한글이 늘면 성공으로 침…</text>
  <rect class="dg-item" x="369" y="122" width="229" height="52" rx="6"/>
  <text class="dg-t" x="483" y="153" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">87줄을 2줄로 되돌렸다 — 살아남은…</text>
