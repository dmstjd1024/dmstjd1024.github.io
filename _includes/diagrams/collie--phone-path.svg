<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="collie--phone-path-title collie--phone-path-desc">
  <title id="collie--phone-path-title">폰에서 누른 키가 판에 닿기까지의 경로: 폰의 PWA 가 Tailscale 프론트도어를 거쳐 로컬 브리지에 닿고, 브리지가 Herdr 소켓으로 판에 키를 넣는다. 브리지 앞에 기기 페어링 관문이 있고, 들어온 쓰기는 모두 audit.log 에 남는다</title>
  <desc id="collie--phone-path-desc">폰에서 누른 키가 판에 닿기까지의 경로: 폰의 PWA 가 Tailscale 프론트도어를 거쳐 로컬 브리지에 닿고, 브리지가 Herdr 소켓으로 판에 키를 넣는다. 브리지 앞에 기기 페어링 관문이 있고, 들어온 쓰기는 모두 audit.log 에 남는다</desc>

  <defs>
    <marker id="collie--phone-path-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 집 밖 — 내가 든 것 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="95" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">집 밖 — 내가 든 것</text>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">폰의 PWA</text>
  <text class="dg-s" x="360" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">판 목록 · 출력 · 입력창 — 앱스토어를 거치지…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#collie--phone-path-arw-w)"/>

  <!-- 회사 맥 안 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="58" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">회사 맥 안</text>
  <rect class="dg-item" x="123" y="200" width="225" height="52" rx="6"/>
  <text class="dg-t" x="235" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">tailscale serve — 프론트도어</text>
  <text class="dg-s" x="235" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">443 → 127.0.0.1:8787 · funnel 이 아니라…</text>
  <rect class="dg-item" x="364" y="200" width="232" height="52" rx="6"/>
  <text class="dg-t" x="480" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">collie 브리지 — 페어링 관문</text>
  <text class="dg-s" x="480" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">토큰 없는 기기는 읽기만 · 들어온 쓰기는 audi…</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#collie--phone-path-arw-w)"/>

  <!-- Herdr 가 들고 있는 것 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="104" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">Herdr 가 들고 있는 것</text>
  <rect class="dg-item" x="244" y="344" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="366" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">판 안에서 돌고 있던 에이전트</text>
  <text class="dg-s" x="360" y="383" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">새로 띄우는 것이 아니라, 아까 그 대화에 그대…</text>
</svg>
