<svg viewBox="0 0 720 498" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="폰에서 누른 키가 판에 닿기까지의 경로: 폰의 PWA 가 Tailscale 프론트도어를 거쳐 로컬 브리지에 닿고, 브리지가 Herdr 소켓으로 판에 키를 넣는다. 브리지 앞에 기기 페어링 관문이 있고, 들어온 쓰기는 모두 audit.log 에 남는다">
  <defs>
    <marker id="cp-ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="dg-zone" x="14" y="30" width="692" height="96" rx="10"/>
  <rect class="dg-mask" x="35" y="24" width="123" height="15" rx="2"/>
  <text class="dg-s" x="40" y="35">집 밖 — 내가 든 것</text>

  <rect class="dg-item" x="38" y="56" width="644" height="54" rx="8"/>
  <text class="dg-t" x="360" y="80" text-anchor="middle">폰의 PWA</text>
  <text class="dg-s" x="360" y="99" text-anchor="middle">판 목록 · 출력 · 입력창 — 앱스토어를 거치지 않는다</text>

  <line class="dg-arw" x1="360" y1="126" x2="360" y2="156" marker-end="url(#cp-ah)"/>
  <rect class="dg-mask" x="372" y="132" width="169" height="15" rx="2"/>
  <text class="dg-s" x="377" y="143">HTTPS · tailnet 안에서만</text>

  <rect class="dg-zone" x="14" y="162" width="692" height="216" rx="10"/>
  <rect class="dg-mask" x="35" y="156" width="107" height="15" rx="2"/>
  <text class="dg-s" x="40" y="167">회사 맥 안</text>

  <rect class="dg-item" x="38" y="188" width="644" height="54" rx="8"/>
  <text class="dg-t" x="360" y="212" text-anchor="middle">tailscale serve — 프론트도어</text>
  <text class="dg-s" x="360" y="231" text-anchor="middle">443 → 127.0.0.1:8787 · funnel 이 아니라 serve 다</text>

  <line class="dg-arw" x1="360" y1="242" x2="360" y2="266" marker-end="url(#cp-ah)"/>

  <rect class="dg-hl" x="38" y="272" width="644" height="60" rx="8"/>
  <text class="dg-t" x="360" y="296" text-anchor="middle">collie 브리지 — 페어링 관문</text>
  <text class="dg-n" x="360" y="316" text-anchor="middle">토큰 없는 기기는 읽기만 · 들어온 쓰기는 audit.log 에 남는다</text>

  <line class="dg-arw" x1="360" y1="332" x2="360" y2="368" marker-end="url(#cp-ah)"/>
  <rect class="dg-mask" x="372" y="342" width="139" height="15" rx="2"/>
  <text class="dg-s" x="377" y="353">유닉스 소켓 · 로컬</text>

  <rect class="dg-zone" x="14" y="396" width="692" height="88" rx="10"/>
  <rect class="dg-mask" x="35" y="390" width="163" height="15" rx="2"/>
  <text class="dg-s" x="40" y="401">Herdr 가 들고 있는 것</text>

  <rect class="dg-item" x="38" y="420" width="644" height="50" rx="8"/>
  <text class="dg-t" x="360" y="442" text-anchor="middle">판 안에서 돌고 있던 에이전트</text>
  <text class="dg-s" x="360" y="461" text-anchor="middle">새로 띄우는 것이 아니라, 아까 그 대화에 그대로 이어 붙는다</text>
</svg>
