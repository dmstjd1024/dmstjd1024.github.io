  <text class="dg-t" x="179" y="297" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">걸음 수가 계속 쌓인다</text>
  <path class="dg-arw" d="M180,342 V380" marker-end="url(#ralph--three-shapes-arw-n)"/>

