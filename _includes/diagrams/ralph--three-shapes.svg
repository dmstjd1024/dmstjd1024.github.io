<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="원형은 셸이 무한히 반복하고, 공식 플러그인은 세션 안에서 Stop 훅으로 반복해 세션 수명에 묶이며, 셸 드라이버는 매 사이클 프로세스를 새로 띄워 걸음 수를 끊는 세 가지 형태">
  <marker id="r3s-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z"/>
  </marker>

  <text class="dg-h" x="24" y="30">반복이 어디서 일어나는가</text>
  <text class="dg-s" x="24" y="50">같은 이름으로 불리지만 반복하는 주체가 다르고, 그래서 수명이 다르다</text>

  <!-- 원형 -->
  <rect class="dg-lane" x="24" y="72" width="216" height="150" rx="10"/>
  <text class="dg-k" x="40" y="94">원형 — bash</text>

  <rect class="dg-row" x="40" y="108" width="184" height="32" rx="6"/>
  <text class="dg-v" x="54" y="129">while : 무한 반복</text>

  <path class="dg-arw" d="M132 144 V166" marker-end="url(#r3s-a)"/>

  <rect class="dg-row" x="40" y="170" width="184" height="32" rx="6"/>
  <text class="dg-s" x="54" y="191">멈춤 조건 없음</text>

  <!-- 공식 플러그인 -->
  <rect class="dg-lane" x="252" y="72" width="216" height="150" rx="10"/>
  <text class="dg-k" x="268" y="94">공식 플러그인</text>

  <rect class="dg-row" x="268" y="108" width="184" height="62" rx="6"/>
  <text class="dg-v" x="282" y="129">세션 하나</text>
  <text class="dg-s" x="282" y="148">Stop 훅이 종료를 막고</text>
  <text class="dg-s" x="282" y="163">같은 프롬프트를 재투입</text>

  <path class="dg-arw" d="M360 174 V196" marker-end="url(#r3s-a)"/>

  <rect class="dg-row" x="268" y="200" width="184" height="30" rx="6"/>
  <text class="dg-s" x="282" y="220">걸음 수가 계속 쌓인다</text>

  <!-- 셸 드라이버 -->
  <rect class="dg-zone-a" x="480" y="72" width="216" height="150" rx="10"/>
  <text class="dg-n" x="496" y="94">셸 드라이버</text>

  <rect class="dg-hl" x="496" y="108" width="184" height="62" rx="6"/>
  <text class="dg-n" x="510" y="129">매번 새 프로세스</text>
  <text class="dg-s" x="510" y="148">셸이 밖에서 다시 띄운다</text>
  <text class="dg-s" x="510" y="163">상태는 파일에만 남는다</text>

  <path class="dg-arw-a" d="M588 174 V196" marker-end="url(#r3s-a)"/>

  <rect class="dg-hl" x="496" y="200" width="184" height="30" rx="6"/>
  <text class="dg-n" x="510" y="220">걸음 수가 매번 0 으로</text>

  <rect class="dg-lane" x="24" y="240" width="672" height="46" rx="8"/>
  <text class="dg-v" x="44" y="262">어느 쪽이 낫다가 아니라 용도가 다르다 — 대화 중 한 태스크냐, 자는 동안 모듈 하나냐</text>
  <text class="dg-s" x="44" y="280">사람이 터미널을 지키고 있는가 하나로 갈린다</text>
</svg>
