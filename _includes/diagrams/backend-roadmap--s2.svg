<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="backend-roadmap--s2-title backend-roadmap--s2-desc">
  <title id="backend-roadmap--s2-title">2단계 언어와 버전 관리</title>
  <desc id="backend-roadmap--s2-desc">백엔드 언어를 하나 고르고 Git 과 저장소 호스팅으로 넘어가는 구간. 언어는 택 1 이다.</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 백엔드 언어 · 택 1 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="91" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">백엔드 언어 · 택 1</text>
  <rect class="dg-item" x="169" y="56" width="169" height="52" rx="6"/>
  <text class="dg-t" x="253" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">JavaScript · Python · Go</text>
  <text class="dg-s" x="253" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">추천</text>
  <rect class="dg-item" x="354" y="56" width="196" height="52" rx="6"/>
  <text class="dg-t" x="452" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Java · C# · PHP · Ruby · Rust</text>
  <text class="dg-s" x="452" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">대안</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 버전 관리 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">버전 관리</text>
  <rect class="dg-item" x="200" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="248" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Git</text>
  <rect class="dg-item" x="312" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub</text>
  <text class="dg-s" x="360" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">추천</text>
  <rect class="dg-item" x="424" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="472" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitLab</text>
  <text class="dg-s" x="472" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">대안</text>
