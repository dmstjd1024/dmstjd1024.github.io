<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="backend-roadmap--s4-title backend-roadmap--s4-desc">
  <title id="backend-roadmap--s4-title">4단계 캐싱, 웹 서버, 보안</title>
  <desc id="backend-roadmap--s4-desc">캐싱과 웹 서버를 거쳐 웹 보안으로 이어지는 구간. Redis 와 Nginx 가 추천이다.</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 캐싱 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="32" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">캐싱</text>
  <rect class="dg-item" x="200" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="248" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Redis</text>
  <text class="dg-s" x="248" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">추천</text>
  <rect class="dg-item" x="312" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Memcached</text>
  <text class="dg-s" x="360" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">대안</text>
  <rect class="dg-item" x="424" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="472" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HTTP 캐싱</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 웹 서버 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="45" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">웹 서버</text>
  <rect class="dg-item" x="222" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="270" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Nginx</text>
  <text class="dg-s" x="270" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">추천</text>
  <rect class="dg-item" x="334" y="200" width="164" height="52" rx="6"/>
  <text class="dg-t" x="416" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Apache · Caddy · MS IIS</text>
  <text class="dg-s" x="416" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">대안</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- 웹 보안 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="45" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">웹 보안</text>
  <rect class="dg-item" x="115" y="344" width="121" height="52" rx="6"/>
  <text class="dg-t" x="175" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">HTTPS · SSL/TLS</text>
  <rect class="dg-item" x="252" y="344" width="96" height="52" rx="6"/>
  <text class="dg-t" x="300" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CORS · CSP</text>
  <rect class="dg-item" x="364" y="344" width="104" height="52" rx="6"/>
  <text class="dg-t" x="416" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OWASP Top 10</text>
  <rect class="dg-item" x="484" y="344" width="121" height="52" rx="6"/>
  <text class="dg-t" x="544" y="366" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">bcrypt · scrypt</text>
  <text class="dg-s" x="544" y="383" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">해시</text>
</svg>
