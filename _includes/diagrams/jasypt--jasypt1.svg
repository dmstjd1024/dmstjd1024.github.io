<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Jasypt 온라인 도구에서 평문을 암호화할 때 입력하는 세 항목">
  <marker id="jasypt1-ja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="34">암호화 입력값</text>

  <rect class="dg-card" x="24" y="50" width="672" height="164" rx="10"/>

  <rect class="dg-row" x="44" y="68" width="632" height="40" rx="6"/>
  <text class="dg-n" x="60"  y="93">1</text>
  <text class="dg-k" x="82"  y="93">Enter plain text to Encrypt</text>
  <text class="dg-v" x="400" y="93">암호화할 평문</text>

  <rect class="dg-row" x="44" y="116" width="632" height="40" rx="6"/>
  <text class="dg-n" x="60"  y="141">2</text>
  <text class="dg-k" x="82"  y="141">Select Type of Encryption</text>
  <text class="dg-v" x="400" y="141">Two Way Encryption</text>

  <rect class="dg-row" x="44" y="164" width="632" height="40" rx="6"/>
  <text class="dg-n" x="60"  y="189">3</text>
  <text class="dg-k" x="82"  y="189">Select Key To Be Used</text>
  <text class="dg-v" x="400" y="189">사용할 secretKey</text>

  <path class="dg-arw" d="M360 222 V246" marker-end="url(#jasypt1-ja)"/>

  <rect class="dg-out" x="24" y="252" width="672" height="52" rx="8"/>
  <text class="dg-k" x="44"  y="283">Encrypted String</text>
  <text class="dg-v" x="200" y="283">ENC(...) 형태로 쓸 암호문이 나온다</text>
</svg>
