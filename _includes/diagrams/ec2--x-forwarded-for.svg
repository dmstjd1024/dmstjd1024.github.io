  <rect class="dg-item" x="244" y="122" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">X-Forwarded-For</text>
  <text class="dg-s" x="360" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">클라이언트의 원래 공인 IP · 헤더를 읽어야 진…</text>
</svg>
