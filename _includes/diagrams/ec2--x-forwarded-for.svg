<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 214" role="img" aria-labelledby="ec2--x-forwarded-for-title ec2--x-forwarded-for-desc">
  <title id="ec2--x-forwarded-for-title">로드밸런서를 거치면 원래 출처 IP 가 사라지고 X-Forwarded-For 헤더에만 남는 흐름</title>
  <desc id="ec2--x-forwarded-for-desc">로드밸런서를 거치면 원래 출처 IP 가 사라지고 X-Forwarded-For 헤더에만 남는 흐름</desc>

  <defs>
    <marker id="ec2--x-forwarded-for-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
