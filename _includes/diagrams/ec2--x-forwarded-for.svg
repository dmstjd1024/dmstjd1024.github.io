  <rect class="dg-item" x="352" y="56" width="121" height="52" rx="6"/>
  <text class="dg-t" x="412" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">백엔드 인스턴스</text>
  <text class="dg-s" x="412" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">사설 IP 만 보임</text>
