  <rect class="dg-zone" x="24" y="242" width="312" height="298" rx="8"/>
  <rect class="dg-mask" x="40" y="236" width="184" height="12" rx="2"/>
  <text class="dg-s" x="44" y="245" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ack 이 오지 않으면 — 브로커가 다시 준다</text>
  <rect class="dg-item" x="105" y="266" width="150" height="52" rx="6"/>
  <text class="dg-t" x="180" y="288" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">소비자</text>
  <text class="dg-s" x="180" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">처리 후 ack 직전에 · 죽음</text>
  <rect class="dg-item" x="125" y="332" width="110" height="52" rx="6"/>
  <text class="dg-t" x="180" y="354" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">브로커</text>
  <text class="dg-s" x="180" y="371" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ack 을 못 받았다</text>
  <rect class="dg-item" x="87" y="398" width="185" height="52" rx="6"/>
  <text class="dg-t" x="179" y="420" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">다른 소비자에게 같은 메시지</text>
  <text class="dg-s" x="179" y="437" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ 중복 처리가 일어난다</text>
  <rect class="dg-item" x="64" y="464" width="232" height="52" rx="6"/>
  <text class="dg-t" x="180" y="486" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">멱등성 — 받는 쪽이 감당한다</text>
  <text class="dg-s" x="180" y="503" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">처리한 메시지 ID 를 기억해 두었다가 이미 있으…</text>
