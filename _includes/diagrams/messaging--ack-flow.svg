<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 358" role="img" aria-labelledby="messaging--ack-flow-title messaging--ack-flow-desc">
  <title id="messaging--ack-flow-title">생산자가 브로커에 메시지를 넣고 소비자가 처리한 뒤 ack 을 보내면 브로커가 메시지를 지우는 흐름과, ack 이 오지 않으면 브로커가 같은 메시지를 다시 보내 중복이 생기고 소비자의 멱등성이 그것을 받아내는 갈래</title>
  <desc id="messaging--ack-flow-desc">생산자가 브로커에 메시지를 넣고 소비자가 처리한 뒤 ack 을 보내면 브로커가 메시지를 지우는 흐름과, ack 이 오지 않으면 브로커가 같은 메시지를 다시 보내 중복이 생기고 소비자의 멱등성이 그것을 받아내는 갈래</desc>

  <defs>
    <marker id="messaging--ack-flow-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 정상 — 처리하고 ack 을 보낸다 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="142" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">정상 — 처리하고 ack 을 보낸다</text>
  <rect class="dg-item" x="177" y="56" width="119" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">생산자</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">넣고 바로 돌아온다</text>
  <rect class="dg-item" x="312" y="56" width="119" height="52" rx="6"/>
  <text class="dg-t" x="371" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">브로커</text>
  <text class="dg-s" x="371" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">메시지를 들고 있다</text>
  <rect class="dg-item" x="447" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="495" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">소비자</text>
  <text class="dg-s" x="495" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">처리한다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#messaging--ack-flow-arw-w)"/>

  <!-- ack 이 오지 않으면 — 브로커가 다시 준다 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="166" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="184" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">ack 이 오지 않으면 — 브로커가 다시 준다</text>
  <rect class="dg-item" x="121" y="200" width="150" height="52" rx="6"/>
  <text class="dg-t" x="196" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">소비자</text>
  <text class="dg-s" x="196" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">처리 후 ack 직전에 · 죽음</text>
  <rect class="dg-item" x="287" y="200" width="110" height="52" rx="6"/>
  <text class="dg-t" x="342" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">브로커</text>
  <text class="dg-s" x="342" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ack 을 못 받았다</text>
  <rect class="dg-item" x="413" y="200" width="185" height="52" rx="6"/>
  <text class="dg-t" x="505" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">다른 소비자에게 같은 메시지</text>
  <text class="dg-s" x="505" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ 중복 처리가 일어난다</text>
  <rect class="dg-item" x="244" y="266" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="288" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">멱등성 — 받는 쪽이 감당한다</text>
  <text class="dg-s" x="360" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">처리한 메시지 ID 를 기억해 두었다가 이미 있으…</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" class="dg-narrow" viewBox="0 0 360 556" role="presentation" aria-hidden="true">

