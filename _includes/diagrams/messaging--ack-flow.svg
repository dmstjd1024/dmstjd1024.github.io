  <text class="dg-s" x="112" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">넣고 바로 돌아온다</text>
  <rect class="dg-item" x="188" y="56" width="119" height="52" rx="6"/>
  <text class="dg-t" x="247" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">브로커</text>
  <text class="dg-s" x="247" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">메시지를 들고 있다</text>
  <rect class="dg-item" x="132" y="122" width="96" height="52" rx="6"/>
  <text class="dg-t" x="180" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">소비자</text>
  <text class="dg-s" x="180" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">처리한다</text>
