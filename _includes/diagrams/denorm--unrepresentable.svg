  <text class="dg-t" x="248" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">장비 A</text>
  <rect class="dg-item" x="312" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">고객 B</text>
  <rect class="dg-item" x="424" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="472" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">조직</text>
</svg>
