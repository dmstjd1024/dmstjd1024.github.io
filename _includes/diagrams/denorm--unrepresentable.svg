<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="denorm--unrepresentable-title denorm--unrepresentable-desc">
  <title id="denorm--unrepresentable-title">조인으로 조직을 유도하는 모델에서는 고객이 없는 장비의 조직을 표현할 수 없다</title>
  <desc id="denorm--unrepresentable-desc">조인으로 조직을 유도하는 모델에서는 고객이 없는 장비의 조직을 표현할 수 없다</desc>

  <defs>
    <marker id="denorm--unrepresentable-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="120" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">표현할 수 없는 상태</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">고객에 아직 배정 안 된 장비 · 고객과 다른 조…</text>
  <rect class="dg-item" x="368" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="484" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">장비에 org_id 를 직접 둔다</text>
  <text class="dg-s" x="484" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">고객이 없어도 조직을 가질 수 있다 · 조인 두…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#denorm--unrepresentable-arw-w)"/>

  <!-- 기존 — 조인으로 유도 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="104" height="12" rx="2"/>
