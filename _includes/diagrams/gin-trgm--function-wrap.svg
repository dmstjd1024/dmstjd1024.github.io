<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="gin-trgm--function-wrap-title gin-trgm--function-wrap-desc">
  <title id="gin-trgm--function-wrap-title">컬럼을 함수로 감싸면 인덱스와 표현식이 달라져 인덱스를 타지 못한다</title>
