<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="dead-file--misleading-log-title dead-file--misleading-log-desc">
  <title id="dead-file--misleading-log-title">도달 불가능한 죽은 파일이 살아있는 파일보다 최근에 수정돼 착각이 자기강화되는 구조</title>
  <desc id="dead-file--misleading-log-desc">도달 불가능한 죽은 파일이 살아있는 파일보다 최근에 수정돼 착각이 자기강화되는 구조</desc>

  <defs>
    <marker id="dead-file--misleading-log-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">그리고 착각은 스스로를 강화한다</text>
  <text class="dg-s" x="360" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">누군가 죽은 파일을 고친다 → 그 파일이 더 최…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#dead-file--misleading-log-arw-w)"/>

  <!-- 죽은 파일 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">죽은 파일</text>
  <rect class="dg-item" x="291" y="200" width="137" height="52" rx="6"/>
  <text class="dg-t" x="359" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">마지막 커밋 7일 전</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#dead-file--misleading-log-arw-w)"/>

  <!-- 살아있는 파일 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="70" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">살아있는 파일</text>
  <rect class="dg-item" x="275" y="344" width="169" height="52" rx="6"/>
  <text class="dg-t" x="359" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">마지막 커밋 1년 4개월 전</text>
</svg>
