  <rect class="dg-item" x="251" y="200" width="126" height="52" rx="6"/>
  <text class="dg-t" x="314" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">여기서 예외 발생</text>
  <rect class="dg-item" x="393" y="200" width="229" height="52" rx="6"/>
  <text class="dg-t" x="507" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">이 아래는 실행되지 않는다 — 건너…</text>
</svg>
