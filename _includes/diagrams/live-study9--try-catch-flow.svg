<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="live-study9--try-catch-flow-title live-study9--try-catch-flow-desc">
  <title id="live-study9--try-catch-flow-title">try 블록에서 예외가 나면 남은 코드를 건너뛰고 catch 로 이동하며 finally 는 항상 실행된다</title>
  <desc id="live-study9--try-catch-flow-desc">try 블록에서 예외가 나면 남은 코드를 건너뛰고 catch 로 이동하며 finally 는 항상 실행된다</desc>

  <defs>
    <marker id="live-study9--try-catch-flow-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="172" y="56" width="128" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">catch</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">타입이 맞는 블록으로</text>
  <rect class="dg-item" x="316" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="432" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">finally</text>
  <text class="dg-s" x="432" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">예외가 나든 안 나든, return 이 있어도 반드시…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#live-study9--try-catch-flow-arw-w)"/>

  <!-- try -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
