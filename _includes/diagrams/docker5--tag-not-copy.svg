<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="docker5--tag-not-copy-title docker5--tag-not-copy-desc">
  <title id="docker5--tag-not-copy-title">docker image tag 는 이미지를 복사하지 않고 같은 실체에 이름표를 하나 더 단다</title>
  <desc id="docker5--tag-not-copy-desc">docker image tag 는 이미지를 복사하지 않고 같은 실체에 이름표를 하나 더 단다</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-item" x="135" y="56" width="212" height="52" rx="6"/>
  <text class="dg-t" x="241" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">diamol/node:latest</text>
  <text class="dg-s" x="241" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IMAGE ID  8e0eeb0a11b3 · 원래 있던 이름</text>
  <rect class="dg-item" x="363" y="56" width="221" height="52" rx="6"/>
  <text class="dg-t" x="473" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">myaccount/verify-demo:v1</text>
  <text class="dg-s" x="473" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IMAGE ID  8e0eeb0a11b3 · tag 로 새로 단…</text>
  <rect class="dg-item" x="278" y="122" width="163" height="52" rx="6"/>
