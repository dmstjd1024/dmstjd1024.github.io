<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="live-study2--primitive-vs-reference-title live-study2--primitive-vs-reference-desc">
  <title id="live-study2--primitive-vs-reference-title">기본형은 값을 직접 담고 참조형은 객체의 주소를 담는다는 차이</title>
  <desc id="live-study2--primitive-vs-reference-desc">기본형은 값을 직접 담고 참조형은 객체의 주소를 담는다는 차이</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 기본형 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="41" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">기본형</text>
  <rect class="dg-item" x="249" y="56" width="110" height="52" rx="6"/>
  <text class="dg-t" x="304" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">int age = 25;</text>
  <rect class="dg-item" x="375" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="423" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">age</text>
  <text class="dg-s" x="423" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">25</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 참조형 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="41" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">참조형</text>
  <rect class="dg-item" x="163" y="200" width="169" height="52" rx="6"/>
  <text class="dg-t" x="247" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Date today = new Date();</text>
  <rect class="dg-item" x="348" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="396" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">today</text>
  <text class="dg-s" x="396" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0x1A2B</text>
  <rect class="dg-item" x="460" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="508" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Date 객체</text>
</svg>
