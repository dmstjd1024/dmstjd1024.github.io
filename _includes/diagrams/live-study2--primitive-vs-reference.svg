<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="기본형은 값을 직접 담고 참조형은 객체의 주소를 담는다는 차이">
  <marker id="ls2pvr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">변수 안에 무엇이 들어 있나</text>

  <rect class="dg-lane" x="24" y="48" width="672" height="88" rx="10"/>
  <text class="dg-t" x="44" y="76">기본형</text>
  <text class="dg-s" x="44" y="96">primitive</text>

  <rect class="dg-code" x="150" y="60" width="180" height="30" rx="4"/>
  <text class="dg-key" x="166" y="80">int age = 25;</text>

  <rect class="dg-lead" x="150" y="98" width="180" height="30" rx="6"/>
  <text class="dg-t" x="166" y="118">age</text>
  <text class="dg-b" x="240" y="118">25</text>
  <text class="dg-v" x="350" y="118">값이 변수 안에 그대로 있다</text>

  <rect class="dg-lane" x="24" y="152" width="672" height="112" rx="10"/>
  <text class="dg-t" x="44" y="180">참조형</text>
  <text class="dg-s" x="44" y="200">reference</text>

  <rect class="dg-code" x="150" y="164" width="230" height="30" rx="4"/>
  <text class="dg-key" x="166" y="184">Date today = new Date();</text>

  <rect class="dg-row" x="150" y="202" width="150" height="42" rx="6"/>
  <text class="dg-t" x="166" y="222">today</text>
  <text class="dg-v" x="166" y="240">0x1A2B</text>

  <path class="dg-arw" d="M308 223 H366" marker-end="url(#ls2pvr-a)"/>
  <text class="dg-s" x="310" y="214">주소를 따라가면</text>

  <rect class="dg-out" x="374" y="202" width="180" height="42" rx="6"/>
  <text class="dg-t" x="390" y="228">Date 객체</text>

  <text class="dg-v" x="570" y="228">진짜 값은 저기 있다</text>

  <text class="dg-s" x="24" y="290">참조형 변수가 담는 것은 값이 아니라 값이 있는 곳의 주소다</text>
</svg>
