<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="새로고침하면 메모리 상태가 사라져 죽은 게이트웨이로 요청이 다시 쏟아지는 구조">
  <marker id="crfs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">차단 UI 는 있는데 차단 로직이 없었다</text>

  <rect class="dg-item" x="24" y="56" width="150" height="60" rx="8"/>
  <text class="dg-t" x="44" y="80">게이트웨이 장애</text>
  <text class="dg-s" x="44" y="100">502 · 503 · 504</text>

  <path class="dg-arw" d="M182 86 H214" marker-end="url(#crfs-a)"/>

  <rect class="dg-row" x="222" y="56" width="150" height="60" rx="8"/>
  <text class="dg-t" x="242" y="80">오버레이 표시</text>
  <text class="dg-s" x="242" y="100">사람에게만 보인다</text>

  <path class="dg-arw" d="M380 86 H412" marker-end="url(#crfs-a)"/>

  <rect class="dg-row" x="420" y="56" width="150" height="60" rx="8"/>
  <text class="dg-t" x="440" y="80">사용자가 F5</text>
  <text class="dg-s" x="440" y="100">멈춘 줄 알고</text>

  <path class="dg-arw" d="M578 86 H610" marker-end="url(#crfs-a)"/>

  <rect class="dg-warn" x="618" y="56" width="78" height="60" rx="8"/>
  <text class="dg-k" x="634" y="86">폭주</text>

  <rect class="dg-warn" x="24" y="140" width="672" height="80" rx="8"/>
  <text class="dg-t" x="44" y="164">새로고침이 상태를 지운다</text>
  <text class="dg-v" x="44" y="188">Zustand 오버레이 상태는 메모리 → 새로고침하면 사라진다</text>
  <text class="dg-v" x="44" y="210">재마운트된 TanStack Query 가 등록된 쿼리를 한꺼번에 발사한다</text>

  <rect class="dg-out" x="24" y="236" width="672" height="56" rx="8"/>
  <text class="dg-k" x="44" y="260">그래서 브라우저 쪽에 서킷 브레이커를 뒀다 — arm · read · clear 세 함수, 50줄</text>
  <text class="dg-s" x="44" y="280">막을 대상은 서버가 아니라 "장애를 아는 이 탭이 계속 쏘는 것" 이다</text>
</svg>
