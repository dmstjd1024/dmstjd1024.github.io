<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="ssr-ssg--seo-title ssr-ssg--seo-desc">
  <title id="ssr-ssg--seo-title">검색 크롤러가 받는 HTML 이 CSR 과 SSR 에서 다르다</title>
  <desc id="ssr-ssg--seo-desc">검색 크롤러가 받는 HTML 이 CSR 과 SSR 에서 다르다</desc>

  <defs>
