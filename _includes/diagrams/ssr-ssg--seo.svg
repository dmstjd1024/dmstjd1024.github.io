  <text class="dg-s" x="256" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">&lt;p&gt;본문 내용...&lt;/p&gt;</text>
  <rect class="dg-item" x="334" y="200" width="191" height="52" rx="6"/>
