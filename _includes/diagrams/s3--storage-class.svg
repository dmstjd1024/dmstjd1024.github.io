  <text class="dg-t" x="484" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">글레시어</text>
  <text class="dg-s" x="484" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">몇 년에 한 번 쓸까 말까 한 것 · 등급·복원 옵…</text>
  <rect class="dg-item" x="244" y="188" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="210" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">지능적 티어링</text>
