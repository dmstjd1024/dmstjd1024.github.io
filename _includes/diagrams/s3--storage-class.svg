  <title id="s3--storage-class-title">S3 스토리지 유형 다섯 가지를 접근 빈도 순으로 비교</title>
  <desc id="s3--storage-class-desc">S3 스토리지 유형 다섯 가지를 접근 빈도 순으로 비교</desc>

  <defs>
