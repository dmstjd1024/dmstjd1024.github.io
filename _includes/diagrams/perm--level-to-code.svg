<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="정수 하나로 권한을 표현하는 방식과 권한 코드 기반 모델의 차이">
  <marker id="pmltc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">숫자 하나로는 표현이 안 됐다</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="44" y="74">user_level 정수 하나</text>

  <rect class="dg-row" x="44" y="88" width="288" height="26" rx="4"/>
  <text class="dg-v" x="60" y="106">level 3 — 숫자가 클수록 많은 권한</text>

  <rect class="dg-warn" x="44" y="122" width="288" height="60" rx="6"/>
  <text class="dg-k" x="60" y="144">"조회는 되는데 삭제는 안 되고</text>
  <text class="dg-k" x="60" y="164">다른 화면에선 승인은 된다"</text>
  <text class="dg-s" x="60" y="178">한 축으로는 못 나타낸다</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="388" y="74">권한 코드 기반</text>

  <rect class="dg-out" x="388" y="88" width="288" height="26" rx="4"/>
  <text class="dg-k" x="404" y="106">PERM_리소스_행위 형태의 코드</text>

  <rect class="dg-row" x="388" y="122" width="288" height="26" rx="4"/>
  <text class="dg-v" x="404" y="140">역할에 코드를 매핑</text>
  <rect class="dg-row" x="388" y="156" width="288" height="26" rx="4"/>
  <text class="dg-v" x="404" y="174">사용자에게 역할을 부여</text>

  <path class="dg-arw" d="M360 120 H380" marker-end="url(#pmltc-a)"/>

  <text class="dg-v" x="24" y="244">정수 모델에서는 새 권한이 생길 때마다 숫자 구간의 의미를 다시 해석해야 했다</text>
  <text class="dg-s" x="24" y="268">그 해석이 코드 곳곳에 흩어져 있어, 어디를 고쳐야 하는지도 매번 달랐다</text>
</svg>
