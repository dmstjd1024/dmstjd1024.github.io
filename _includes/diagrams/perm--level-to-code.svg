<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="perm--level-to-code-title perm--level-to-code-desc">
  <title id="perm--level-to-code-title">정수 하나로 권한을 표현하는 방식과 권한 코드 기반 모델의 차이</title>
  <desc id="perm--level-to-code-desc">정수 하나로 권한을 표현하는 방식과 권한 코드 기반 모델의 차이</desc>

  <defs>
    <marker id="perm--level-to-code-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- user_level 정수 하나 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="100" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">user_level 정수 하나</text>
