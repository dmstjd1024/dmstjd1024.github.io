  <text class="dg-t" x="235" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">level 3 — 숫자가 클수록 많은 권…</text>
  <rect class="dg-item" x="363" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="479" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">"조회는 되는데 삭제는 안 되고</text>
  <text class="dg-s" x="479" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">다른 화면에선 승인은 된다" · 한 축으로는 못…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#perm--level-to-code-arw-w)"/>

