<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="parallel-test--jvm-boundary-title parallel-test--jvm-boundary-desc">
  <title id="parallel-test--jvm-boundary-title">포크 병렬은 JVM 이 분리돼 인메모리 DB 도 따로 생기지만 스레드 병렬은 같은 JVM 안에서 같은 DB 를 공유한다</title>
  <desc id="parallel-test--jvm-boundary-desc">포크 병렬은 JVM 이 분리돼 인메모리 DB 도 따로 생기지만 스레드 병렬은 같은 JVM 안에서 같은 DB 를 공유한다</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 포크 병렬 — JVM 을 나눈다 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="125" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">포크 병렬 — JVM 을 나눈다</text>
  <rect class="dg-item" x="256" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="304" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">JVM 1</text>
  <text class="dg-s" x="304" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">h2:mem:test</text>
  <rect class="dg-item" x="368" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="416" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">JVM 2</text>
  <text class="dg-s" x="416" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">h2:mem:test</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 스레드 병렬 — JVM 하나 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="112" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">스레드 병렬 — JVM 하나</text>
  <rect class="dg-item" x="158" y="200" width="191" height="52" rx="6"/>
  <text class="dg-t" x="253" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">JVM 1 — 스레드 A · 스레드 B</text>
  <text class="dg-s" x="253" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">h2:mem:test (하나뿐)</text>
  <rect class="dg-item" x="365" y="200" width="196" height="52" rx="6"/>
  <text class="dg-t" x="463" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">→ 테스트끼리 서로를 깨뜨린다</text>
</svg>
