<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="sidebar--duplicate-source-title sidebar--duplicate-source-desc">
  <title id="sidebar--duplicate-source-title">서버가 이미 주는 메뉴 정보를 프론트가 상수로 다시 만들어 두 곳에서 관리하던 구조</title>
  <desc id="sidebar--duplicate-source-desc">서버가 이미 주는 메뉴 정보를 프론트가 상수로 다시 만들어 두 곳에서 관리하던 구조</desc>

  <defs>
    <marker id="sidebar--duplicate-source-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 서버가 주는 것 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="74" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">서버가 주는 것</text>
  <rect class="dg-item" x="180" y="56" width="191" height="52" rx="6"/>
  <text class="dg-t" x="275" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">메뉴 목록 · 그룹 이름 · 권한</text>
  <rect class="dg-item" x="387" y="56" width="153" height="52" rx="6"/>
  <text class="dg-t" x="463" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">그런데 프론트가 쓴 건</text>
  <text class="dg-s" x="463" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">그룹 이름 하나뿐이었다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#sidebar--duplicate-source-arw-w)"/>

  <!-- 프론트가 따로 가진 것 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="104" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">프론트가 따로 가진 것</text>
  <rect class="dg-item" x="169" y="200" width="185" height="52" rx="6"/>
  <text class="dg-t" x="261" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">상수 배열에 메뉴를 하드코딩</text>
  <rect class="dg-item" x="370" y="200" width="180" height="52" rx="6"/>
  <text class="dg-t" x="460" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">항목마다 permission 문자열</text>
  <text class="dg-s" x="460" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">표시 여부도 직접 판단</text>
</svg>
