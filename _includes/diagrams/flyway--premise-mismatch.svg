<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="flyway--premise-mismatch-title flyway--premise-mismatch-desc">
  <title id="flyway--premise-mismatch-title">빈 DB 재현을 목표로 한 이번 도입과 이미 존재하던 레거시 스키마의 차이</title>
  <desc id="flyway--premise-mismatch-desc">빈 DB 재현을 목표로 한 이번 도입과 이미 존재하던 레거시 스키마의 차이</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 이번 도입의 재현 목표 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="104" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">이번 도입의 재현 목표</text>
  <rect class="dg-item" x="162" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="210" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">빈 DB</text>
  <rect class="dg-item" x="274" y="56" width="169" height="52" rx="6"/>
  <text class="dg-t" x="358" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">V1 · V2 · V3 … 순서대로</text>
  <rect class="dg-item" x="459" y="56" width="99" height="52" rx="6"/>
  <text class="dg-t" x="508" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">현재 스키마</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 실제 프로젝트 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="70" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">실제 프로젝트</text>
  <rect class="dg-item" x="138" y="200" width="232" height="52" rx="6"/>
  <text class="dg-t" x="254" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">이미 테이블 81개가 있다</text>
  <text class="dg-s" x="254" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">어떻게 만들어졌는지 기록이 없다 · 여기서부터…</text>
  <rect class="dg-item" x="386" y="200" width="196" height="52" rx="6"/>
  <text class="dg-t" x="484" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">기존 스키마 덤프를 V1 로 구성</text>
</svg>
