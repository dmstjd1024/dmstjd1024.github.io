<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-label="프롬프트의 금지 목록은 요청에 그치고 PreToolUse 훅만 실제로 명령을 차단한다">
  <text class="dg-h" x="24" y="30">같은 금지 목록, 다른 강제력</text>

  <rect class="dg-warn" x="24" y="54" width="330" height="128" rx="8"/>
  <text class="dg-t" x="44" y="82">프롬프트 + allowedTools</text>
  <text class="dg-s" x="44" y="106">"push --force 하지 마"</text>
  <text class="dg-s" x="44" y="126">범위를 좁혀 지정</text>
  <text class="dg-v" x="44" y="152">실측: 범위 밖 명령도 실행됨</text>
  <text class="dg-s" x="44" y="172">차단이 아니라 요청이었다</text>

  <rect class="dg-out" x="366" y="54" width="330" height="128" rx="8"/>
  <text class="dg-t" x="386" y="82">PreToolUse 훅</text>
  <text class="dg-s" x="386" y="106">매 호출의 명령 문자열 검사</text>
  <text class="dg-s" x="386" y="126">해당하면 exit 2 로 거부</text>
  <text class="dg-b" x="386" y="152">실측: whoami 차단 / echo 통과</text>
  <text class="dg-s" x="386" y="172">호출 자체가 도달하지 못한다</text>

  <rect class="dg-lane" x="24" y="202" width="672" height="94" rx="8"/>
  <text class="dg-t" x="44" y="230">차단은 명령어 이름이 아니라</text>
  <text class="dg-t" x="44" y="254">명령 문자열 전체를 본다</text>
  <text class="dg-s" x="44" y="278">cat README.md 는 통과, cat ~/.ssh/config 는 차단</text>

  <rect class="dg-out" x="24" y="312" width="672" height="34" rx="8"/>
  <text class="dg-k" x="44" y="334">시크릿 경로를 건드리지 않는 cat 만 허용된다</text>
</svg>
