<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="프롬프트의 금지 목록은 요청에 그치고 PreToolUse 훅만 실제로 명령을 차단한다">
  <marker id="dfph-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">같은 금지 목록, 다른 강제력</text>

  <rect class="dg-warn" x="24" y="52" width="330" height="122" rx="8"/>
  <text class="dg-t" x="44" y="78">프롬프트 + --allowedTools</text>
  <text class="dg-s" x="44" y="100">"push --force 하지 마"</text>
  <text class="dg-s" x="44" y="118">Bash(git status:*) 로 범위 지정</text>
  <text class="dg-v" x="44" y="146">실측: 범위 밖 명령이 그대로 실행됨</text>
  <text class="dg-s" x="44" y="164">모델에 대한 요청이지 차단이 아니다</text>

  <rect class="dg-out" x="366" y="52" width="330" height="122" rx="8"/>
  <text class="dg-t" x="386" y="78">PreToolUse 훅</text>
  <text class="dg-s" x="386" y="100">매 Bash 호출의 명령 문자열 검사</text>
  <text class="dg-s" x="386" y="118">해당하면 exit 2 로 거부</text>
  <text class="dg-b" x="386" y="146">실측: whoami 차단 / echo 통과</text>
  <text class="dg-s" x="386" y="164">호출 자체가 도달하지 못한다</text>

  <rect class="dg-lane" x="24" y="194" width="672" height="82" rx="8"/>
  <text class="dg-t" x="44" y="220">차단은 명령어 이름이 아니라 명령 문자열 전체를 본다</text>
  <text class="dg-s" x="44" y="244">cat README.md → 통과 (exit 0)</text>
  <text class="dg-v" x="44" y="266">cat ~/.ssh/config → 차단 (exit 2) — .ssh/ 패턴에 걸림</text>

  <rect class="dg-out" x="24" y="292" width="672" height="30" rx="8"/>
  <text class="dg-k" x="44" y="312">"cat 은 허용" 이 아니라 "시크릿 경로를 건드리지 않는 cat 은 허용"</text>
</svg>
