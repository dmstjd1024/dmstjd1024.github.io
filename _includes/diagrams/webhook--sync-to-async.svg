<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="webhook--sync-to-async-title webhook--sync-to-async-desc">
  <title id="webhook--sync-to-async-title">동기 대기 방식과 webhook 콜백 방식에서 요청 스레드가 점유되는 시간의 차이</title>
