<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="domino--shallow-snapshot-title domino--shallow-snapshot-desc">
  <title id="domino--shallow-snapshot-title">스냅샷이 배열만 새로 만들고 행 객체는 참조를 공유해 나중 편집이 과거 스냅샷의 값까지 바꾼다</title>
  <desc id="domino--shallow-snapshot-desc">스냅샷이 배열만 새로 만들고 행 객체는 참조를 공유해 나중 편집이 과거 스냅샷의 값까지 바꾼다</desc>

  <defs>
    <marker id="domino--shallow-snapshot-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">같은 객체를 가리키므로 과거 스냅샷…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#domino--shallow-snapshot-arw-w)"/>

  <!-- undoStack 스냅샷 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="83" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">undoStack 스냅샷</text>
  <rect class="dg-item" x="256" y="200" width="207" height="52" rx="6"/>
  <text class="dg-t" x="359" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">[ ... ] — 배열은 새로 만들었다</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#domino--shallow-snapshot-arw-w)"/>

  <!-- 현재 rows -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">현재 rows</text>
  <rect class="dg-item" x="251" y="344" width="218" height="52" rx="6"/>
  <text class="dg-t" x="360" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">행2 객체 — valueSetter 가 제자…</text>
</svg>
