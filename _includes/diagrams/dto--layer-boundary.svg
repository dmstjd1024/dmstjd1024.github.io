<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="dto--layer-boundary-title dto--layer-boundary-desc">
  <title id="dto--layer-boundary-title">DTO 는 클라이언트부터 서비스까지 오가고 Repository 부터는 Entity 를 쓴다는 경계</title>
  <desc id="dto--layer-boundary-desc">DTO 는 클라이언트부터 서비스까지 오가고 Repository 부터는 Entity 를 쓴다는 경계</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="120" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Entity</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">DB 테이블과 맞물려 있다 · 바뀌면 여러 곳이…</text>
  <rect class="dg-item" x="368" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="484" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">DTO</text>
  <text class="dg-s" x="484" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">화면이 요구하는 모양 · 자주 바뀌어도 DB 와…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- DTO 구간 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="49" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">DTO 구간</text>
  <rect class="dg-item" x="200" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="248" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client</text>
  <rect class="dg-item" x="312" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Controller</text>
  <rect class="dg-item" x="424" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="472" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Service</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- Entity 구간 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="62" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">Entity 구간</text>
  <rect class="dg-item" x="312" y="344" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Repository</text>
</svg>
