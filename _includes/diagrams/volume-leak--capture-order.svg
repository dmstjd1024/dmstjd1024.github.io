<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="컨테이너를 지우면 볼륨 목록을 조회할 방법이 사라지므로, 삭제 전에 목록을 먼저 확보해야 한다는 순서 문제">
  <marker id="vlk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z"/>
  </marker>

  <text class="dg-h" x="24" y="30">삭제 순서가 곧 버그였다</text>

  <text class="dg-s" x="24" y="56">기존 — 이름으로 찾아 지운다</text>

  <rect class="dg-row" x="24" y="68" width="196" height="56" rx="8"/>
  <text class="dg-t" x="44" y="92">클러스터 삭제</text>
  <text class="dg-s" x="44" y="112">컨테이너가 사라진다</text>

  <path class="dg-arw" d="M228 96 H284" marker-end="url(#vlk-a)"/>

  <rect class="dg-warn" x="292" y="68" width="404" height="56" rx="8"/>
  <text class="dg-k" x="312" y="92">이름에 클러스터명이 든 볼륨만 매칭</text>
  <text class="dg-s" x="312" y="112">익명 볼륨은 이름이 sha256 해시 — 안 걸린다. 그대로 남는다</text>

  <text class="dg-s" x="24" y="164">수정 — 지우기 전에 목록을 확보한다</text>

  <rect class="dg-sel" x="24" y="176" width="196" height="56" rx="8"/>
  <text class="dg-t" x="44" y="200">inspect 로 먼저 캡처</text>
  <text class="dg-s" x="44" y="220">마운트된 볼륨 ID 수집</text>

  <path class="dg-arw" d="M228 204 H284" marker-end="url(#vlk-a)"/>

  <rect class="dg-row" x="292" y="176" width="180" height="56" rx="8"/>
  <text class="dg-t" x="312" y="200">클러스터 삭제</text>
  <text class="dg-s" x="312" y="220">이제 조회 불가</text>

  <path class="dg-arw" d="M480 204 H536" marker-end="url(#vlk-a)"/>

  <rect class="dg-sel" x="544" y="176" width="152" height="56" rx="8"/>
  <text class="dg-t" x="564" y="200">캡처한 ID로</text>
  <text class="dg-s" x="564" y="220">명시적으로 삭제</text>

  <text class="dg-v" x="24" y="264">조회의 근거가 되는 대상을 먼저 없애면, 그 뒤엔 무엇을 지울지 알 방법이 없다</text>
  <text class="dg-s" x="24" y="286">되짚을 수 없는 삭제 앞에서는 목록 확보가 삭제보다 먼저 온다</text>
</svg>
