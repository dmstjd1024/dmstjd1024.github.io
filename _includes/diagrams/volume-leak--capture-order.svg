<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 214" role="img" aria-labelledby="volume-leak--capture-order-title volume-leak--capture-order-desc">
  <title id="volume-leak--capture-order-title">컨테이너를 지우면 볼륨 목록을 조회할 방법이 사라지므로, 삭제 전에 목록을 먼저 확보해야 한다는 순서 문제</title>
  <desc id="volume-leak--capture-order-desc">컨테이너를 지우면 볼륨 목록을 조회할 방법이 사라지므로, 삭제 전에 목록을 먼저 확보해야 한다는 순서 문제</desc>

