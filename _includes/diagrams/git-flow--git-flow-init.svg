<svg class="dg-wide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="git flow 의 다섯 브랜치 구조와 각 브랜치의 역할">

  <rect class="dg-lane" x="140" y="48"  width="660" height="46" rx="6"/>
  <rect class="dg-lane" x="140" y="152" width="660" height="46" rx="6"/>
  <rect class="dg-lane" x="140" y="256" width="660" height="46" rx="6"/>

  <!-- master -->
  <text class="dg-t" x="24" y="76">master</text>
  <text class="dg-d" x="24" y="94">배포</text>
  <line class="dg-ln dg-master" x1="160" y1="71" x2="780" y2="71"/>
  <circle cx="300" cy="71" class="dg-dot-master" r="5"/>
  <circle cx="620" cy="71" class="dg-dot-master" r="5"/>

  <!-- release -->
  <text class="dg-t" x="24" y="128">release</text>
  <text class="dg-d" x="24" y="146">품질 검사</text>
  <line class="dg-ln dg-release" x1="480" y1="123" x2="620" y2="123"/>
  <path class="dg-join" d="M480 175 V123"/>
  <path class="dg-join" d="M620 123 V71"/>
  <path class="dg-join" d="M620 123 V175"/>

  <!-- develop -->
  <text class="dg-t" x="24" y="180">develop</text>
  <text class="dg-d" x="24" y="198">개발 통합</text>
  <line class="dg-ln dg-develop" x1="160" y1="175" x2="780" y2="175"/>
  <circle cx="360" cy="175" class="dg-dot-develop" r="5"/>

  <!-- feature -->
  <text class="dg-t" x="24" y="232">feature</text>
  <text class="dg-d" x="24" y="250">기능 개발</text>
  <line class="dg-ln dg-feature" x1="220" y1="227" x2="360" y2="227"/>
  <path class="dg-join" d="M220 175 V227"/>
  <path class="dg-join" d="M360 227 V175"/>

  <!-- hotfix -->
  <text class="dg-t" x="24" y="284">hotfix</text>
  <text class="dg-d" x="24" y="302">긴급 수정</text>
  <line class="dg-ln dg-hotfix" x1="680" y1="279" x2="760" y2="279"/>
  <path class="dg-join" d="M680 71 V279"/>
  <path class="dg-join" d="M760 279 V71"/>

  <text class="dg-s" x="24" y="340">feature 는 develop 에서 갈라져 develop 으로 합쳐지고, hotfix 는 master 에서 갈라져 master 로 돌아온다</text>
</svg>
<svg class="dg-narrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" role="presentation" aria-hidden="true">
  <!-- 세로본. 가로본은 왼쪽 140px 를 브랜치 이름에 썼는데 360 폭에서는
       그게 39% 다. 이름을 레인 위 한 줄로 올려 가로를 전부 타임라인에
       쓴다. 이름을 선과 같은 줄에 두면 분기선이 글자를 뚫고 지나간다. -->
  <text class="dg-t" x="24" y="30">master</text>
  <text class="dg-d" x="90" y="30">배포</text>
  <rect class="dg-lane" x="24" y="40" width="312" height="40" rx="6"/>
  <line class="dg-ln dg-master" x1="24" y1="60" x2="336" y2="60"/>
  <text class="dg-t" x="24" y="106">release</text>
  <text class="dg-d" x="99" y="106">품질 검사</text>
  <rect class="dg-lane" x="24" y="116" width="312" height="40" rx="6"/>
  <line class="dg-ln dg-release" x1="192" y1="136" x2="264" y2="136"/>
  <text class="dg-t" x="24" y="182">develop</text>
  <text class="dg-d" x="99" y="182">개발 통합</text>
  <rect class="dg-lane" x="24" y="192" width="312" height="40" rx="6"/>
  <line class="dg-ln dg-develop" x1="24" y1="212" x2="336" y2="212"/>
  <text class="dg-t" x="24" y="258">feature</text>
  <text class="dg-d" x="99" y="258">기능 개발</text>
  <rect class="dg-lane" x="24" y="268" width="312" height="40" rx="6"/>
  <line class="dg-ln dg-feature" x1="72" y1="288" x2="144" y2="288"/>
  <text class="dg-t" x="24" y="334">hotfix</text>
  <text class="dg-d" x="90" y="334">긴급 수정</text>
  <rect class="dg-lane" x="24" y="344" width="312" height="40" rx="6"/>
  <line class="dg-ln dg-hotfix" x1="264" y1="364" x2="336" y2="364"/>

  <circle class="dg-dot-master" cx="120" cy="60" r="5"/>
  <circle class="dg-dot-master" cx="264" cy="60" r="5"/>
  <circle class="dg-dot-develop" cx="144" cy="212" r="5"/>

  <path class="dg-join" d="M192 212 V136"/>
  <path class="dg-join" d="M264 136 V60"/>
  <path class="dg-join" d="M264 136 V212"/>
  <path class="dg-join" d="M72 212 V288"/>
  <path class="dg-join" d="M144 288 V212"/>
  <path class="dg-join" d="M264 60 V364"/>
  <path class="dg-join" d="M336 364 V60"/>

  <text class="dg-s" x="24" y="434">feature 는 develop 에서 갈라져 develop 으로,</text>
  <text class="dg-s" x="24" y="452">hotfix 는 master 에서 갈라져 master 로 돌아온다</text>
</svg>
