<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="react2--useeffect-deps-title react2--useeffect-deps-desc">
  <title id="react2--useeffect-deps-title">useEffect 의 의존성 배열에 따라 이펙트가 언제 실행되는지</title>
  <desc id="react2--useeffect-deps-desc">useEffect 의 의존성 배열에 따라 이펙트가 언제 실행되는지</desc>

  <defs>
    <marker id="react2--useeffect-deps-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 배열 없음 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">배열 없음</text>
  <rect class="dg-item" x="305" y="56" width="110" height="52" rx="6"/>
  <text class="dg-t" x="360" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">useEffect(fn)</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#react2--useeffect-deps-arw-w)"/>

  <!-- 빈 배열 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="45" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">빈 배열</text>
  <rect class="dg-item" x="294" y="200" width="131" height="52" rx="6"/>
  <text class="dg-t" x="359" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">useEffect(fn, [])</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#react2--useeffect-deps-arw-w)"/>

  <!-- 값을 넣으면 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="62" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">값을 넣으면</text>
  <rect class="dg-item" x="281" y="344" width="158" height="52" rx="6"/>
  <text class="dg-t" x="360" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">useEffect(fn, [count])</text>
</svg>
