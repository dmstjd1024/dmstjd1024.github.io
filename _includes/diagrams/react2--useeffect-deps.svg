<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="useEffect 의 의존성 배열에 따라 이펙트가 언제 실행되는지">

  <text class="dg-h" x="24" y="30">의존성 배열이 실행 시점을 정한다</text>

  <rect class="dg-lane" x="24" y="48" width="672" height="66" rx="8"/>
  <rect class="dg-code" x="44" y="60" width="290" height="42" rx="6"/>
  <text class="dg-key" x="60" y="86">useEffect(fn)</text>
  <text class="dg-t" x="368" y="78">배열 없음</text>
  <text class="dg-v" x="368" y="98">렌더링될 때마다 매번 실행</text>

  <rect class="dg-lane" x="24" y="126" width="672" height="66" rx="8"/>
  <rect class="dg-code" x="44" y="138" width="290" height="42" rx="6"/>
  <text class="dg-key" x="60" y="164">useEffect(fn, [])</text>
  <text class="dg-t" x="368" y="156">빈 배열</text>
  <text class="dg-v" x="368" y="176">마운트 후 실행</text>

  <rect class="dg-lane" x="24" y="204" width="672" height="66" rx="8"/>
  <rect class="dg-code" x="44" y="216" width="290" height="42" rx="6"/>
  <text class="dg-key" x="60" y="242">useEffect(fn, [count])</text>
  <text class="dg-t" x="368" y="234">값을 넣으면</text>
  <text class="dg-v" x="368" y="254">마운트 후 · 의존성 변경 시</text>

  <text class="dg-s" x="24" y="292">커밋 후 실행 — 개발 StrictMode는 setup·cleanup을 추가 검사한다</text>
</svg>
