<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="react1--virtual-dom-title react1--virtual-dom-desc">
  <title id="react1--virtual-dom-title">Virtual DOM 에서 바뀐 부분만 계산해 실제 DOM 에 반영하는 흐름</title>
  <desc id="react1--virtual-dom-desc">Virtual DOM 에서 바뀐 부분만 계산해 실제 DOM 에 반영하는 흐름</desc>

