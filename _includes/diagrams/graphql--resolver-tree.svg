<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="graphql--resolver-tree-title graphql--resolver-tree-desc">
  <title id="graphql--resolver-tree-title">쿼리 트리를 따라 필드마다 리졸버가 차례로 호출되고 부모 리졸버의 결과가 자식 리졸버의 입력으로 전달되는 구조</title>
  <desc id="graphql--resolver-tree-desc">쿼리 트리를 따라 필드마다 리졸버가 차례로 호출되고 부모 리졸버의 결과가 자식 리졸버의 입력으로 전달되는 구조</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">사용자가 10명이면 3번 리졸버가 10…</text>
  <text class="dg-s" x="360" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">리졸버는 부모 하나씩만 받으므로, 모아서 처리…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- id 로 사용자 한 명을 찾는다 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="129" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">id 로 사용자 한 명을 찾는다</text>
  <rect class="dg-item" x="200" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="248" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">1</text>
  <text class="dg-s" x="248" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Query.user</text>
  <rect class="dg-item" x="312" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">2</text>
  <text class="dg-s" x="360" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">User.name</text>
  <rect class="dg-item" x="424" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="472" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">3</text>
  <text class="dg-s" x="472" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">User.posts</text>
</svg>
