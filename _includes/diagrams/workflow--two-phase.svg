  <text class="dg-s" x="621" y="114" text-anchor="middle">작업을 묻는다</text>

  <line class="dg-arw" x1="194" y1="100" x2="206" y2="100" marker-end="url(#w2p-ah)"/>
  <line class="dg-arw" x1="368" y1="100" x2="380" y2="100" marker-end="url(#w2p-ah)"/>
  <line class="dg-arw" x1="542" y1="100" x2="554" y2="100" marker-end="url(#w2p-ah)"/>

  <rect class="dg-item" x="212" y="192" width="296" height="52" rx="8"/>
