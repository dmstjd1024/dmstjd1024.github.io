<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="workflow--two-phase-title workflow--two-phase-desc">
  <title id="workflow--two-phase-title">work-start 의 2단계 구조: Phase A 는 최신화만 하고 멈추며, 작업 설명을 받은 뒤 Phase B 에서 브랜치 이름을 짓는다</title>
