  <text class="dg-s" x="287" y="114" text-anchor="middle">없으면 dev 기준 생성</text>

  <rect class="dg-item" x="386" y="64" width="150" height="72" rx="8"/>
  <text class="dg-t" x="461" y="94" text-anchor="middle">rebase</text>
  <text class="dg-s" x="461" y="114" text-anchor="middle">origin/dev 를 그 위에</text>

  <rect class="dg-item dg-hl" x="560" y="64" width="122" height="72" rx="8"/>
