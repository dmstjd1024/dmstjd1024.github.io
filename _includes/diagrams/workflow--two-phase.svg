<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="work-start 의 2단계 구조: Phase A 는 최신화만 하고 멈추며, 작업 설명을 받은 뒤 Phase B 에서 브랜치 이름을 짓는다">
  <defs>
    <marker id="w2p-ah" viewBox="0 0 10 10" refX="9" refY="5"
