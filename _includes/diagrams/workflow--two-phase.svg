      <path d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="dg-zone" x="14" y="30" width="692" height="128" rx="10"/>
  <rect class="dg-mask" x="35" y="24" width="192" height="15" rx="2"/>
