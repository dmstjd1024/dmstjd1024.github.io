<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="break 는 반복문을 벗어나고 continue 는 다음 회차로 건너뛴다는 차이">
  <marker id="ls4bc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">break 와 continue</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="180" rx="10"/>
  <text class="dg-t" x="44" y="76">break</text>

  <rect class="dg-row" x="44" y="90" width="288" height="30" rx="6"/>
  <text class="dg-v" x="60" y="110">반복문 안</text>
  <path class="dg-arw" d="M188 124 V140" marker-end="url(#ls4bc-a)"/>
  <rect class="dg-warn" x="44" y="146" width="288" height="30" rx="6"/>
  <text class="dg-k" x="60" y="166">break</text>
  <path class="dg-arw" d="M188 180 V196" marker-end="url(#ls4bc-a)"/>
  <rect class="dg-out" x="44" y="196" width="288" height="24" rx="6"/>
  <text class="dg-v" x="60" y="214">반복문 밖으로 나온다</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="180" rx="10"/>
  <text class="dg-t" x="388" y="76">continue</text>

  <rect class="dg-row" x="388" y="90" width="288" height="30" rx="6"/>
  <text class="dg-v" x="404" y="110">반복문 안</text>
  <path class="dg-arw" d="M532 124 V140" marker-end="url(#ls4bc-a)"/>
  <rect class="dg-warn" x="388" y="146" width="288" height="30" rx="6"/>
  <text class="dg-k" x="404" y="166">continue</text>
  <path class="dg-arw" d="M532 180 V196" marker-end="url(#ls4bc-a)"/>
  <rect class="dg-out" x="388" y="196" width="288" height="24" rx="6"/>
  <text class="dg-v" x="404" y="214">이번 회차만 건너뛰고 계속 돈다</text>

  <text class="dg-s" x="24" y="258">둘 다 '가장 가까운' 반복문에만 걸린다 — 더 바깥을 벗어나려면 이름을 붙여야 한다</text>
</svg>
