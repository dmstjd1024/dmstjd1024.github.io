  <text class="dg-t" x="484" y="210" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">없애고 나서 늘렸으므로</text>
  <text class="dg-s" x="484" y="227" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">남은 쿼리를 감당하기 위한 · 확장이 된다</text>
</svg>
