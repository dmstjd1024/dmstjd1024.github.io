  <rect class="dg-item" x="130" y="188" width="232" height="52" rx="6"/>
  <text class="dg-t" x="246" y="210" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">풀부터 늘렸다면</text>
  <text class="dg-s" x="246" y="227" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">쓸데없는 쿼리 네 개를 그대로 둔 채 · 커넥션만…</text>
