<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 436" role="img" aria-labelledby="feedback-loop--resize-observer-title feedback-loop--resize-observer-desc">
  <title id="feedback-loop--resize-observer-title">ResizeObserver 가 접힘 여부에 따라 폭이 달라지는 컨테이너를 측정해 펼침과 접힘이 서로를 유발하며 진동한다</title>
  <desc id="feedback-loop--resize-observer-desc">ResizeObserver 가 접힘 여부에 따라 폭이 달라지는 컨테이너를 측정해 펼침과 접힘이 서로를 유발하며 진동한다</desc>

  <defs>
    <marker id="feedback-loop--resize-observer-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">폭이 임계값 근처면 무한 진동 — 초…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#feedback-loop--resize-observer-arw-w)"/>

  <!-- 펼친 상태 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">펼친 상태</text>
  <rect class="dg-item" x="281" y="200" width="158" height="52" rx="6"/>
  <text class="dg-t" x="360" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">탭이 다 보여 폭이 넓다</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#feedback-loop--resize-observer-arw-w)"/>

  <!-- 접은 상태 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">접은 상태</text>
  <rect class="dg-item" x="262" y="344" width="196" height="52" rx="6"/>
  <text class="dg-t" x="360" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">드롭다운만 남아 폭이 줄어든다</text>
</svg>
