<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="log-flood--retention-title log-flood--retention-desc">
  <title id="log-flood--retention-title">같은 상태를 매 틱마다 기록해 로그 회전이 빨라지고 보존 기간이 25분으로 줄어든 구조</title>
  <desc id="log-flood--retention-desc">같은 상태를 매 틱마다 기록해 로그 회전이 빨라지고 보존 기간이 25분으로 줄어든 구조</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-item" x="142" y="56" width="128" height="52" rx="6"/>
  <text class="dg-t" x="206" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">매 틱 · 매 종목</text>
  <text class="dg-s" x="206" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">"MDD 차단 중" 재기록</text>
  <rect class="dg-item" x="286" y="56" width="126" height="52" rx="6"/>
  <text class="dg-t" x="349" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">25분에 127,141줄</text>
  <text class="dg-s" x="349" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">초당 약 85줄</text>
  <rect class="dg-item" x="428" y="56" width="150" height="52" rx="6"/>
  <text class="dg-t" x="503" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">회전이 빨라진다</text>
  <text class="dg-s" x="503" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">max-size 10m · max-file 3</text>
  <rect class="dg-item" x="120" y="122" width="232" height="52" rx="6"/>
  <text class="dg-t" x="236" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">진짜 잃은 것은 디스크가 아니다</text>
  <text class="dg-s" x="236" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">로그 보존 기간이 25분으로 줄어, 그 앞의 기록…</text>
  <rect class="dg-item" x="368" y="122" width="232" height="52" rx="6"/>
  <text class="dg-t" x="484" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">상태는 바뀔 때만 남긴다 — 같은 상…</text>
  <text class="dg-s" x="484" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">중요한 로그가 덜 중요한 로그에 밀려 사라지는…</text>
</svg>
