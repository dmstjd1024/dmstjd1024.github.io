<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="live-study7--encapsulation-title live-study7--encapsulation-desc">
  <title id="live-study7--encapsulation-title">필드를 public 으로 두면 잘못된 값을 막을 수 없고 setter 를 거치면 검증할 수 있다</title>
  <desc id="live-study7--encapsulation-desc">필드를 public 으로 두면 잘못된 값을 막을 수 없고 setter 를 거치면 검증할 수 있다</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- public 필드 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="62" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">public 필드</text>
  <rect class="dg-item" x="239" y="56" width="104" height="52" rx="6"/>
  <text class="dg-t" x="291" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">t.hour = 25;</text>
  <rect class="dg-item" x="359" y="56" width="121" height="52" rx="6"/>
  <text class="dg-t" x="419" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">그대로 들어간다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- private 필드 + setter -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="104" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">private 필드 + setter</text>
  <rect class="dg-item" x="204" y="200" width="115" height="52" rx="6"/>
  <text class="dg-t" x="261" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">t.setHour(25);</text>
  <rect class="dg-item" x="335" y="200" width="180" height="52" rx="6"/>
  <text class="dg-t" x="425" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">0~23 인지 검사한 뒤 넣는다</text>
</svg>
