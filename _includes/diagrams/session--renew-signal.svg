<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 292" role="img" aria-labelledby="session--renew-signal-title session--renew-signal-desc">
  <title id="session--renew-signal-title">폴링으로 세션을 갱신하는 방식과 API 호출 자체를 신호로 쓰는 방식의 차이</title>
  <desc id="session--renew-signal-desc">폴링으로 세션을 갱신하는 방식과 API 호출 자체를 신호로 쓰는 방식의 차이</desc>

  <defs>
    <marker id="session--renew-signal-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- keep-alive 폴링 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="79" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">keep-alive 폴링</text>
  <rect class="dg-item" x="196" y="56" width="164" height="52" rx="6"/>
  <text class="dg-t" x="278" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">일정 간격으로 갱신 요청</text>
  <rect class="dg-item" x="376" y="56" width="148" height="52" rx="6"/>
  <text class="dg-t" x="450" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">탭만 열어둔 사용자도</text>
  <text class="dg-s" x="450" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">세션이 계속 살아 있다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#session--renew-signal-arw-w)"/>

  <!-- API 호출을 신호로 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="87" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">API 호출을 신호로</text>
  <rect class="dg-item" x="190" y="200" width="175" height="52" rx="6"/>
  <text class="dg-t" x="277" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">모든 응답에서 타이머 갱신</text>
  <rect class="dg-item" x="381" y="200" width="148" height="52" rx="6"/>
  <text class="dg-t" x="455" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">쓰고 있으면 유지되고</text>
  <text class="dg-s" x="455" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">안 쓰면 정상 만료된다</text>
</svg>
