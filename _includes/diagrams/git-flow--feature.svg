<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 148" role="img" aria-labelledby="git-flow--feature-title git-flow--feature-desc">
  <title id="git-flow--feature-title">Jira 이슈 번호로 feature 브랜치가 자동 생성되는 과정</title>
