<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="materialize--shadow-rollout-title materialize--shadow-rollout-desc">
  <title id="materialize--shadow-rollout-title">섀도우 단계에서 읽기 경로를 그대로 두고 관찰한 뒤 전환하는 2단계 롤아웃</title>
  <desc id="materialize--shadow-rollout-desc">섀도우 단계에서 읽기 경로를 그대로 두고 관찰한 뒤 전환하는 2단계 롤아웃</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 1단계 — 섀도우 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="79" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">1단계 — 섀도우</text>
  <rect class="dg-item" x="64" y="56" width="212" height="52" rx="6"/>
  <text class="dg-t" x="170" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">_mat 테이블 생성 · 백필 · 동기화</text>
  <rect class="dg-item" x="292" y="56" width="126" height="52" rx="6"/>
  <text class="dg-t" x="355" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">읽기는 여전히 뷰</text>
  <rect class="dg-item" x="434" y="56" width="221" height="52" rx="6"/>
  <text class="dg-t" x="544" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">사용자 체감 변화 없음</text>
  <text class="dg-s" x="544" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">_mat 이 뷰를 따라오는지 · 실데이터로 관찰</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 2단계 — 전환 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="70" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">2단계 — 전환</text>
  <rect class="dg-item" x="155" y="200" width="137" height="52" rx="6"/>
  <text class="dg-t" x="223" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">엔티티 매핑만 변경</text>
  <rect class="dg-item" x="308" y="200" width="126" height="52" rx="6"/>
  <text class="dg-t" x="371" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">읽기가 _mat 으로</text>
  <rect class="dg-item" x="450" y="200" width="115" height="52" rx="6"/>
  <text class="dg-t" x="507" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">애노테이션 2줄</text>
  <text class="dg-s" x="507" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">되돌리기도 2줄</text>
</svg>
