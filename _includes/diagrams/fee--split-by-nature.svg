<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="면제 가능한 수수료와 면제 불가능한 세금을 한 함수에 묶어두면 생기는 위험">
  <marker id="fsbn-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">성격이 다르면 함수도 나눈다</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="44" y="74">묶여 있을 때</text>

  <rect class="dg-warn" x="44" y="88" width="288" height="34" rx="6"/>
  <text class="dg-k" x="60" y="110">calc_sell_cost — 둘을 함께 계산</text>

  <text class="dg-v" x="44" y="146">수수료 면제가 끝나 요율을 고칠 때</text>
  <text class="dg-k" x="44" y="168">세금 계산까지 같이 건드리게 된다</text>
  <text class="dg-s" x="44" y="190">고칠 이유가 다른데 고칠 자리가 같다</text>

  <path class="dg-arw" d="M360 120 H380" marker-end="url(#fsbn-a)"/>

  <rect class="dg-lane" x="368" y="48" width="328" height="150" rx="10"/>
  <text class="dg-t" x="388" y="74">나눈 뒤</text>

  <rect class="dg-out" x="388" y="88" width="140" height="34" rx="6"/>
  <text class="dg-k" x="404" y="110">calc_commission</text>
  <rect class="dg-out" x="536" y="88" width="140" height="34" rx="6"/>
  <text class="dg-k" x="552" y="110">calc_tax</text>

  <text class="dg-v" x="388" y="146">수수료 — 증권사 정책, 면제 가능</text>
  <text class="dg-v" x="388" y="168">거래세 — 법정, 면제 불가</text>
  <text class="dg-s" x="388" y="190">한쪽이 바뀌어도 다른 쪽은 그대로다</text>

  <text class="dg-s" x="24" y="252">계산식이 비슷해 보여도, 바뀌는 이유가 다르면 같이 두지 않는다</text>
</svg>
