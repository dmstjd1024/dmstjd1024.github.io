<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="review-bot--boundary-title review-bot--boundary-desc">
  <title id="review-bot--boundary-title">정적 분석으로 판정 가능한 범위와 실행이나 도메인 지식이 필요한 범위의 경계</title>
  <desc id="review-bot--boundary-desc">정적 분석으로 판정 가능한 범위와 실행이나 도메인 지식이 필요한 범위의 경계</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 코드만 보면 판정된다 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="100" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">코드만 보면 판정된다</text>
  <rect class="dg-item" x="264" y="56" width="191" height="52" rx="6"/>
  <text class="dg-t" x="359" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">파일 하나 안에서 결론이 난다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 그 밖을 봐야 안다 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="87" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">그 밖을 봐야 안다</text>
  <rect class="dg-item" x="262" y="200" width="196" height="52" rx="6"/>
  <text class="dg-t" x="360" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">실행하거나 업무를 알아야 한다</text>
</svg>
