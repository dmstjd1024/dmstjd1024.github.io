<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="클래스 로더가 클래스패스를 기준으로 클래스 파일을 찾는 흐름">
  <marker id="ls7cp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">클래스패스는 '어디서 찾을지' 를 알려주는 것</text>

  <rect class="dg-item" x="24" y="56" width="180" height="60" rx="8"/>
  <text class="dg-t" x="44" y="82">클래스 로더</text>
  <text class="dg-s" x="44" y="102">클래스가 필요해졌다</text>

  <path class="dg-arw" d="M212 86 H268" marker-end="url(#ls7cp-a)"/>

  <rect class="dg-lead" x="276" y="56" width="180" height="60" rx="8"/>
  <text class="dg-t" x="296" y="82">클래스패스</text>
  <text class="dg-s" x="296" y="102">이 경로들을 뒤진다</text>

  <path class="dg-arw" d="M464 86 H520" marker-end="url(#ls7cp-a)"/>

  <rect class="dg-out" x="528" y="56" width="168" height="60" rx="8"/>
  <text class="dg-t" x="548" y="82">.class 발견</text>
  <text class="dg-s" x="548" y="102">메모리로 올린다</text>

  <text class="dg-t" x="24" y="152">지정하는 방법 두 가지</text>

  <rect class="dg-row" x="24" y="164" width="328" height="52" rx="6"/>
  <text class="dg-k" x="44" y="186">CLASSPATH 환경변수</text>
  <text class="dg-s" x="44" y="206">시스템에 등록해 두고 계속 쓴다</text>

  <rect class="dg-row" x="368" y="164" width="328" height="52" rx="6"/>
  <text class="dg-k" x="388" y="186">-classpath 옵션</text>
  <text class="dg-s" x="388" y="206">이번 실행에만 경로를 직접 준다</text>

  <text class="dg-s" x="24" y="248">경로를 못 찾으면 ClassNotFoundException 이 난다</text>
</svg>
