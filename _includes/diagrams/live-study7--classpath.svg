<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 214" role="img" aria-labelledby="live-study7--classpath-title live-study7--classpath-desc">
  <title id="live-study7--classpath-title">클래스 로더가 클래스패스를 기준으로 클래스 파일을 찾는 흐름</title>
  <desc id="live-study7--classpath-desc">클래스 로더가 클래스패스를 기준으로 클래스 파일을 찾는 흐름</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-item" x="75" y="56" width="124" height="52" rx="6"/>
  <text class="dg-t" x="137" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">클래스 로더</text>
  <text class="dg-s" x="137" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">클래스가 필요해졌다</text>
  <rect class="dg-item" x="215" y="56" width="119" height="52" rx="6"/>
  <text class="dg-t" x="274" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">클래스패스</text>
  <text class="dg-s" x="274" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">이 경로들을 뒤진다</text>
  <rect class="dg-item" x="350" y="56" width="106" height="52" rx="6"/>
  <text class="dg-t" x="403" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">.class 발견</text>
  <text class="dg-s" x="403" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">메모리로 올린다</text>
  <rect class="dg-item" x="472" y="56" width="172" height="52" rx="6"/>
  <text class="dg-t" x="558" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CLASSPATH 환경변수</text>
  <text class="dg-s" x="558" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">시스템에 등록해 두고 계속 쓴다</text>
  <rect class="dg-item" x="274" y="122" width="172" height="52" rx="6"/>
  <text class="dg-t" x="360" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">-classpath 옵션</text>
  <text class="dg-s" x="360" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">이번 실행에만 경로를 직접 준다</text>
</svg>
