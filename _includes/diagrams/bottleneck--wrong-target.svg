<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="bottleneck--wrong-target-title bottleneck--wrong-target-desc">
  <title id="bottleneck--wrong-target-title">1차로 고친 두 지점은 재방문과 버튼 클릭 경로였고 사용자가 느리다고 한 첫 로딩 경로와 겹치지 않았다</title>
  <desc id="bottleneck--wrong-target-desc">1차로 고친 두 지점은 재방문과 버튼 클릭 경로였고 사용자가 느리다고 한 첫 로딩 경로와 겹치지 않았다</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">체감 변화 없음 — 겹치는 구간이 없…</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 내가 고친 경로 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="74" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">내가 고친 경로</text>
  <rect class="dg-item" x="147" y="200" width="202" height="52" rx="6"/>
  <text class="dg-t" x="248" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">탭 재방문 — 상세조회 5분 캐시</text>
  <rect class="dg-item" x="365" y="200" width="207" height="52" rx="6"/>
  <text class="dg-t" x="468" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">일괄 매핑 버튼 — 순차를 병렬로</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- 사용자가 느린 경로 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="91" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">사용자가 느린 경로</text>
  <rect class="dg-item" x="283" y="344" width="153" height="52" rx="6"/>
  <text class="dg-t" x="359" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">목록을 처음 여는 순간</text>
</svg>
