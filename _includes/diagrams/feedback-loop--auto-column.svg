<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 214" role="img" aria-labelledby="feedback-loop--auto-column-title feedback-loop--auto-column-desc">
  <title id="feedback-loop--auto-column-title">차트가 컨테이너를 재고 그린 결과가 auto 컬럼을 밀어 컨테이너가 넓어지고 차트가 다시 재측정하는 순환</title>
