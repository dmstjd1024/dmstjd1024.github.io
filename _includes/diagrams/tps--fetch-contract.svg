<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 214" role="img" aria-labelledby="tps--fetch-contract-title tps--fetch-contract-desc">
  <title id="tps--fetch-contract-title">앞 필터가 조회한 엔티티를 뒤 필터가 재사용하게 바꿨더니, 두 쿼리의 fetch 범위가 달라 권한 검사가 깨진 과정</title>
  <desc id="tps--fetch-contract-desc">앞 필터가 조회한 엔티티를 뒤 필터가 재사용하게 바꿨더니, 두 쿼리의 fetch 범위가 달라 권한 검사가 깨진 과정</desc>

  <defs>
