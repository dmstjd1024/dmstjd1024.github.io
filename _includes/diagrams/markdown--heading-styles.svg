<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="마크다운 제목을 쓰는 두 가지 방법과 각각이 표현할 수 있는 단계">
  <marker id="mdhs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">제목을 쓰는 두 가지 방법</text>

  <rect class="dg-lane" x="24" y="48" width="328" height="140" rx="10"/>
  <text class="dg-t" x="44" y="74"># 을 붙이는 방식</text>

  <rect class="dg-code" x="44" y="88" width="288" height="60" rx="6"/>
  <text class="dg-key" x="60" y="110"># 제목 1</text>
  <text class="dg-key" x="60" y="132">###### 제목 6</text>

  <text class="dg-b" x="44" y="172">1단계부터 6단계까지 쓸 수 있다</text>

  <rect class="dg-lane" x="368" y="48" width="328" height="140" rx="10"/>
  <text class="dg-t" x="388" y="74">밑줄을 긋는 방식</text>

  <rect class="dg-code" x="388" y="88" width="288" height="60" rx="6"/>
  <text class="dg-key" x="404" y="106">제목 1</text>
  <text class="dg-key" x="404" y="122">======</text>
  <text class="dg-key" x="404" y="140">제목 2  아래에는 ------</text>

  <text class="dg-v" x="388" y="172">1단계와 2단계만 된다</text>

  <text class="dg-v" x="24" y="220">둘 다 같은 결과가 나오지만, 밑줄 방식은 두 단계까지만 표현할 수 있다</text>
  <text class="dg-s" x="24" y="244">그래서 문서가 깊어지면 # 방식으로 통일하는 편이 낫다</text>
</svg>
