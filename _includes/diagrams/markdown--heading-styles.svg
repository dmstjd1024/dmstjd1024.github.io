  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"># 을 붙이는 방식</text>
  <rect class="dg-item" x="131" y="56" width="97" height="52" rx="6"/>
  <text class="dg-t" x="179" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle"># 제목 1</text>
  <text class="dg-s" x="179" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">###### 제목 6</text>
  <path class="dg-arw" d="M180,132 V170" marker-end="url(#markdown--heading-styles-arw-n)"/>

  <!-- 밑줄을 긋는 방식 -->
  <rect class="dg-zone" x="24" y="176" width="312" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="83" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">밑줄을 긋는 방식</text>
  <rect class="dg-item" x="89" y="200" width="181" height="52" rx="6"/>
  <text class="dg-t" x="179" y="222" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">제목 1</text>
  <text class="dg-s" x="179" y="239" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">====== · 제목 2  아래에는 ------</text>
