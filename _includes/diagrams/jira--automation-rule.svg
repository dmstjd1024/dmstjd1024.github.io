<svg xmlns="http://www.w3.org/2000/svg" class="dg-wide" viewBox="0 0 720 148" role="img" aria-labelledby="jira--automation-rule-title jira--automation-rule-desc">
  <title id="jira--automation-rule-title">자동화 규칙이 트리거, 조건, 액션 세 단계로 흐르는 구조</title>
  <desc id="jira--automation-rule-desc">자동화 규칙이 트리거, 조건, 액션 세 단계로 흐르는 구조</desc>

  <defs>
    <marker id="jira--automation-rule-arw-w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="16" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em"></text>
  <rect class="dg-item" x="121" y="56" width="230" height="52" rx="6"/>
  <text class="dg-t" x="236" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">액션 (Action)</text>
  <text class="dg-s" x="236" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">무엇을? · 담당자 지정 · 댓글 · Slack 알림…</text>
  <rect class="dg-item" x="367" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="483" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">매일 오전 10시 + 진행 중이며 생성…</text>
  <text class="dg-s" x="483" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">→ 최근 3일간 상태 변경이 없는 이슈를 고른다</text>
</svg>
