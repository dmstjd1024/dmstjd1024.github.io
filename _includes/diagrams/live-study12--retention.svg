<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="live-study12--retention-title live-study12--retention-desc">
  <title id="live-study12--retention-title">SOURCE, CLASS, RUNTIME 유지 정책이 각 단계에서 애노테이션을 어디까지 남기는지</title>
  <desc id="live-study12--retention-desc">SOURCE, CLASS, RUNTIME 유지 정책이 각 단계에서 애노테이션을 어디까지 남기는지</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- SOURCE -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="41" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SOURCE</text>
  <rect class="dg-item" x="200" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="248" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">남는다</text>
  <rect class="dg-item" x="312" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="360" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">사라짐</text>
  <rect class="dg-item" x="424" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="472" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">사라짐</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- CLASS -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="37" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CLASS</text>
  <rect class="dg-item" x="196" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="244" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">남는다</text>
  <rect class="dg-item" x="308" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="356" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">남는다</text>
  <rect class="dg-item" x="420" y="200" width="104" height="52" rx="6"/>
  <text class="dg-t" x="472" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">읽을 수 없음</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- RUNTIME -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="45" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">RUNTIME</text>
  <rect class="dg-item" x="196" y="344" width="96" height="52" rx="6"/>
  <text class="dg-t" x="244" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">남는다</text>
  <rect class="dg-item" x="308" y="344" width="96" height="52" rx="6"/>
  <text class="dg-t" x="356" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">남는다</text>
  <rect class="dg-item" x="420" y="344" width="104" height="52" rx="6"/>
  <text class="dg-t" x="472" y="375" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">읽을 수 있다</text>
</svg>
