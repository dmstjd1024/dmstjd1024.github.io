<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" role="img" aria-labelledby="k8s--pod-network-title k8s--pod-network-desc">
  <title id="k8s--pod-network-title">파드 네트워크가 로컬과 분리되어 있어 포트 포워딩이 필요한 구조</title>
  <desc id="k8s--pod-network-desc">파드 네트워크가 로컬과 분리되어 있어 포트 포워딩이 필요한 구조</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-item" x="112" y="56" width="163" height="52" rx="6"/>
  <text class="dg-t" x="193" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">내 컴퓨터</text>
  <text class="dg-s" x="193" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">localhost:80 · 으로 열어봐도</text>
  <rect class="dg-item" x="291" y="56" width="101" height="52" rx="6"/>
  <text class="dg-t" x="341" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">막혀 있다</text>
  <text class="dg-s" x="341" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">서로 분리된 망</text>
  <rect class="dg-item" x="408" y="56" width="199" height="52" rx="6"/>
  <text class="dg-t" x="507" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">파드 안으로 들어간다</text>
  <text class="dg-s" x="507" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubectl exec -it nginx-pod · -- bash</text>
  <rect class="dg-item" x="249" y="122" width="221" height="52" rx="6"/>
  <text class="dg-t" x="359" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">포트를 이어준다</text>
  <text class="dg-s" x="359" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">kubectl port-forward · pod/nginx-pod 80…</text>
  <path class="dg-arw" d="M360,198 V236" marker-end="url(#br-arw)"/>

  <!-- 파드 -->
  <rect class="dg-zone" x="24" y="242" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="236" width="32" height="12" rx="2"/>
  <text class="dg-s" x="44" y="245" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">파드</text>
  <rect class="dg-item" x="289" y="266" width="142" height="52" rx="6"/>
  <text class="dg-t" x="360" y="297" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nginx 컨테이너 : 80</text>
</svg>
