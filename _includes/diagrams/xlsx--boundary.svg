<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" role="img" aria-labelledby="xlsx--boundary-title xlsx--boundary-desc">
  <title id="xlsx--boundary-title">순수 로직과 렌더부를 나눠 라이브러리에 묶인 부분만 교체한 범위 확정</title>
  <desc id="xlsx--boundary-desc">순수 로직과 렌더부를 나눠 라이브러리에 묶인 부분만 교체한 범위 확정</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!--  -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-item" x="244" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">경계를 그어두니 도메인 규칙을 다시…</text>
  <text class="dg-s" x="360" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">기존 테스트도 절반 이상 그대로 살았다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 순수 로직 — 그대로 둔다 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="116" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">순수 로직 — 그대로 둔다</text>
  <rect class="dg-item" x="234" y="200" width="126" height="52" rx="6"/>
  <text class="dg-t" x="297" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">resolveCellValue</text>
  <rect class="dg-item" x="376" y="200" width="110" height="52" rx="6"/>
  <text class="dg-t" x="431" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">buildSheetAoa</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- 렌더부 — 여기만 교체 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="104" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">렌더부 — 여기만 교체</text>
  <rect class="dg-item" x="275" y="344" width="169" height="52" rx="6"/>
  <text class="dg-t" x="359" y="366" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">배열을 워크북으로 만들어</text>
  <text class="dg-s" x="359" y="383" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">파일로 내보낸다</text>
</svg>
