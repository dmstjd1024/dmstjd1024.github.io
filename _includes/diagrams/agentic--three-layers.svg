<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 358" role="img" aria-labelledby="agentic--three-layers-title agentic--three-layers-desc">
  <title id="agentic--three-layers-title">에이전틱 워크플로우 3계층: 프로세스(superpowers), 오케스트레이션(OMC), 지식(ECC rules)이 각각 다른 층을 맡고 컨텍스트 계층이 그 아래를 받친다</title>
  <desc id="agentic--three-layers-desc">에이전틱 워크플로우 3계층: 프로세스(superpowers), 오케스트레이션(OMC), 지식(ECC rules)이 각각 다른 층을 맡고 컨텍스트 계층이 그 아래를 받친다</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 역할이 다른 세 층 -->
  <rect class="dg-zone" x="24" y="32" width="672" height="166" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="87" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">역할이 다른 세 층</text>
  <rect class="dg-item" x="123" y="56" width="225" height="52" rx="6"/>
  <text class="dg-t" x="235" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">superpowers</text>
  <text class="dg-s" x="235" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">프로세스 — 절차 규율 · 코드를 쓰기 전에…</text>
  <rect class="dg-item" x="364" y="56" width="232" height="52" rx="6"/>
  <text class="dg-t" x="480" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OMC</text>
  <text class="dg-s" x="480" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">오케스트레이션 · 에이전트 여럿을 · 붙여 실행…</text>
  <rect class="dg-item" x="244" y="122" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="144" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">ECC rules</text>
  <text class="dg-s" x="360" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">지식 — 언어별 규칙 · 해당 언어 파일일 때만…</text>
  <path class="dg-arw" d="M360,198 V236" marker-end="url(#br-arw)"/>

  <!-- 그 아래 — 내가 쓴 컨텍스트 -->
  <rect class="dg-zone" x="24" y="242" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="236" width="129" height="12" rx="2"/>
  <text class="dg-s" x="44" y="245" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">그 아래 — 내가 쓴 컨텍스트</text>
  <rect class="dg-item" x="91" y="266" width="196" height="52" rx="6"/>
  <text class="dg-t" x="189" y="288" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">CLAUDE.md — 항상 참인 규칙만</text>
  <text class="dg-s" x="189" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">모든 대화에 실린다 · 11,823B</text>
  <rect class="dg-item" x="303" y="266" width="146" height="52" rx="6"/>
  <text class="dg-t" x="376" y="288" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">스킬 25개</text>
  <text class="dg-s" x="376" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">그 작업을 할 때만 읽힌다</text>
  <rect class="dg-item" x="465" y="266" width="163" height="52" rx="6"/>
  <text class="dg-t" x="546" y="288" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">훅</text>
  <text class="dg-s" x="546" y="305" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">모델 협조 없이 코드가 막는다</text>
</svg>
