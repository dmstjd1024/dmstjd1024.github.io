<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="이미지 풀 정책 세 가지와 태그에 따라 기본값이 달라져 ImagePullBackOff 가 나는 이유">
  <marker id="k8sipp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">ImagePullBackOff 가 났던 이유</text>

  <rect class="dg-lane" x="24" y="48" width="672" height="118" rx="10"/>
  <text class="dg-t" x="44" y="74">이미지 풀 정책</text>

  <rect class="dg-warn" x="44" y="88" width="204" height="62" rx="6"/>
  <text class="dg-k" x="60" y="110">Always</text>
  <text class="dg-s" x="60" y="130">로컬은 안 보고</text>
  <text class="dg-s" x="60" y="146">무조건 레지스트리에서</text>

  <rect class="dg-out" x="258" y="88" width="204" height="62" rx="6"/>
  <text class="dg-k" x="274" y="110">IfNotPresent</text>
  <text class="dg-s" x="274" y="130">로컬을 먼저 보고</text>
  <text class="dg-s" x="274" y="146">없으면 레지스트리에서</text>

  <rect class="dg-row" x="472" y="88" width="204" height="62" rx="6"/>
  <text class="dg-k" x="488" y="110">Never</text>
  <text class="dg-s" x="488" y="130">로컬에서만</text>

  <text class="dg-t" x="24" y="196">태그를 안 쓰면 기본값이 Always 가 된다</text>

  <rect class="dg-row" x="24" y="208" width="328" height="44" rx="6"/>
  <text class="dg-v" x="44" y="228">image: spring-server</text>
  <text class="dg-s" x="44" y="246">태그 없음 · latest → Always</text>

  <path class="dg-arw" d="M360 230 H400" marker-end="url(#k8sipp-a)"/>

  <rect class="dg-warn" x="408" y="208" width="288" height="44" rx="6"/>
  <text class="dg-k" x="428" y="228">로컬에 방금 빌드해 뒀는데도</text>
  <text class="dg-s" x="428" y="246">레지스트리를 뒤지다 실패한다</text>

  <rect class="dg-out" x="24" y="266" width="672" height="40" rx="8"/>
  <text class="dg-k" x="44" y="292">imagePullPolicy: IfNotPresent 로 바꾸면 로컬 이미지를 쓴다</text>
</svg>
