<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="하나의 클래스에서 new 로 여러 인스턴스가 만들어지는 관계">
  <marker id="ls5ci-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">클래스는 설계도, 인스턴스는 그것으로 찍어낸 것</text>

  <rect class="dg-lead" x="24" y="56" width="200" height="140" rx="10"/>
  <text class="dg-t" x="44" y="84">Account</text>
  <text class="dg-s" x="44" y="104">클래스 (설계도)</text>
  <rect class="dg-row" x="44" y="118" width="160" height="26" rx="4"/>
  <text class="dg-v" x="60" y="136">email</text>
  <rect class="dg-row" x="44" y="150" width="160" height="26" rx="4"/>
  <text class="dg-v" x="60" y="168">password</text>

  <path class="dg-arw" d="M232 92 H300" marker-end="url(#ls5ci-a)"/>
  <text class="dg-b" x="238" y="84">new</text>
  <path class="dg-arw" d="M232 126 H300" marker-end="url(#ls5ci-a)"/>
  <text class="dg-b" x="238" y="118">new</text>
  <path class="dg-arw" d="M232 160 H300" marker-end="url(#ls5ci-a)"/>
  <text class="dg-b" x="238" y="152">new</text>

  <rect class="dg-row" x="308" y="66" width="388" height="44" rx="8"/>
  <text class="dg-t" x="328" y="94">인스턴스 1</text>
  <text class="dg-v" x="450" y="94">a@mail.com</text>

  <rect class="dg-row" x="308" y="120" width="388" height="44" rx="8"/>
  <text class="dg-t" x="328" y="148">인스턴스 2</text>
  <text class="dg-v" x="450" y="148">b@mail.com</text>

  <rect class="dg-row" x="308" y="174" width="388" height="44" rx="8"/>
  <text class="dg-t" x="328" y="202">인스턴스 3</text>
  <text class="dg-v" x="450" y="202">c@mail.com</text>

  <text class="dg-v" x="24" y="252">설계도는 하나지만 찍어낸 것은 각자 다른 값을 갖는다</text>
  <text class="dg-s" x="24" y="278">클래스로부터 인스턴스를 만드는 것을 인스턴스화라고 한다</text>
</svg>
