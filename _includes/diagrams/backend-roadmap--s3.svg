<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 634" role="img" aria-labelledby="backend-roadmap--s3-title backend-roadmap--s3-desc">
  <title id="backend-roadmap--s3-title">3단계 데이터베이스와 API</title>
  <desc id="backend-roadmap--s3-desc">관계형 DB 에서 API 스타일, 인증, 웹 보안으로 이어지는 구간. PostgreSQL 만 추천이고 나머지는 대안이다.</desc>

