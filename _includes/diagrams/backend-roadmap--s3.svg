<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" role="img" aria-labelledby="backend-roadmap--s3-title backend-roadmap--s3-desc">
  <title id="backend-roadmap--s3-title">3단계 데이터베이스와 API</title>
  <desc id="backend-roadmap--s3-desc">관계형 DB 에서 공통 개념, API 스타일, 인증으로 이어지는 구간. PostgreSQL 만 추천이고 나머지는 대안이다.</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- 관계형 DB -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">관계형 DB</text>
  <rect class="dg-item" x="151" y="56" width="96" height="52" rx="6"/>
  <text class="dg-t" x="199" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL</text>
  <text class="dg-s" x="199" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">추천</text>
  <rect class="dg-item" x="263" y="56" width="169" height="52" rx="6"/>
  <text class="dg-t" x="347" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MySQL · MariaDB · SQLite</text>
  <text class="dg-s" x="347" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">대안</text>
  <rect class="dg-item" x="448" y="56" width="121" height="52" rx="6"/>
  <text class="dg-t" x="508" y="78" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MS SQL · Oracle</text>
  <text class="dg-s" x="508" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">대안</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- 같이 익히는 개념 -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="83" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">같이 익히는 개념</text>
  <rect class="dg-item" x="252" y="200" width="104" height="52" rx="6"/>
  <text class="dg-t" x="304" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">마이그레이션</text>
  <rect class="dg-item" x="372" y="200" width="96" height="52" rx="6"/>
  <text class="dg-t" x="420" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">N+1 문제</text>
  <path class="dg-arw" d="M360,276 V314" marker-end="url(#br-arw)"/>

  <!-- API 스타일 -->
  <rect class="dg-zone" x="24" y="320" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="314" width="58" height="12" rx="2"/>
  <text class="dg-s" x="44" y="323" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">API 스타일</text>
  <rect class="dg-item" x="215" y="344" width="121" height="52" rx="6"/>
  <text class="dg-t" x="275" y="366" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">REST · JSON API</text>
  <text class="dg-s" x="275" y="383" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">추천</text>
  <rect class="dg-item" x="352" y="344" width="153" height="52" rx="6"/>
  <text class="dg-t" x="428" y="366" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GraphQL · gRPC · SOAP</text>
  <text class="dg-s" x="428" y="383" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">순서 무관</text>
  <path class="dg-arw" d="M360,420 V458" marker-end="url(#br-arw)"/>

  <!-- 인증 -->
  <rect class="dg-zone" x="24" y="464" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="458" width="32" height="12" rx="2"/>
  <text class="dg-s" x="44" y="467" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">인증</text>
  <rect class="dg-item" x="106" y="488" width="96" height="52" rx="6"/>
  <text class="dg-t" x="154" y="519" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">JWT</text>
  <rect class="dg-item" x="218" y="488" width="96" height="52" rx="6"/>
  <text class="dg-t" x="266" y="519" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OAuth</text>
  <rect class="dg-item" x="330" y="488" width="158" height="52" rx="6"/>
  <text class="dg-t" x="409" y="519" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Basic · Token · Cookie</text>
  <rect class="dg-item" x="504" y="488" width="110" height="52" rx="6"/>
  <text class="dg-t" x="559" y="510" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenID · SAML</text>
  <text class="dg-s" x="559" y="527" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">순서 무관</text>
</svg>
