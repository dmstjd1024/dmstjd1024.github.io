<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="401 응답은 앱이 살아 있다는 증거인데 curl -f 가 이를 실패로 처리했다">
  <marker id="hc401-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="dg-h" x="24" y="30">401 이 증명하는 것</text>

  <rect class="dg-lane" x="24" y="48" width="672" height="96" rx="10"/>
  <text class="dg-t" x="44" y="74">응답이 401 로 돌아왔다는 뜻은</text>

  <rect class="dg-out" x="44" y="88" width="200" height="40" rx="6"/>
  <text class="dg-k" x="60" y="113">요청이 앱까지 도달했다</text>
  <rect class="dg-out" x="260" y="88" width="200" height="40" rx="6"/>
  <text class="dg-k" x="276" y="113">서블릿 컨테이너 생존</text>
  <rect class="dg-out" x="476" y="88" width="200" height="40" rx="6"/>
  <text class="dg-k" x="492" y="113">필터 체인 동작 중</text>

  <rect class="dg-warn" x="24" y="164" width="328" height="84" rx="8"/>
  <text class="dg-t" x="44" y="188">그런데 curl -f 는</text>
  <text class="dg-v" x="44" y="212">4xx 를 전부 실패로 본다</text>
  <text class="dg-s" x="44" y="234">정상 기동했는데 배포가 안 끝난다</text>

  <rect class="dg-out" x="368" y="164" width="328" height="84" rx="8"/>
  <text class="dg-t" x="388" y="188">헬스체크가 알고 싶은 것</text>
  <text class="dg-v" x="388" y="212">"앱이 떴는가"</text>
  <text class="dg-s" x="388" y="234">401 로 이미 충족된 질문이다</text>

  <text class="dg-s" x="24" y="272">인증이 걸린 엔드포인트를 헬스체크로 쓸 때는 상태 코드를 무엇으로 볼지 정해야 한다</text>
</svg>
