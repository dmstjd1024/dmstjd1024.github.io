  <text class="dg-s" x="484" y="95" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">예약은 기업당 1000개, 실사용은 10개 · 범위를…</text>
  <rect class="dg-item" x="120" y="122" width="232" height="52" rx="6"/>
