  <text class="dg-s" x="484" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">①~③은 기업 사이의 충돌 · 이건 한 기업 안에…</text>
  <rect class="dg-item" x="244" y="188" width="232" height="52" rx="6"/>
  <text class="dg-t" x="360" y="210" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">결국 고른 것 — 포트 재사용을 아예…</text>
  <text class="dg-s" x="360" y="227" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">항상 max(마지막 포트) + 1 부터 할당한다. 충…</text>
</svg>
