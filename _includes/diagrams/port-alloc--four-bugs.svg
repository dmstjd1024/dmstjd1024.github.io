  <text class="dg-s" x="236" y="161" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">findAll()이 다른 화면의 삭제 필터와 · 얽혀…</text>
  <rect class="dg-item" x="368" y="122" width="232" height="52" rx="6"/>
