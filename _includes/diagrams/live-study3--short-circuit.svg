<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" role="img" aria-labelledby="live-study3--short-circuit-title live-study3--short-circuit-desc">
  <title id="live-study3--short-circuit-title">논리 연산자가 결과가 확정되면 오른쪽을 평가하지 않고 건너뛰는 동작</title>
  <desc id="live-study3--short-circuit-desc">논리 연산자가 결과가 확정되면 오른쪽을 평가하지 않고 건너뛰는 동작</desc>

  <defs>
    <marker id="br-arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 z"/>
    </marker>
  </defs>

  <!-- ||  (OR) -->
  <rect class="dg-zone" x="24" y="32" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="26" width="49" height="12" rx="2"/>
  <text class="dg-s" x="44" y="35" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">||  (OR)</text>
  <rect class="dg-item" x="218" y="56" width="99" height="52" rx="6"/>
  <text class="dg-t" x="267" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">왼쪽이 true</text>
  <rect class="dg-item" x="333" y="56" width="169" height="52" rx="6"/>
  <text class="dg-t" x="417" y="87" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">오른쪽은 평가하지 않는다</text>
  <path class="dg-arw" d="M360,132 V170" marker-end="url(#br-arw)"/>

  <!-- &&  (AND) -->
  <rect class="dg-zone" x="24" y="176" width="672" height="100" rx="8"/>
  <rect class="dg-mask" x="40" y="170" width="53" height="12" rx="2"/>
  <text class="dg-s" x="44" y="179" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">&amp;&amp;  (AND)</text>
  <rect class="dg-item" x="215" y="200" width="104" height="52" rx="6"/>
  <text class="dg-t" x="267" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">왼쪽이 false</text>
  <rect class="dg-item" x="335" y="200" width="169" height="52" rx="6"/>
  <text class="dg-t" x="419" y="231" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">오른쪽은 평가하지 않는다</text>
</svg>
