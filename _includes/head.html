<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
    {% if page.url == "/index.html" %}
        Home
    {% elsif page_type == "category" %}
        {{ category_title }}
    {% else %}
        {{ page.title }}
    {% endif %}
</title>
{% seo %}

<link rel="shortcut icon" type="image/png" href="{{ site.logo_img | prepend: site.baseurl }}">
{%- comment -%}
  본문용 한글 서브셋만 미리 받는다. @font-face 정의는 style.scss 에 있고,
  이 preload 는 CSS 파싱을 기다리지 않고 폰트 요청을 앞당기는 역할이다.
  ext(나머지 한글)와 Poppins 는 실제로 필요할 때만 받게 두어 preload 하지 않는다.
{%- endcomment -%}
<link rel="preload" href="{{ '/assets/fonts/pretendard-core.woff2' | prepend: site.baseurl }}" as="font" type="font/woff2" crossorigin>

<meta name="baseurl" content="{{ site.baseurl }}">
<meta
name="description"
content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
