<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="생성된 bat 파일을 실행하면 로컬 서버가 뜨는 과정">
  <style>
    .bg  { fill:#fff; }
    .card{ fill:#f6f8fa; stroke:#d1d9e0; }
    .term{ fill:#161b22; stroke:#3d444d; }
    .h   { fill:#1f2328; font:600 13px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .m   { fill:#1f2328; font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .tm  { fill:#e6edf3; font:400 12.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .tg  { fill:#3fb950; font:400 12.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .tb  { fill:#79c0ff; font:400 12.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .s   { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .arw { stroke:#afb8c1; fill:none; stroke-width:1.5; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill:#0d1117; }
      .card{ fill:#151b23; stroke:#3d444d; }
      .h   { fill:#e6edf3; }
      .m   { fill:#e6edf3; }
      .s   { fill:#9198a1; }
      .arw { stroke:#565e68; }
    }
  </style>
  <rect class="bg" width="720" height="250"/>
  <marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <rect class="card" x="24" y="40" width="180" height="60" rx="8"/>
  <text class="m" x="44" y="76">blog.bat</text>
  <text class="s" x="24" y="30">더블클릭</text>

  <path class="arw" d="M212 70 H258" marker-end="url(#ba)"/>

  <rect class="term" x="266" y="34" width="430" height="118" rx="8"/>
  <text class="tg" x="286" y="60">&gt; bundle exec jekyll serve</text>
  <text class="tm" x="286" y="84">Server running...</text>
  <text class="tb" x="286" y="108">http://localhost:4000</text>
  <text class="tm" x="286" y="132">press ctrl-c to stop</text>

  <text class="s" x="24" y="196">루비 프롬프트를 열고 명령을 매번 입력할 필요 없이 파일 하나로 실행된다</text>
  <text class="s" x="24" y="220">브라우저에서 localhost:4000 으로 접속하면 블로그가 뜬다</text>
</svg>
