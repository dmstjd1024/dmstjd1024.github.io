<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="메모장에서 다른 이름으로 저장할 때 파일 이름과 형식을 지정하는 방법">
  <style>
    .bg  { fill:#fff; }
    .card{ fill:#f6f8fa; stroke:#d1d9e0; }
    .row { fill:#fff; stroke:#d1d9e0; }
    .hl  { fill:#ddf4ff; stroke:#0969da; }
    .h   { fill:#1f2328; font:600 14px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .k   { fill:#1f2328; font:600 13px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .m   { fill:#1f2328; font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .s   { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .b   { fill:#0969da; font:600 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill:#0d1117; }
      .card{ fill:#151b23; stroke:#3d444d; }
      .row { fill:#0d1117; stroke:#3d444d; }
      .hl  { fill:#121d2f; stroke:#4493f8; }
      .h   { fill:#e6edf3; }
      .k   { fill:#e6edf3; }
      .m   { fill:#e6edf3; }
      .s   { fill:#9198a1; }
      .b   { fill:#4493f8; }
    }
  </style>
  <rect class="bg" width="720" height="280"/>

  <text class="h" x="24" y="32">다른 이름으로 저장</text>

  <rect class="card" x="24" y="48" width="672" height="150" rx="10"/>

  <rect class="hl" x="44" y="68" width="632" height="42" rx="6"/>
  <text class="k" x="60"  y="94">파일 이름</text>
  <text class="m" x="200" y="94">blog.bat</text>
  <text class="b" x="560" y="94">확장자 .bat</text>

  <rect class="row" x="44" y="120" width="632" height="42" rx="6"/>
  <text class="k" x="60"  y="146">파일 형식</text>
  <text class="m" x="200" y="146">모든 파일 (*.*)</text>

  <text class="s" x="44" y="186">형식을 "모든 파일"로 바꾸지 않으면 blog.bat.txt 로 저장된다</text>

  <text class="s" x="24" y="238">원본 캡처 대신 재구성한 도식 · 실제 화면과 다를 수 있습니다</text>
</svg>
