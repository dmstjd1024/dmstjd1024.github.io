<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Jasypt 온라인 도구에서 평문을 암호화할 때 입력하는 세 항목">
  <style>
    .bg  { fill:#fff; }
    .card{ fill:#f6f8fa; stroke:#d1d9e0; }
    .row { fill:#fff; stroke:#d1d9e0; }
    .out { fill:#ddf4ff; stroke:#0969da; }
    .h   { fill:#1f2328; font:600 15px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .k   { fill:#1f2328; font:600 13px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .v   { fill:#656d76; font:400 12.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .s   { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .n   { fill:#0969da; font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .arw { stroke:#afb8c1; fill:none; stroke-width:1.5; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill:#0d1117; }
      .card{ fill:#151b23; stroke:#3d444d; }
      .row { fill:#0d1117; stroke:#3d444d; }
      .out { fill:#121d2f; stroke:#4493f8; }
      .h   { fill:#e6edf3; }
      .k   { fill:#e6edf3; }
      .v   { fill:#9198a1; }
      .s   { fill:#9198a1; }
      .n   { fill:#4493f8; }
      .arw { stroke:#565e68; }
    }
  </style>
  <rect class="bg" width="720" height="330"/>
  <marker id="ja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="h" x="24" y="34">암호화 입력값</text>

  <rect class="card" x="24" y="50" width="672" height="164" rx="10"/>

  <rect class="row" x="44" y="68" width="632" height="40" rx="6"/>
  <text class="n" x="60"  y="93">1</text>
  <text class="k" x="82"  y="93">Enter plain text to Encrypt</text>
  <text class="v" x="400" y="93">암호화할 평문</text>

  <rect class="row" x="44" y="116" width="632" height="40" rx="6"/>
  <text class="n" x="60"  y="141">2</text>
  <text class="k" x="82"  y="141">Select Type of Encryption</text>
  <text class="v" x="400" y="141">Two Way Encryption</text>

  <rect class="row" x="44" y="164" width="632" height="40" rx="6"/>
  <text class="n" x="60"  y="189">3</text>
  <text class="k" x="82"  y="189">Select Key To Be Used</text>
  <text class="v" x="400" y="189">사용할 secretKey</text>

  <path class="arw" d="M360 222 V246" marker-end="url(#ja)"/>

  <rect class="out" x="24" y="252" width="672" height="52" rx="8"/>
  <text class="k" x="44"  y="283">Encrypted String</text>
  <text class="v" x="200" y="283">ENC(...) 형태로 쓸 암호문이 나온다</text>
</svg>
