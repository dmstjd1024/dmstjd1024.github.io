<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Tomcat VM options 에 secretKey 를 외부 변수로 등록하는 방법">
  <style>
    .bg  { fill:#fff; }
    .card{ fill:#f6f8fa; stroke:#d1d9e0; }
    .code{ fill:#f6f8fa; stroke:#d1d9e0; }
    .h   { fill:#1f2328; font:600 14px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .k   { fill:#1f2328; font:600 13px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .m   { fill:#1f2328; font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .f   { fill:#8250df; font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .s   { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .path{ fill:#0969da; font:400 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .warn{ fill:#f6f8fa; stroke:#d1d9e0; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill:#0d1117; }
      .card{ fill:#151b23; stroke:#3d444d; }
      .code{ fill:#161b22; stroke:#3d444d; }
      .h   { fill:#e6edf3; }
      .k   { fill:#e6edf3; }
      .m   { fill:#e6edf3; }
      .f   { fill:#a371f7; }
      .s   { fill:#9198a1; }
      .path{ fill:#4493f8; }
      .warn{ fill:#151b23; stroke:#3d444d; }
    }
  </style>
  <rect class="bg" width="720" height="300"/>

  <text class="s" x="24" y="28">설정 위치</text>
  <text class="path" x="24" y="50">Run/Debug Configurations → Tomcat Server → VM options</text>

  <rect class="code" x="24" y="70" width="672" height="66" rx="8"/>
  <text class="f" x="44" y="100">-D</text>
  <text class="m" x="60" y="100">jasypt.encryptor.password=&quot;secretKey값&quot;</text>
  <text class="s" x="44" y="124">커스텀 변수로 등록하면 실행 시 이 값을 읽어 복호화한다</text>

  <rect class="warn" x="24" y="156" width="672" height="76" rx="8"/>
  <text class="k" x="44" y="184">주의</text>
  <text class="s" x="44" y="210">테스트를 돌릴 때에도 같은 설정 변수를 넣어야 동작한다</text>

  <text class="s" x="24" y="270">secretKey 를 소스에 넣지 않고 실행 환경에만 두는 방식이다</text>
</svg>
