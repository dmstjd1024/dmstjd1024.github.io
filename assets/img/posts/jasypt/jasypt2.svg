<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="application.yml 에서 암호문을 ENC 로 감싸 넣는 방법">
  <style>
    .bg  { fill:#fff; }
    .code{ fill:#f6f8fa; stroke:#d1d9e0; }
    .key { fill:#0550ae; font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .m   { fill:#1f2328; font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .enc { fill:#1a7f37; font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .cm  { fill:#656d76; font:400 12.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .h   { fill:#1f2328; font:600 14px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .s   { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill:#0d1117; }
      .code{ fill:#161b22; stroke:#3d444d; }
      .key { fill:#79c0ff; }
      .m   { fill:#e6edf3; }
      .enc { fill:#3fb950; }
      .cm  { fill:#9198a1; }
      .h   { fill:#e6edf3; }
      .s   { fill:#9198a1; }
    }
  </style>
  <rect class="bg" width="720" height="280"/>

  <text class="h" x="24" y="32">application.yml</text>

  <rect class="code" x="24" y="48" width="672" height="164" rx="8"/>
  <text class="key" x="44"  y="78">spring:</text>
  <text class="key" x="68"  y="102">datasource:</text>
  <text class="key" x="92"  y="126">username:</text>
  <text class="enc" x="188" y="126">ENC(암호화된_문자열)</text>
  <text class="key" x="92"  y="150">password:</text>
  <text class="enc" x="188" y="150">ENC(암호화된_문자열)</text>
  <text class="cm"  x="44"  y="188">복사한 Encrypted String 을 ENC( ) 안에 넣는다</text>

  <text class="s" x="24" y="244">배포 시 Jasypt 가 ENC( ) 안의 값을 자동으로 풀어서 읽는다</text>
  <text class="s" x="24" y="266">평문이 저장소에 남지 않으므로 그대로 커밋해도 된다</text>
</svg>
