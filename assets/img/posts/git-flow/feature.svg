<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Jira 이슈 번호로 feature 브랜치가 자동 생성되는 과정">
  <style>
    .bg  { fill:#fff; }
    .card{ fill:#f6f8fa; stroke:#d1d9e0; }
    .code{ fill:#f6f8fa; stroke:#d1d9e0; }
    .h   { fill:#1f2328; font:600 13px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .m   { fill:#1f2328; font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .g   { fill:#1a7f37; font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .s   { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .arw { stroke:#afb8c1; fill:none; stroke-width:1.5; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill:#0d1117; }
      .card{ fill:#151b23; stroke:#3d444d; }
      .code{ fill:#161b22; stroke:#3d444d; }
      .h   { fill:#e6edf3; }
      .m   { fill:#e6edf3; }
      .g   { fill:#3fb950; }
      .s   { fill:#9198a1; }
      .arw { stroke:#565e68; }
    }
  </style>
  <rect class="bg" width="720" height="240"/>
  <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
  </marker>

  <text class="s" x="24" y="30">Jira 이슈</text>
  <rect class="card" x="24" y="44" width="260" height="56" rx="8"/>
  <text class="m" x="44" y="78">PROJ-12  로그인 API 구현</text>

  <path class="arw" d="M300 72 H352" marker-end="url(#fa)"/>
  <text class="s" x="326" y="62" text-anchor="middle">자동 생성</text>

  <text class="s" x="368" y="30">feature 브랜치</text>
  <rect class="card" x="368" y="44" width="328" height="56" rx="8"/>
  <text class="g" x="388" y="78">feature/PROJ-12-로그인-API-구현</text>

  <rect class="code" x="24" y="128" width="672" height="76" rx="8"/>
  <text class="m" x="44" y="156">$ git flow feature start PROJ-12</text>
  <text class="s" x="44" y="182">이슈를 고르면 IntelliJ 가 이 명령을 대신 실행해 브랜치를 만든다</text>
</svg>
