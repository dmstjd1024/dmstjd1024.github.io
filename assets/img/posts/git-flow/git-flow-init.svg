<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" role="img" aria-label="git flow 의 다섯 브랜치 구조와 각 브랜치의 역할">
  <style>
    .bg  { fill:#fff; }
    .lane{ fill:#f6f8fa; }
    .t   { fill:#1f2328; font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .d   { fill:#656d76; font:400 12.5px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .s   { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .ln  { stroke-width:2.5; fill:none; }
    .master  { stroke:#8250df; }
    .develop { stroke:#0969da; }
    .feature { stroke:#1a7f37; }
    .release { stroke:#bf8700; }
    .hotfix  { stroke:#cf222e; }
    .join { stroke:#afb8c1; stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
    @media (prefers-color-scheme: dark) {
      .bg  { fill:#0d1117; }
      .lane{ fill:#151b23; }
      .t   { fill:#e6edf3; }
      .d   { fill:#9198a1; }
      .s   { fill:#9198a1; }
      .master  { stroke:#a371f7; }
      .develop { stroke:#4493f8; }
      .feature { stroke:#3fb950; }
      .release { stroke:#d29922; }
      .hotfix  { stroke:#f85149; }
      .join { stroke:#565e68; }
    }
  </style>
  <rect class="bg" width="820" height="360"/>

  <rect class="lane" x="140" y="48"  width="660" height="46" rx="6"/>
  <rect class="lane" x="140" y="152" width="660" height="46" rx="6"/>
  <rect class="lane" x="140" y="256" width="660" height="46" rx="6"/>

  <!-- master -->
  <text class="t" x="24" y="76">master</text>
  <text class="d" x="24" y="94">배포</text>
  <line class="ln master" x1="160" y1="71" x2="780" y2="71"/>
  <circle cx="300" cy="71" r="5" fill="#8250df"/>
  <circle cx="620" cy="71" r="5" fill="#8250df"/>

  <!-- release -->
  <text class="t" x="24" y="128">release</text>
  <text class="d" x="24" y="146">품질 검사</text>
  <line class="ln release" x1="480" y1="123" x2="620" y2="123"/>
  <path class="join" d="M480 175 V123"/>
  <path class="join" d="M620 123 V71"/>
  <path class="join" d="M620 123 V175"/>

  <!-- develop -->
  <text class="t" x="24" y="180">develop</text>
  <text class="d" x="24" y="198">개발 통합</text>
  <line class="ln develop" x1="160" y1="175" x2="780" y2="175"/>
  <circle cx="360" cy="175" r="5" fill="#0969da"/>

  <!-- feature -->
  <text class="t" x="24" y="232">feature</text>
  <text class="d" x="24" y="250">기능 개발</text>
  <line class="ln feature" x1="220" y1="227" x2="360" y2="227"/>
  <path class="join" d="M220 175 V227"/>
  <path class="join" d="M360 227 V175"/>

  <!-- hotfix -->
  <text class="t" x="24" y="284">hotfix</text>
  <text class="d" x="24" y="302">긴급 수정</text>
  <line class="ln hotfix" x1="680" y1="279" x2="760" y2="279"/>
  <path class="join" d="M680 71 V279"/>
  <path class="join" d="M760 279 V71"/>

  <text class="s" x="24" y="340">feature 는 develop 에서 갈라져 develop 으로 합쳐지고, hotfix 는 master 에서 갈라져 master 로 돌아온다</text>
</svg>
