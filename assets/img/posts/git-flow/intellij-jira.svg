<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="IntelliJ 에서 Jira 서버를 연결할 때 입력하는 항목 목록">
  <style>
    .bg   { fill:#fff; }
    .card { fill:#f6f8fa; stroke:#d1d9e0; }
    .row  { fill:#fff; stroke:#d1d9e0; }
    .h    { fill:#1f2328; font:600 15px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .k    { fill:#1f2328; font:600 13px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .v    { fill:#656d76; font:400 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .s    { fill:#656d76; font:400 12px ui-sans-serif,-apple-system,'Pretendard',sans-serif; }
    .path { fill:#0969da; font:400 12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill:#0d1117; }
      .card { fill:#151b23; stroke:#3d444d; }
      .row  { fill:#0d1117; stroke:#3d444d; }
      .h    { fill:#e6edf3; }
      .k    { fill:#e6edf3; }
      .v    { fill:#9198a1; }
      .s    { fill:#9198a1; }
      .path { fill:#4493f8; }
    }
  </style>
  <rect class="bg" width="700" height="300"/>

  <text class="s" x="24" y="30">IntelliJ 설정 경로</text>
  <text class="path" x="24" y="52">Settings → Tools → Tasks → Servers → Add → JIRA</text>

  <rect class="card" x="24" y="72" width="652" height="196" rx="10"/>
  <text class="h" x="44" y="102">입력 항목</text>

  <rect class="row" x="44" y="118" width="612" height="38" rx="6"/>
  <text class="k" x="60"  y="142">Server URL</text>
  <text class="v" x="220" y="142">https://&lt;조직&gt;.atlassian.net</text>

  <rect class="row" x="44" y="164" width="612" height="38" rx="6"/>
  <text class="k" x="60"  y="188">Username</text>
  <text class="v" x="220" y="188">Jira 계정 이메일</text>

  <rect class="row" x="44" y="210" width="612" height="38" rx="6"/>
  <text class="k" x="60"  y="234">API Token</text>
  <text class="v" x="220" y="234">Atlassian 에서 발급한 토큰</text>

  <text class="s" x="24" y="288">원본 캡처 대신 재구성한 도식 · 실제 화면과 다를 수 있습니다</text>
</svg>
