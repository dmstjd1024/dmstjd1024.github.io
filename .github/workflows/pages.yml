# GitHub Pages 배포
#
# 기본 제공 빌드(build_type: legacy)를 쓰면 GitHub 이 Jekyll 3.10 + 옛 Ruby
# Sass 로 빌드한다. 로컬은 Gemfile 대로 Jekyll 4 를 쓰므로 둘이 어긋나,
# 로컬에서 통과한 코드가 배포에서만 깨지는 일이 실제로 두 번 있었다
# (min() 이 Sass 내장 함수로 해석돼 빌드 실패, 카테고리 글 수 오계산).
#
# 이 워크플로는 저장소의 Gemfile 그대로 빌드해 배포한다. 로컬과 배포가
# 같은 버전을 쓰므로 그 차이가 사라진다.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  # 실패했을 때 코드 변경 없이 다시 돌릴 수 있게 수동 실행도 열어 둔다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 연달아 push 해도 순서가 꼬이지 않는다.
# 진행 중인 배포는 취소하지 않는다 — 중간에 끊기면 사이트가 반쯤 반영된
# 상태로 남을 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # 러너 기본 Ruby 는 시간이 지나며 바뀐다. 고정해 두지 않으면
          # 코드를 건드리지 않았는데 어느 날 빌드가 깨질 수 있다.
          ruby-version: '3.3'
          # Gemfile.lock 에 적힌 버전 그대로 설치하고 결과를 캐시한다.
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build
        # JEKYLL_ENV=production 이어야 jekyll-seo-tag 등이 실제 도메인을
        # 기준으로 링크를 만든다.
        #
        # --baseurl 은 넘기지 않는다. 이 저장소는 <user>.github.io 라
        # 사이트가 도메인 루트에 붙고, _config.yml 의 baseurl 도 비어 있다.
        # 여기서 값을 덮어쓰면 모든 링크 앞에 경로가 붙어 오히려 깨진다.
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
